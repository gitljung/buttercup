= "ss_key", DAYS = 30;
  var g = document.getElementById('g'), pw = document.getElementById('pw'), err = document.getElementById('err'), wait = document.getElementById('wait');
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function enc(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function show() { wait.style.display = 'none'; g.classList.add('on'); pw.focus(); }
  if (!window.crypto || !crypto.subtle) { wait.textContent = 'Sidan kräver https och en modern webbläsare.'; return; }
  async function derive(p) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function openWith(key) {
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(DATA));
    var html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  }
  async function remember(key) {
    try { var raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)); localStorage.setItem(KEY, JSON.stringify({ k: enc(raw), s: SALT, exp: Date.now() + DAYS * 864e5 })); } catch (e) {}

    try {
      var st = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (st && st.s === SALT && st.exp > Date.now()) {
        var key = await crypto.subtle.importKey('raw', b64(st.k), { name: 'AES-GCM' }, true, ['decrypt']);
        await openWith(key); return;
      }
    } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} }
    show();
  })();
  g.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.textContent = '';
    var key;
    try { key = await derive(pw.value); var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(DATA)); }

      g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
