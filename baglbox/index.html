<style>
:root{--ink:#151514;--paper:#fff;--board:#f5f4f1;--muted:#55524d;--rule:#cfccc5;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif;color-scheme:light}
html,body{margin:0;height:100%;background:var(--board);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;top:0;right:0;bottom:0;left:352px}
#stage canvas{display:block;touch-action:none}
.panel{position:fixed;left:16px;top:16px;bottom:16px;width:320px;box-sizing:border-box;background:var(--paper);
  border:1px solid var(--rule);padding:22px 20px 18px;overflow:auto;z-index:5}
.brand{font-family:var(--display);font-weight:600;font-size:40px;letter-spacing:.42em;margin:0;line-height:1}
.brand-sub{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.42em;margin:8px 0 4px}

.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sizes button{font-family:var(--display);border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 4px 8px;cursor:pointer;text-align:center}
.sizes button b{display:block;font-size:30px;font-weight:600;letter-spacing:.04em;line-height:1}

.sizes button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.ppl{font-size:13px;color:var(--muted);margin:8px 0 0}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.row label,.row .lab{flex:0 0 64px;color:var(--muted);font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
.row output{flex:0 0 42px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.seg{display:flex;flex:1;border:1px solid var(--ink)}
.seg button{flex:1;font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:12px;border:0;background:var(--paper);color:var(--ink);padding:6px 0;cursor:pointer}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:12px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 10px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--paper)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.list{font-size:13px;line-height:1.4;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ebe8e2;padding:5px 0}
.list li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.list li.head{border-bottom:1px solid var(--ink);font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:12px;padding-top:12px}

.note{font-size:11px;color:var(--muted);line-height:1.45;margin:16px 0 0}

.dim{font-family:var(--display);font-size:12px;letter-spacing:.08em;background:var(--paper);border:1px solid var(--ink);padding:1px 6px;white-space:nowrap;color:var(--ink)}

  <h2>Innehåll</h2>
  <ul class="list" id="list"></ul>

  <h2>Export</h2>
  <div class="btns">
    <button class="btn" id="xpng" type="button">Bild (PNG)</button>
    <button class="btn" id="xglb" type="button">3D (GLB)</button>

</aside>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);

const mm = m => Math.round(m * 1000);
function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

const INK = '#151514', PAPER = '#ffffff', BOARD = '#f5f4f1';
const FINISH = { svart: { n: 'Svart', c: '#1b1b1a' }, vit: { n: 'Vit', c: '#f4f3ef' }, kraft: { n: 'Kraft', c: '#b0875c' } };

/* ---------- Innehåll (från bagl.se) ---------- */
const BAGELS = [
  { k: 'PLN', n: 'Plain', seeds: [] },
  { k: 'SES', n: 'Sesame', seeds: [['sesame', 230]] },
  { k: 'EVR', n: 'Everything', seeds: [['sesame', 90], ['poppy', 120], ['onion', 30], ['salt', 22]] },
  { k: 'POP', n: 'Poppy', seeds: [['poppy', 340]] },
  { k: 'SSG', n: 'Sausage sesame', seeds: [['sesame', 150], ['sausage', 16]] },
  { k: 'VBJ', n: 'Västerbotten jalapeño', seeds: [['cheese', 14], ['jalapeno', 12]], tint: '#ffe7c4' },
];
const FOOD = {
  plain:        { n: 'Plain schmear', g: 'schmear', c: '#f4efe4' },
  dpc:          { n: 'Dill pickle chive', g: 'schmear', c: '#eef0dd', sp: ['#5f8a3a', '#3e6a2b'] },
  sot:          { n: 'Sundried tomato', g: 'schmear', c: '#f3d8c6', sp: ['#b8432f', '#8f2c22'] },
  vbj:          { n: 'Västerbotten jalapeño', g: 'schmear', c: '#f4e6bb', sp: ['#5c8a34', '#d9993a'] },
  lox:          { n: 'Kallrökt lax', g: 'fold', c: '#f0875a', st: '#ffd6c2' },
  pastrami:     { n: 'Pastrami', g: 'fold', c: '#7f322b', st: '#d58c84', edge: '#2a1b17' },
  skinka:       { n: 'Rökt skinka', g: 'fold', c: '#e7a39e', st: '#f8dad6' },
  emmentaler:   { n: 'Emmentaler', g: 'slices', c: '#f1dc8c' },
  vasterbotten: { n: 'Västerbottensost', g: 'cubes', c: '#f1d27a' },
  kapris:       { n: 'Kapris', g: 'balls', c: '#6b7a37' },
  rodlok:       { n: 'Picklad rödlök', g: 'rings', c: '#c24f8d' },
  gurka:        { n: 'Gurka', g: 'discs', c: '#d4e5a8', rim: '#46732f' },
  saltgurka:    { n: 'Saltgurka', g: 'spears', c: '#8b9a45' },
  dill:         { n: 'Dill', g: 'fluff', c: '#7ea94b' },
  citron:       { n: 'Citron', g: 'wedges', c: '#f2d33b' },
  tomat:        { n: 'Tomat', g: 'discs', c: '#e0563f', rim: '#b52a1e' },
  gront:        { n: 'Sallad', g: 'leaves', c: '#78ad4c' },
};
const BOXES = {
  6:  { key: '06', name: 'Lox Box', ppl: '6 bagels · 4–6 personer', mix: 1, trays: [
        { sub: 'LOX BOX', sections: [{ t: 'bagels', n: 6 }, { t: 'cups', rows: 2, items: ['plain', 'dpc', 'lox', 'kapris', 'rodlok', 'gurka', 'dill', 'citron'] }, { t: 'cutlery', n: 6 }] }] },
  12: { key: '12', name: 'Deli Box', ppl: '12 bagels · 8–10 personer', mix: 2, trays: [
        { sub: 'DELI BOX', sections: [{ t: 'bagels', n: 12 }, { t: 'cups', rows: 2, items: ['plain', 'dpc', 'sot', 'lox', 'lox', 'pastrami', 'emmentaler', 'saltgurka', 'rodlok', 'citron'] }, { t: 'cutlery', n: 12 }] }] },
  24: { key: '24', name: 'Full Spread', ppl: '24 bagels · 16–20 personer', mix: 4, trays: [
        { sub: 'FULL SPREAD · 1/2', sections: [{ t: 'bagels', n: 12 }, { t: 'bagels', n: 12 }, { t: 'cups', rows: 1, items: ['plain', 'dpc', 'sot', 'vbj'] }] },
        { sub: 'FULL SPREAD · 2/2', sections: [{ t: 'cups', rows: 2, items: ['lox', 'lox', 'pastrami', 'skinka', 'emmentaler', 'vasterbotten', 'saltgurka', 'rodlok', 'kapris', 'tomat', 'gront', 'citron'] }, { t: 'cutlery', n: 24 }] }] },
};

const S = { size: 12, lid: 110, p: 0.86, finish: 'svart', dims: true, playing: false };

/* ---------- Renderare ---------- */
const stage = $('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); }
catch (e) { document.body.insertAdjacentHTML('beforeend', '<p class="err">3D-grafik (WebGL) kunde inte starta i den här webbläsaren.</p>'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
Object.assign(labelR.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none' });
stage.appendChild(labelR.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BOARD);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.48; controls.minDistance = 0.25; controls.maxDistance = 6;
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(-1.1, 2.6, 1.7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.004;
Object.assign(sun.shadow.camera, { left: -1.3, right: 1.3, top: 1.3, bottom: -1.3, near: 0.1, far: 8 });
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0xe9e5db, 0.55));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.15 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

/* ---------- Texturer ---------- */
const FONT = w => `${w} {S}px "Barlow Condensed","Arial Narrow",sans-serif`;
function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
// text med spärrning (letter-spacing), ritas tecken för tecken
function spaced(g, text, x, y, size, weight, track, align, draw = true) {
  g.font = FONT(weight).replace('{S}', size);
  const ch = [...text], ws = ch.map(c => g.measureText(c).width), sp = size * track;
  const w = ws.reduce((a, b) => a + b, 0) + sp * (ch.length - 1);
  if (!draw) return w;
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ch.forEach((c, i) => { g.fillText(c, cx, y); cx += ws[i] + sp; });
  return w;
}
function logoTex(L, D, sub, tag) {
  const W = 2048, H = Math.max(256, Math.round(2048 * D / L));
  return canvasTex(W, H, g => {
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H); g.fillStyle = INK; g.textBaseline = 'alphabetic';
    let size = H * 0.36; const w = spaced(g, 'BAGL', 0, 0, size, 600, 0.5, 'center', false);
    if (w > W * 0.6) size *= W * 0.6 / w;
    const y = H * 0.52 + size * 0.3;
    spaced(g, 'BAGL', W / 2 + size * 0.25, y, size, 600, 0.5, 'center');
    spaced(g, 'NYC STYLE BAGELS', W / 2 + size * 0.03, y + size * 0.34, size * 0.12, 500, 0.6, 'center');
    const s = Math.max(18, size * 0.075);
    spaced(g, tag, W * 0.035, H * 0.05 + s, s, 600, 0.3, 'left');
    spaced(g, sub, W * 0.965, H * 0.05 + s, s, 600, 0.3, 'right');
    g.fillRect(W * 0.035, H * 0.905, W * 0.93, Math.max(2, H * 0.004));
    spaced(g, 'GOOD BAGELS → GOOD DAYS', W * 0.035, H * 0.955, s * 0.9, 500, 0.3, 'left');
    spaced(g, 'BOILED · BAKED · EVERY HOUR', W * 0.965, H * 0.955, s * 0.9, 500, 0.3, 'right');
  });
}
function insideTex(L, D, tag) {
  const W = 2048, H = Math.max(256, Math.round(2048 * D / L));
  return canvasTex(W, H, g => {
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H); g.fillStyle = INK; g.textBaseline = 'alphabetic';
    let size = H * 0.2; const w = spaced(g, 'GOOD BAGELS', 0, 0, size, 600, 0.12, 'center', false);
    if (w > W * 0.8) size *= W * 0.8 / w;
    spaced(g, 'GOOD BAGELS', W / 2, H * 0.44, size, 600, 0.12, 'center');
    spaced(g, '→ GOOD DAYS', W / 2, H * 0.44 + size * 1.02, size, 600, 0.12, 'center');
    const s = Math.max(16, size * 0.16);
    spaced(g, 'RECIPE FROM 1911 · HELSINGBORG', W / 2, H * 0.44 + size * 1.55, s, 500, 0.45, 'center');
    spaced(g, 'BAGL ' + tag, W / 2, H * 0.12 + s, s, 600, 0.45, 'center');
  });
}
function skirtTex(L, h, tag, name) {
  const W = 2048, H = Math.max(48, Math.round(2048 * h / L));
  return canvasTex(W, H, g => {
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H); g.fillStyle = INK; g.textBaseline = 'middle';
    const s = H * 0.42;
    spaced(g, `${tag} · ${name}`, W * 0.03, H * 0.52, s, 600, 0.3, 'left');
    spaced(g, 'OPEN UNTIL SOLD OUT', W * 0.97, H * 0.52, s, 500, 0.3, 'right');
  });
}
const stickerTex = canvasTex(512, 512, (g, W, H) => {
  g.clearRect(0, 0, W, H); g.fillStyle = INK; g.beginPath(); g.arc(W / 2, H / 2, W / 2 - 2, 0, Math.PI * 2); g.fill();
  g.fillStyle = PAPER; g.textBaseline = 'alphabetic';
  spaced(g, 'BAGL', W / 2 + 20, H * 0.56, 120, 600, 0.35, 'center');
  spaced(g, 'NYC', W / 2 + 8, H * 0.72, 40, 500, 0.5, 'center');
});
const tissueTex = canvasTex(512, 512, (g, W, H) => {
  g.fillStyle = '#fbfbf8'; g.fillRect(0, 0, W, H); g.fillStyle = INK; g.textBaseline = 'middle';
  for (let r = 0; r < 4; r++) {
    const y = H * (r + 0.5) / 4, off = (r % 2) * W / 4;
    for (let k = -1; k < 3; k++) spaced(g, 'BAGL', off + k * W / 2 + W / 4, y, 58, 600, 0.35, 'center');
  }
}, true);
function speckTex(base, specks) {
  return canvasTex(256, 256, (g, W, H) => {
    g.fillStyle = base; g.fillRect(0, 0, W, H);
    const r = rng(base.length * 97 + (specks ? specks.length : 0));
    for (let i = 0; i < 1400; i++) { g.globalAlpha = 0.07; g.fillStyle = r() < 0.5 ? '#ffffff' : '#c9c1b0'; g.beginPath(); g.arc(r() * W, r() * H, 1 + r() * 5, 0, 7); g.fill(); }
    g.globalAlpha = 1;
    if (specks) for (let i = 0; i < 420; i++) { g.fillStyle = specks[i % specks.length]; g.fillRect(r() * W, r() * H, 1.5 + r() * 3.5, 1 + r() * 2.5); }
  }, true);
}
function stripeTex(base, stripe, edge) {
  return canvasTex(256, 128, (g, W, H) => {
    g.fillStyle = base; g.fillRect(0, 0, W, H); g.strokeStyle = stripe; g.globalAlpha = 0.75;
    for (let i = -4; i < 14; i++) { g.lineWidth = 3 + (i % 3) * 2; g.beginPath(); for (let x = 0; x <= W; x += 8) { const y = i * 14 + x * 0.35 + Math.sin(x / 23 + i) * 5; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
    g.globalAlpha = 1; if (edge) { g.fillStyle = edge; g.fillRect(0, 0, W, 9); g.fillRect(0, H - 9, W, 9); }
  });
}
const holesTex = canvasTex(256, 256, (g, W, H) => {
  g.fillStyle = '#f1dc8c'; g.fillRect(0, 0, W, H); const r = rng(5);
  for (let i = 0; i < 9; i++) { const x = r() * W, y = r() * H, s = 10 + r() * 18; g.fillStyle = '#d9bf62'; g.beginPath(); g.ellipse(x, y, s, s * 0.8, 0, 0, 7); g.fill(); g.fillStyle = '#c9ad52'; g.beginPath(); g.ellipse(x + 2, y + 2, s * 0.7, s * 0.55, 0, 0, 7); g.fill(); }
});
function uvScale(geo, su, sv) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv); return geo; }

/* ---------- Material ---------- */
const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.7 }, o));
const EXT = mat(FINISH.svart.c, { roughness: 0.75 });
const WHITE = mat('#fbfaf7', { roughness: 0.85 });
const LIDW = mat('#ffffff', { roughness: 0.8 });
const TISSUE = new THREE.MeshStandardMaterial({ map: tissueTex, roughness: 0.95, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1 });
const PLASTIC = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, roughness: 0.06, metalness: 0, side: THREE.DoubleSide, depthWrite: false, clearcoat: 1 });
const PRINT = t => new THREE.MeshStandardMaterial({ map: t, roughness: 0.8, polygonOffset: true, polygonOffsetFactor: -2 });

/* ---------- Bagel ---------- */
const BR = 0.034, Br = 0.02, BSZ = 0.88;
const bagelGeo = (() => {

    scene.remove(ROOT);
    ROOT.traverse(o => { if (o.element) o.element.remove(); });
    BUILT.textures.forEach(t => t.dispose()); BUILT.textures = [];
  }
  const cfg = BOXES[S.size];
  ROOT = new THREE.Group(); ROOT.name = 'BAGL_Box_' + cfg.key; ITEMS = []; LIDS = []; TRAYS = [];
  const plans = cfg.trays.map(plan);
  const iL = Math.max(...plans.flat().map(s => s.len)) + 0.02;
  const iD = Math.max(...plans.map(p => p.reduce((a, s) => a + s.depth, 0))) + 0.008;
  const iH = BAG_H + 0.008;
  const queue = bagelQueue(cfg), gap = 0.14;
  const total = cfg.trays.length * (iL + 0.016) + (cfg.trays.length - 1) * gap;
  cfg.trays.forEach((spec, i) => {
    const t = buildTray(plans[i], iL, iD, iH, cfg, spec, queue, 1000 * S.size + i * 7919, ITEMS);
    t.root.position.x = -total / 2 + (iL + 0.016) / 2 + i * (iL + 0.016 + gap);
    ROOT.add(t.root); LIDS.push(t.pivot); TRAYS.push(t);
  });
  scene.add(ROOT);
  frame(); apply(); renderList(cfg); setDims();
}
function frame() {
  const cfg = BOXES[S.size], n = cfg.trays.length, o = TRAYS[0].outer;
  const w = n * o.L + (n - 1) * 0.14, size = Math.max(w, o.D * 1.6);
  const fov = camera.fov * DEG, asp = Math.max(0.6, camera.aspect || 1);
  const dist = (size * 0.62) / Math.tan(fov / 2) / Math.min(1, asp * 0.95) + 0.15;
  const dir = new THREE.Vector3(0.42, 0.74, 1).normalize();
  controls.target.set(0, 0.06, 0.02);
  camera.position.copy(dir.multiplyScalar(dist)).add(controls.target);
  controls.update();
  const r = size * 0.75 + 0.3; Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r }); sun.shadow.camera.updateProjectionMatrix();
}
function apply() {
  const N = ITEMS.length;
  ITEMS.forEach((it, i) => {
    const t0 = (i / N) * 0.78, e = ease(clamp((S.p - t0) / 0.07));
    it.visible = e > 0.001; it.position.y = it.userData.base.y + (1 - e) * 0.26;
  });
  const lc = ease(clamp((S.p - 0.86) / 0.14)), a = S.lid * (1 - lc);
  LIDS.forEach(l => l.rotation.x = -a * DEG);
  $('lido').textContent = Math.round(a) + '°';
  $('packo').textContent = Math.round(S.p * 100) + ' %';
  $('pack').value = Math.round(S.p * 1000);
}
function setDims() { ROOT.traverse(o => { if (o.userData.dims) o.visible = S.dims; }); }

/* ---------- Innehållslista ---------- */
function renderList(cfg) {
  const li = (a, b, cls = '') => `<li class="${cls}"><span>${a}</span><span>${b}</span></li>`;
  let h = li('Bagels', cfg.trays.reduce((a, t) => a + t.sections.filter(s => s.t === 'bagels').reduce((x, s) => x + s.n, 0), 0) + ' st', 'head');
  BAGELS.forEach(b => h += li(b.n, '× ' + cfg.mix));
  const cnt = {}; cfg.trays.forEach(t => t.sections.filter(s => s.t === 'cups').forEach(s => s.items.forEach(k => cnt[k] = (cnt[k] || 0) + 1)));
  const sch = Object.keys(cnt).filter(k => FOOD[k].g === 'schmear'), rest = Object.keys(cnt).filter(k => FOOD[k].g !== 'schmear');
  h += li('Schmears', sch.length + ' koppar', 'head'); sch.forEach(k => h += li(FOOD[k].n, '× ' + cnt[k]));
  h += li('Pålägg', rest.reduce((a, k) => a + cnt[k], 0) + ' koppar', 'head'); rest.forEach(k => h += li(FOOD[k].n, '× ' + cnt[k]));
  h += li('Övrigt', '', 'head') + li('Bestick och servetter', 'för ' + (S.size === 6 ? 6 : S.size === 12 ? 10 : 20));
  h += li(cfg.trays.length > 1 ? 'Lådor (stängda)' : 'Låda (stängd)', '', 'head');
  TRAYS.forEach((t, i) => h += li(cfg.trays.length > 1 ? `Låda ${i + 1}` : 'B × D × H', `${mm(t.outer.L)} × ${mm(t.outer.D)} × ${mm(t.outer.H)} mm`));
  $('list').innerHTML = h;
  $('ppl').textContent = `${cfg.key} ${cfg.name} · ${cfg.ppl}`;
}

/* ---------- UI ---------- */
const sizeBtns = Object.keys(BOXES).map(k => {
  const c = BOXES[k], b = document.createElement('button'); b.type = 'button';
  b.innerHTML = `<b>${c.key}</b><span>${c.name}</span>`;
  b.addEventListener('click', () => { S.size = +k; sizeBtns.forEach(x => x.setAttribute('aria-pressed', x === b)); build(); });
  b.setAttribute('aria-pressed', +k === S.size); $('sizes').appendChild(b); return b;
});
const finBtns = Object.keys(FINISH).map(k => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = FINISH[k].n;
  b.addEventListener('click', () => { S.finish = k; EXT.color.set(FINISH[k].c); finBtns.forEach(x => x.setAttribute('aria-pressed', x === b)); });
  b.setAttribute('aria-pressed', k === S.finish); $('finish').appendChild(b); return b;
});
$('lid').addEventListener('input', e => { stop(); S.lid = +e.target.value; if (S.p > 0.86) S.p = 0.86; apply(); });
$('pack').addEventListener('input', e => { stop(); S.p = e.target.value / 1000; apply(); });
$('dims').addEventListener('change', e => { S.dims = e.target.checked; setDims(); });
let last = 0;
function stop() { S.playing = false; $('play').textContent = 'Packa lådan'; }
$('play').addEventListener('click', () => {
  if (S.playing) { stop(); return; }
  if (S.p >= 0.999) S.p = 0;
  S.playing = true; last = 0; $('play').textContent = 'Pausa';
});

/* ---------- Export ---------- */
function dl(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
const say = t => $('msg').textContent = t;
const fname = ext => `bagl-box-${BOXES[S.size].key}.${ext}`;
$('xpng').addEventListener('click', () => { renderer.render(scene, camera); renderer.domElement.toBlob(b => { dl(b, fname('png')); say('Sparad som ' + fname('png')); }); });
$('xglb').addEventListener('click', () => {
  const d = []; ROOT.traverse(o => { if (o.userData.dims) { d.push([o, o.visible]); o.visible = false; } });
  new GLTFExporter().parse(ROOT, res => { d.forEach(([o, v]) => o.visible = v); dl(new Blob([res], { type: 'model/gltf-binary' }), fname('glb')); say('Sparad som ' + fname('glb') + ' (meter, Y uppåt).'); },
    e => { d.forEach(([o, v]) => o.visible = v); say('GLB-exporten misslyckades: ' + e); }, { binary: true });
});
function stepText() {
  ROOT.updateMatrixWorld(true);
  const w = StepExport.create('BAGL Box ' + BOXES[S.size].key); let i = 0;
  ROOT.traverse(o => {
    if (!o.isMesh || !o.userData.pack) return;
    for (let q = o; q; q = q.parent) if (!q.visible) return;
    w.threeMesh(o, `${o.userData.part}_${++i}`, '#' + o.material.color.getHexString());
  });
  return { txt: w.toString(fname('step')), n: w.count() };
}
$('xstep').addEventListener('click', () => {
  if (!window.StepExport) { say('STEP-exporten kunde inte laddas.'); return; }
  const r = stepText(); dl(new Blob([r.txt], { type: 'application/step' }), fname('step'));
  say(`Sparad som ${fname('step')}: ${r.n} solider, mm, Z uppåt.`);
});

/* ---------- Start ---------- */
await Promise.race([
  Promise.all(['500', '600'].map(w => document.fonts.load(`${w} 100px "Barlow Condensed"`))),
  new Promise(r => setTimeout(r, 2500)),
]);
resize(); build();
renderer.setAnimationLoop(ts => {
  if (S.playing) {
    const dt = last ? (ts - last) / 1000 : 0; last = ts;
    S.p = Math.min(1, S.p + dt / 7); apply();
    if (S.p >= 1) stop();
  }
  controls.update(); renderer.render(scene, camera); labelR.render(scene, camera);
});
window.__bb = { S, build, apply, frame, scene, camera, renderer, controls, stepText, root: () => ROOT, trays: () => TRAYS, items: () => ITEMS };
</script>
</body>
</html>
