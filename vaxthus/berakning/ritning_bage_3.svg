<text x="200.00" y="183.82" font-family="Barlow, Helvetica, Arial" font-size="2.75" font-weight="normal" fill="#1d1d1b" text-anchor="start" stroke="white" stroke-width="0.77" paint-order="stroke">Lutning ≈ 31.2° mot vågrätt (båda kanterna parallella). Gör en mall av första lasken och rita resten.</text>
<text x="200.00" y="188.32" font-family="Barlow, Helvetica, Arial" font-size="2.75" font-weight="normal" fill="#1d1d1b" text-anchor="start" stroke="white" stroke-width="0.77" paint-order="stroke">Överkanten ligger 23 under bågens ytterkant så att nockens låsprofil går fri.</text>
<text x="200.00" y="192.82" font-family="Barlow, Helvetica, Arial" font-size="2.75" font-weight="normal" fill="#1d1d1b" text-anchor="start" stroke="white" stroke-width="0.77" paint-order="stroke">Grå streckad = bågarnas kanter; mitten = nockglipa 45 (nockklots). Röda = skruv 4,5×40, 4 per halva + PU-lim.</text>
<text x="200.00" y="197.32" font-family="Barlow, Helvetica, Arial" font-size="2.75" font-weight="bold" fill="#1d1d1b" text-anchor="start" stroke="white" stroke-width="0.77" paint-order="stroke">Antal: 2 per inre båge + 1 per gavelbåge (bara insidan) = 16 st.</text>
<text x="200.00" y="207.32" font-family="Barlow, Helvetica, Arial" font-size="2.75" font-weight="normal" fill="#1d1d1b" text-anchor="start" stroke="white" stroke-width="0.77" paint-order="stroke">Ur skivan: lägg V:na i varandra – en bit 600 × ca 1601 räcker till alla 16 (snitt 3).</text>
</svg>