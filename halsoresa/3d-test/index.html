<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hasse 3D – test v2 (swing + knäböj)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--gul:#fbc021;--chili:#c8321a;--ink:#2A1206;--cream:#FFF6DC}
  html,body{margin:0;height:100%;background:var(--cream);font-family:'Barlow Condensed',system-ui,sans-serif;color:var(--ink);overflow:hidden}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
  .top{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  h1{font-family:Anton,sans-serif;font-weight:400;font-size:28px;margin:0;letter-spacing:.5px;line-height:1}
  h1 small{display:block;font-family:'Barlow Condensed';font-weight:600;font-size:15px;opacity:.75;letter-spacing:0;margin-top:3px}
  .klocka{pointer-events:auto;background:var(--ink);color:var(--gul);border-radius:14px;padding:8px 14px;text-align:center;min-width:92px}
  .klocka b{font-family:Anton;font-weight:400;font-size:38px;display:block;line-height:1}
  .klocka span{font-size:15px;color:#fff}
  .ui{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  button{font:800 17px 'Barlow Condensed',sans-serif;background:var(--gul);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:7px 13px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
  button.av{background:#fff}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  #stat{position:fixed;left:12px;bottom:calc(64px + env(safe-area-inset-bottom));font:600 14px 'Barlow Condensed';background:rgba(255,255,255,.8);border:2px solid var(--ink);border-radius:9px;padding:3px 8px}
  #lad{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:800 24px 'Barlow Condensed'}
  @media (max-width:700px){h1{font-size:22px} .klocka b{font-size:30px} button{font-size:15px;padding:6px 10px} #stat{bottom:calc(108px + env(safe-area-inset-bottom))} #kalla{bottom:auto!important;top:86px;left:16px;right:auto!important;text-align:left!important;max-width:70vw}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="lad">Laddar Hasse …</div>
<div class="top">
  <h1><span id="rubrik">KETTLEBELL-SWING</span><small id="under">3D-test v2 · Hunyuan3D-bas + tuschtextur · rör inte appen</small></h1>
  <div class="klocka"><b id="tid">0:30</b><span id="reps">0 reps</span></div>
</div>
<div id="stat">–</div>
<div id="kalla" style="position:fixed;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));font:600 12px 'Barlow Condensed';color:#655e54;text-align:right"></div>
<div class="ui">
  <button id="bOvn">Övning: Swing</button>
  <button id="bStart">▶ Starta 30 s</button>
  <button id="bTempo" class="av">Tempo 2,0 s</button>
  <button id="bVy" class="av">Vy: snett</button>
  <button id="bVer">Modell: v2</button>
  <button id="bStil" class="av">Stil: Borderlands</button>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window.__err = null; window.__ready = false;
window.addEventListener('error', e => { window.__err = String(e.message || e); });
const cv = document.getElementById('c');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.setClearColor(0xFFF6DC);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
const ctl = new OrbitControls(cam, cv); ctl.target.set(0, 0.95, 0); ctl.enablePan = false; ctl.minDistance = 2.5; ctl.maxDistance = 9;
const sol = new THREE.DirectionalLight(0xffffff, 2.4); sol.position.set(-2, 4, 3); scene.add(sol);
const amb = new THREE.AmbientLight(0xffffff, 0.9); scene.add(amb);
const fyll = new THREE.DirectionalLight(0xbfd4ff, 0.5); fyll.position.set(3, 1.5, -2); scene.add(fyll);
// markskugga
const sk = new THREE.Mesh(new THREE.CircleGeometry(0.55, 40), new THREE.MeshBasicMaterial({ color: 0x2A1206, transparent: true, opacity: 0.14 }));
sk.rotation.x = -Math.PI / 2; sk.position.y = 0.002; sk.scale.set(1, 0.55, 1); scene.add(sk);

// ---- v1: toon 3 steg + skuggstreck · v2: mjukt målat ljus (tuschen ligger i texturen) + rim · båda: svart kontur ----
const grad = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 170, 170, 170, 255, 255, 255, 255, 255]), 3, 1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
// mjuk ramp: målade övergångar i stället för hårda steg
const rampD = new Uint8Array(256 * 4);
for (let i = 0; i < 256; i++) { const t = i / 255; const v = 0.52 + 0.30 * (1 / (1 + Math.exp(-(t - 0.34) * 11))) + 0.18 * (1 / (1 + Math.exp(-(t - 0.72) * 14)));
  const c = Math.round(Math.min(1, v) * 255); rampD.set([c, c, c, 255], i * 4); }
const ramp = new THREE.DataTexture(rampD, 256, 1); ramp.minFilter = ramp.magFilter = THREE.LinearFilter; ramp.needsUpdate = true;
function toon(src, ver) {
  const m = new THREE.MeshToonMaterial({ map: src.map || null, color: src.map ? 0xffffff : src.color, gradientMap: ver === 2 ? ramp : grad });
  m.onBeforeCompile = s => {
    if (ver === 2) {
      s.fragmentShader = s.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
        float rim = pow(1.0 - clamp(dot(normalize(vNormal), normalize(vViewPosition)), 0.0, 1.0), 2.6);
        gl_FragColor.rgb += rim * vec3(1.0, .93, .78) * .16;
        gl_FragColor.rgb = mix(vec3(dot(gl_FragColor.rgb, vec3(.299,.587,.114))), gl_FragColor.rgb, 1.08);`);
      return;
    }
    s.fragmentShader = s.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
      float bas = max(dot(diffuseColor.rgb, vec3(.299,.587,.114)), .04);
      float lj = dot(outgoingLight, vec3(.299,.587,.114)) / bas;
      float streck = step(fract((gl_FragCoord.x + gl_FragCoord.y) / (5.0 * ${R.getPixelRatio().toFixed(1)})), .28);
      gl_FragColor.rgb *= mix(1.0, .45, streck * (1.0 - smoothstep(.55, .75, lj)));`);
  };
  return m;
}
// kontur i skärmrum (konstant tuschbredd i px, oberoende av gltfpacks kvantisering)
const KONT = { value: 0.004 };
function kontur(px) {
  const m = new THREE.MeshBasicMaterial({ color: 0x120804, side: THREE.BackSide });
  m.onBeforeCompile = s => {
    s.uniforms.uK = KONT; s.uniforms.uPx = { value: px };
    s.vertexShader = 'uniform float uK; uniform float uPx;\n' + s.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      #ifdef USE_SKINNING
        vec3 kn = normalize(normalMatrix * objectNormal);
      #else
        vec3 kn = normalize(normalMatrix * normal);
      #endif
      vec2 kd = kn.xy; float kl = length(kd);
      if (kl > 1e-4) gl_Position.xy += kd / kl * uK * uPx * gl_Position.w;
      gl_Position.z += 0.0004 * gl_Position.w;`);
  };
  return m;
}
const MOD = {};  // ver → {root, mixer, act, kropp, konturer, orig, toonM, clip}
let ver = 0, stil = 'bl', mixer, act, kropp;
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const FIL = { 1: 'hasse.glb', 2: 'hasse_v2.glb' };
const MB = {};
function laddaVer(v) {
  return new Promise((ok, fel) => {
    if (MOD[v]) return ok(MOD[v]);
    fetch(FIL[v], { method: 'HEAD' }).then(r => { MB[v] = (+r.headers.get('content-length') / 1048576); }).catch(() => {});
    loader.load(FIL[v], g => {
      const root = g.scene; const M = { root, konturer: [], orig: new Map(), toonM: new Map() };
      const extra = [];
      root.traverse(o => {
        if (!o.isMesh) return;
        o.frustumCulled = false;
        M.orig.set(o, o.material);
        const t = toon(o.material, v); M.toonM.set(o, t); o.material = t;
        if (o.isSkinnedMesh) M.kropp = o;
        const tj = v === 2 ? 2.6 : 2.2;
        const k = o.isSkinnedMesh ? new THREE.SkinnedMesh(o.geometry, kontur(tj)) : new THREE.Mesh(o.geometry, kontur(tj * 0.8));
        if (o.isSkinnedMesh) k.bind(o.skeleton, o.bindMatrix);
        k.frustumCulled = false; if (o.morphTargetInfluences) k.morphTargetInfluences = o.morphTargetInfluences;
        extra.push([o, k]);
      });
      for (const [o, k] of extra) { if (o.isSkinnedMesh) { o.parent.add(k); k.position.copy(o.position); k.quaternion.copy(o.quaternion); k.scale.copy(o.scale); } else o.add(k); M.konturer.push([o, k]); }
      M.mixer = new THREE.AnimationMixer(root);
      M.acts = {}; for (const a of g.animations) M.acts[a.name] = M.mixer.clipAction(a);
      M.act = M.acts.swing || M.mixer.clipAction(g.animations[0]); M.act.play(); M.clip = M.act.getClip().duration;
      MOD[v] = M; ok(M);
    }, undefined, e => fel(e));
  });
}
async function visaVer(v) {
  const M = await laddaVer(v);
  const tid = act ? (act.time / window.__clip) : 0;
  for (const k in MOD) { if (MOD[k].root.parent) scene.remove(MOD[k].root); }
  scene.add(M.root); ver = v; mixer = M.mixer; kropp = M.kropp;
  if (!M.acts[ovn]) ovn = 'swing';
  for (const k in M.acts) if (k !== ovn) M.acts[k].stop();
  act = M.acts[ovn] || M.act; act.play(); window.__clip = act.getClip().duration;
  act.time = tid * window.__clip; mixer.update(0); visaOvn();
  for (const [o, k] of M.konturer) { o.material = stil === 'bl' ? M.toonM.get(o) : M.orig.get(o); k.visible = stil === 'bl'; }
  sol.intensity = v === 2 ? 2.0 : 2.4; amb.intensity = v === 2 ? 1.15 : 0.9;
  document.getElementById('bVer').textContent = 'Modell: v' + v;
  document.getElementById('under').textContent = v === 2 ? '3D-test v2.2 · swing + knäböj mot bänk i samma GLB · rör inte appen' : '3D-test v1 · TRELLIS-bas (jämförelse) · rör inte appen';
  setTempo(OVN[ovn].tempo);
}
// ---- övningar: ett klipp per övning i samma GLB (kort #583) ----
const OVN = {
  swing: { namn: 'Swing', rubrik: 'KETTLEBELL-SWING', tempo: 2.0, tempon: [2.0, 1.5, 2.5], rep: 0.62, flin: 0.62,
    kalla: 'Rörelse: mocap ur „Kettlebell Swing Hip Hinge Style“ av Taco fleur, <a href="https://commons.wikimedia.org/wiki/File:Kettlebell_Swing_Hip_Hinge_Style.webm" style="color:#655e54">CC BY-SA 4.0</a>' },
  goblet: { namn: 'Knäböj', rubrik: 'KNÄBÖJ MOT BÄNK', tempo: 2.5, tempon: [2.5, 2.0, 3.0], rep: 0.9, flin: 0.55,
    kalla: 'Rörelse: mocap ur „Kettlebell Racked Squats (side view)“ av Taco fleur, <a href="https://commons.wikimedia.org/wiki/File:Kettlebell_Racked_Squats_(side_view).webm" style="color:#655e54">CC BY-SA 4.0</a> · goblet-grepp + bänk: Vickan' } };
let ovn = new URLSearchParams(location.search).get('ovn') === 'goblet' ? 'goblet' : 'swing';
function visaOvn() {
  const o = OVN[ovn]; const M = MOD[ver];
  document.getElementById('rubrik').textContent = o.rubrik;
  document.getElementById('kalla').innerHTML = o.kalla;
  const b = document.getElementById('bOvn'); b.textContent = 'Övning: ' + o.namn;
  b.disabled = !(M && M.acts.goblet); b.style.opacity = b.disabled ? 0.45 : 1; b.title = b.disabled ? 'Bara swing i v1' : '';
}
function satOvn(n) {
  const M = MOD[ver]; if (!M || !M.acts[n]) return;
  ovn = n; for (const k in M.acts) if (k !== n) M.acts[k].stop();
  act = M.acts[n]; act.reset(); act.play(); window.__clip = act.getClip().duration; mixer.update(0);
  kvar = 30; reps = 0; fas = 0; kor = false; document.getElementById('bStart').textContent = '▶ Starta 30 s';
  setTempo(OVN[n].tempo); visaOvn();
}
document.getElementById('bOvn').onclick = () => satOvn(ovn === 'swing' ? 'goblet' : 'swing');
const startVer = +(new URLSearchParams(location.search).get('v') || 2);
visaVer(startVer === 1 ? 1 : 2).then(() => { const l = document.getElementById('lad'); if (l) l.remove(); window.__ready = true; })
  .catch(e => { window.__err = 'GLB: ' + e; document.getElementById('lad').textContent = 'Kunde inte ladda modellen'; });
document.getElementById('bVer').onclick = () => visaVer(ver === 2 ? 1 : 2);

// ---- tempo + timer (som i appen: CX.tempo swing = 2 s/rep) ----
let tempo = 2.0, kor = false, kvar = 30, reps = 0, fas = 0;
function setTempo(t) { tempo = t; if (act) act.timeScale = window.__clip / tempo; document.getElementById('bTempo').textContent = 'Tempo ' + t.toFixed(1).replace('.', ',') + ' s'; }
document.getElementById('bTempo').onclick = () => { const L = OVN[ovn].tempon; setTempo(L[(L.indexOf(tempo) + 1) % L.length]); };
document.getElementById('bStart').onclick = () => { kor = !kor; if (kor && kvar <= 0) { kvar = 30; reps = 0; } document.getElementById('bStart').textContent = kor ? '⏸ Paus' : '▶ Fortsätt'; };
const VYER = [['snett', [2.6, 1.5, 3.6]], ['sida', [4.6, 1.2, 0.01]], ['fram', [0.01, 1.2, 4.6]]];
let vy = 0;
function satVy(i) { vy = i; const p = VYER[i][1]; const sm = innerWidth < 700 ? 1.25 : 1; cam.position.set(p[0] * sm, p[1], p[2] * sm); ctl.update(); document.getElementById('bVy').textContent = 'Vy: ' + VYER[i][0]; }
document.getElementById('bVy').onclick = () => satVy((vy + 1) % VYER.length);
document.getElementById('bStil').onclick = () => {
  stil = stil === 'bl' ? 'orig' : 'bl'; const M = MOD[ver];
  for (const [o, k] of M.konturer) { o.material = stil === 'bl' ? M.toonM.get(o) : M.orig.get(o); k.visible = stil === 'bl'; }
  document.getElementById('bStil').textContent = 'Stil: ' + (stil === 'bl' ? 'Borderlands' : 'original');
};
function resize() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); KONT.value = 2 / h; cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); satVy(0);

// ---- ansikte: blink + flin i toppen av svingen ----
let blinkT = 2.5, blinkA = 0;
const clock = new THREE.Clock();
let fN = 0, fT = 0, fps = 0, ms = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (mixer) {
    mixer.update(dt);
    const ny = (act.time / window.__clip) % 1;
    const rf = OVN[ovn].rep;
    if (kor) { if (fas < rf && ny >= rf) reps++; kvar -= dt; if (kvar <= 0) { kvar = 0; kor = false; document.getElementById('bStart').textContent = '▶ Igen'; } }
    fas = ny;
    const m = window.__lock || !kropp ? [] : kropp.morphTargetInfluences;
    blinkT -= dt; if (blinkT < 0) { blinkA = 0.16; blinkT = 2 + Math.random() * 3; }
    if (blinkA > 0) blinkA -= dt;
    m[0] = blinkA > 0 ? Math.sin((blinkA / 0.16) * Math.PI) : 0;
    const topp = Math.exp(-Math.pow(((ny - OVN[ovn].flin + 1.5) % 1 - 0.5) / 0.12, 2));
    m[1] = topp;
  }
  document.getElementById('tid').textContent = '0:' + String(Math.ceil(kvar)).padStart(2, '0');
  document.getElementById('reps').textContent = reps + (reps === 1 ? ' rep' : ' reps');
  const t0 = performance.now(); R.render(scene, cam); ms = ms * 0.9 + (performance.now() - t0) * 0.1;
  fN++; fT += dt; if (fT >= 1) { fps = fN / fT; fN = 0; fT = 0; window.__fps = fps;
    document.getElementById('stat').textContent = `${fps.toFixed(0)} fps · ${R.info.render.triangles} tri · v${ver} · GLB ${MB[ver] ? MB[ver].toFixed(1).replace('.', ',') + ' MB' : '–'}`; }
}
loop();
// mätning: rendera n bilder i följd och vänta in GPU:n → ms per bild
window.__bench = (n = 120) => { const gl = R.getContext(); const t0 = performance.now();
  for (let i = 0; i < n; i++) { mixer.update(1 / 60); R.render(scene, cam); } gl.finish(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
  return (performance.now() - t0) / n; };
window.__dr = { visaVer, ver: () => ver, satOvn, ovn: () => ovn, setT: (t) => { if (act) { act.time = t * window.__clip; mixer.update(0); } }, pause: (p) => { if (act) act.paused = p; }, satVy, cam, ctl, R, scene };
</script>
</body>
</html>
