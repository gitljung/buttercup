const wp=(obj,x,y,z)=>obj.localToWorld(new THREE.Vector3(x,y,z));
const OBST=[[-1.8,.3,.75,.6],[1.8,.3,.75,.6],[3.8,-3.65,1.35,.55],[-5.5,-1.2,.45,.95],[5.8,0,.4,3.2],[-5.5,3.9,.4,.4]];

const Music=(()=>{let ctx=null,master,out,crackBus,noise,crackBuf,crk=null,timer=null,P=null,step=0,nextT=0;

  master.connect(hp);hp.connect(lp);lp.connect(comp);comp.connect(out);out.connect(ctx.destination);crackBus=ctx.createGain();crackBus.gain.value=0;crackBus.connect(lp);
  const sr=ctx.sampleRate;noise=ctx.createBuffer(1,sr,sr);const nd=noise.getChannelData(0);for(let i=0;i<sr;i++)nd[i]=Math.random()*2-1;

  for(let k=0;k<160;k++){const p=Math.floor(Math.random()*(cd.length-200));const a=(Math.random()<.1?.7:.15+Math.random()*.25)*(Math.random()<.5?-1:1);const L=10+Math.random()*60;for(let j=0;j<L;j++)cd[p+j]+=a*Math.exp(-j/L*5)*(Math.random()-.3);}}

 function makeP(rec){const r=mulberry(rec.seed*7+3);const ge=rec.genre;
  const S={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],mix:[0,2,4,5,7,9,10]};

  const bpm={jazz:[128,168],rock:[110,140],soul:[88,104],elec:[116,126]}[ge];const tempo=bpm[0]+r()*(bpm[1]-bpm[0]);

  for(let s=0;s<64;s++){const strong=s%4===0;if(r()<(s%2?dens*.4:dens)*(strong?1.3:1)){cur=clamp(cur+pick(r,[-2,-1,-1,1,1,2,0,3,-3]),3,13);if(strong){const ct=chords[Math.floor(s/16)].deg;let best=cur,bd=9;for(const k of[0,2,4]){for(const o of[0,7,14]){const c=ct+k+o-7;if(Math.abs(c-cur)<bd){bd=Math.abs(c-cur);best=c;}}}cur=clamp(best,3,13);}mel[s]=sn(cur);}else mel[s]=null;}

  crackBus.gain.cancelScheduledValues(t);crackBus.gain.setValueAtTime(crackBus.gain.value,t);crackBus.gain.linearRampToValueAtTime(0,t+.5);if(crk){const c=crk;setTimeout(()=>{try{c.stop()}catch(e){}},700);crk=null;}}
 function volume(v){if(ctx)out.gain.setTargetAtTime(v,ctx.currentTime,.15);}
 function blip(fr,dur=.06,v=.05){if(!ctx||ctx.state!=='running')return;const o=ctx.createOscillator();o.type='triangle';o.frequency.value=fr;const gg=ctx.createGain();gg.gain.setValueAtTime(v,ctx.currentTime);gg.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);o.connect(gg);gg.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur+.02);}
 return{unlock,start,stop,volume,blip};})();
const flick=()=>Music.blip(240+Math.random()*80,.04,.04);
function ding(){Music.unlock();Music.blip(1318,.5,.08);setTimeout(()=>Music.blip(1760,.7,.07),120);}

// ================= input =================
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function hit(x,y,list=clickables){ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(list,false).filter(h=>h.object.visible);return h[0];}
let down=null;const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),drag:false,acc:0};el.setPointerCapture(e.pointerId);});
el.addEventListener('pointermove',e=>{if(!down){hover(e);return;}const dx=e.clientX-down.lx,dy=e.clientY-down.ly;down.lx=e.clientX;down.ly=e.clientY;
 if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>7)down.drag=true;if(!down.drag)return;
 if(state.mode==='walk'||state.mode==='turntable'){if(state.tween)return;state.yaw+=dx*.005;state.pitch=clamp(state.pitch+dy*.004,-1.1,.6);}
 else if(state.mode==='crate'){down.acc+=dy;if(Math.abs(down.acc)>38){flip(down.acc<0?1:-1);down.acc=0;}}
 else if(state.mode==='inspect'){state.insp.drag+=dx*.012;}});
el.addEventListener('pointerup',e=>{const d=down;down=null;if(!d)return;if(state.mode==='inspect'&&d.drag){const s=state.insp;const tot=s.side*Math.PI+s.drag;s.side=Math.round(tot/Math.PI);s.drag=tot-s.side*Math.PI;s.side=((s.side%2)+2)%2;}
 if(!d.drag&&performance.now()-d.t<600)tap(e.clientX,e.clientY);});
el.addEventListener('pointercancel',()=>down=null);
el.addEventListener('wheel',e=>{e.preventDefault();if(state.mode==='crate'){wheelAcc+=e.deltaY;if(Math.abs(wheelAcc)>60){flip(wheelAcc>0?1:-1);wheelAcc=0;}}
 else if(state.mode==='walk'&&!state.tween){const fw=new THREE.Vector3(-Math.sin(state.yaw),0,-Math.cos(state.yaw));state.pos.addScaledVector(fw,-e.deltaY*.003);free(state.pos);}},{passive:false});
let wheelAcc=0;
function tap(x,y){const m=state.mode;Music.unlock();
 if(m==='inspect'){const h=hit(x,y,[state.insp.m]);if(h)state.insp.side^=1;return;}
 const h=hit(x,y);if(!h)return;const o=h.object;
 if(m==='crate'){const rec=o.userData.rec;if(rec&&o.userData.bin===state.bin){const k=state.bin.items.findIndex(i=>i.rec===rec);if(k===state.bin.idx)inspect(rec,state.bin);else{state.bin.idx=k;layoutBin(state.bin);renderPanel();flick();}return;}
  if(o.userData.bin&&o.userData.bin!==state.bin){focusBin(o.userData.bin);return;}if(o.userData.floor){leaveBin();return;}if(o.userData.tap){const b=state.bin;state.bin=null;layoutBin(b);setMode('walk');o.userData.tap();}return;}
 if(m==='turntable'){if(o.userData.floor){setMode('walk');walkTo(h.point);return;}if(o.userData.tap)o.userData.tap();return;}
 if(o.userData.floor){walkTo(h.point);return;}if(o.userData.tap)o.userData.tap();}
function walkTo(p){const t=free(new THREE.Vector3(p.x,1.6,p.z));const d=t.clone().sub(state.pos);const yaw=d.length()>.3?Math.atan2(-d.x,-d.z):state.yaw;tweenTo({pos:t,yaw,pitch:-.12});}
function hover(e){if(e.pointerType!=='mouse')return;const h=hit(e.clientX,e.clientY);el.style.cursor=h&&(h.object.userData.tap||h.object.userData.rec)&&!h.object.userData.floor?'pointer':'grab';}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(state.mode==='crate'){if(e.key==='ArrowUp'||e.key==='ArrowRight')flip(1);if(e.key==='ArrowDown'||e.key==='ArrowLeft')flip(-1);if(e.key==='Enter'){const it=state.bin.items[state.bin.idx];if(it)inspect(it.rec,state.bin);}}
 if(e.key==='Escape'){if(!modal.classList.contains('hide'))closeModal();else if(state.mode==='inspect')closeInspect(true);else if(state.mode==='crate')leaveBin();else if(state.mode==='turntable')setMode('walk');}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ================= loop =================
const clock=new THREE.Clock();let volT=0;
function loop(){update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera);requestAnimationFrame(loop);}
function update(dt){
 const tw=state.tween;if(tw){tw.t+=dt/tw.dur;const k=tw.t>=1?1:(1-Math.cos(Math.PI*tw.t))/2;state.pos.lerpVectors(tw.from.pos,tw.to.pos,k);
  if(state.mode==='walk'&&tw.dur>.9)state.pos.y=tw.to.pos.y+Math.sin(tw.t*Math.PI*tw.dur*3.4)*.012*(1-Math.abs(tw.from.pos.y-tw.to.pos.y));
  state.yaw=tw.from.yaw+tw.dy*k;state.pitch=lerp(tw.from.pitch,tw.to.pitch,k);if(tw.t>=1){state.tween=null;if(tw.done)tw.done();}}
 if(state.mode==='walk'&&!tw){const fw=new THREE.Vector3(-Math.sin(state.yaw),0,-Math.cos(state.yaw)),rt=new THREE.Vector3(fw.z*-1,0,fw.x);let mv=new THREE.Vector3();
  if(keys.w||keys.arrowup)mv.add(fw);if(keys.s||keys.arrowdown)mv.sub(fw);if(keys.d)mv.add(rt);if(keys.a)mv.sub(rt);if(keys.arrowleft)state.yaw+=dt*1.8;if(keys.arrowright)state.yaw-=dt*1.8;
  if(mv.lengthSq()){state.pos.addScaledVector(mv.normalize(),dt*2.2);free(state.pos);}}
 camera.position.copy(state.pos);camera.rotation.set(state.pitch,state.yaw,0);
 for(const b of bins)for(const it of b.items){it.rot=lerp(it.rot,it.tr,1-Math.exp(-dt*14));it.y=lerp(it.y,it.ty,1-Math.exp(-dt*14));it.pivot.rotation.x=it.rot;it.pivot.position.y=it.y;}
 const s=state.insp;if(s){s.t=Math.min(1,s.t+dt*3);const e=1-Math.pow(1-s.t,3);s.g.position.y=lerp(-.5,.035,e);s.dim.material.opacity=.6*e;if(!down||!down.drag)s.drag=lerp(s.drag,0,1-Math.exp(-dt*8));
  s.rot=lerp(s.rot,s.side*Math.PI,1-Math.exp(-dt*9));s.g.rotation.y=s.rot+s.drag;s.g.rotation.x=Math.sin(performance.now()/1400)*.03;s.v.position.x=lerp(0,.085,e)*(1);s.v.rotation.y+=0;}
 // skivspelare
 const pl=state.playing;TT.speed=lerp(TT.speed,pl?3.49:0,1-Math.exp(-dt*(pl?2.5:1)));TT.spin.rotation.y-=TT.speed*dt;
 if(pl)state.playT+=dt;const armT=pl?-.5-Math.min(.16,state.playT/900*.16):0;TT.armA=lerp(TT.armA,armT,1-Math.exp(-dt*2.2));TT.arm.rotation.y=TT.armA;
 if((volT+=dt)>.2&&pl){volT=0;const d=state.pos.distanceTo(TT.group.position.clone().setY(1.2));Music.volume(clamp(1.25-d/7,.12,1));}
}

(async()=>{try{await Promise.race([Promise.all(['100px Anton','700 60px "Barlow Condensed"','400 30px Barlow','italic 700 60px "Playfair Display"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,3000))]);}catch(e){}
 prepRecords();
 const tA=table(-1.8,.3),tB=table(1.8,.3);const by=g=>RECORDS.filter(r=>r.genre===g);
 makeBin(tA,-.25,'jazz',by('jazz'));makeBin(tA,.25,'rock',by('rock'));makeBin(tB,-.25,'soul',by('soul'));makeBin(tB,.25,'elec',by('elec'));
 buildWalls();scene.updateMatrixWorld(true);setMode('walk');$('#loading').remove();loop();
 window.__app={adv:(sec)=>{for(let t=0;t<sec;t+=.05)update(.05);renderer.render(scene,camera);},state,bins,RECORDS,focusBin,inspect,play,stopPlay,goTurntable,goCounter,toggleBag,checkout,pay,camera,leaveBin,closeInspect,setMode};})();
