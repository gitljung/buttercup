<style>
/* Layout: pit-garage workbench — 3D-dummy till vänster (sticky), verktygspanel till höger; staplas på mobil */
:root{
  --bg:#0E1217; --panel:#151B22; --panel2:#1B232C; --line:#29333F; --fg:#E7ECF1; --muted:#8A97A6;
  --accent:#E6EB3A; --accent-ink:#14170A; --warn:#FF9F43;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
*{box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.app{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:860px){.stage{position:relative;top:0}}
.view{position:relative;height:min(72vh,680px);min-height:360px}
@media (max-width:860px){.view{height:58vh}}
#three,#flat{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#flat{background:var(--panel)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--line);background:var(--panel2)}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:rgba(14,18,23,.75);padding:4px 8px;border-radius:6px;pointer-events:none;max-width:calc(100% - 20px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button+button{border-left:1px solid var(--line)}
button{font:500 13px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-title{font:700 13px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on .dot{background:var(--accent-ink)}
.chip.off{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:12px;color:var(--muted);letter-spacing:.03em}
input[type=text],select,input[type=number]{width:100%;font:500 15px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
input[type=number]{font-family:var(--f-mono);font-size:14px}
.num{display:flex;align-items:center;gap:8px}
.num input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.num input[type=number]{width:82px;flex:none}
.unit{font:12px var(--f-mono);color:var(--muted)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sw input{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;padding:0;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.readout{font:13px var(--f-mono);color:var(--fg);background:var(--bg);border:1px dashed var(--line);border-radius:7px;padding:8px 10px;font-variant-numeric:tabular-nums}
.readout b{color:var(--accent);font-weight:500}
.warn{color:var(--warn);font-size:13px}
.divider{height:1px;background:var(--line)}
pre.spec{white-space:pre-wrap;font:12px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;margin:0;max-height:260px;overflow:auto;color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Mobilförslag (A/B/C) – styrs av body.m + body.lay-x ===== */
#propbar{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:-14px calc(-1*max(16px,env(safe-area-inset-left,0px))) 12px;background:#0A0D11;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
#propbar .pb-t{font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#propbar input[type=range]{width:150px;accent-color:var(--accent);height:28px}
#layName{font:700 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
#layNote{color:var(--muted);font-size:12px;flex-basis:100%}
#grab,#tabs{display:none}

/* gemensamt för alla mobil-lägen */
body.m .app{grid-template-columns:minmax(0,1fr);gap:10px}
body.m .toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:5px;padding:6px}
body.m .toolbar::-webkit-scrollbar{display:none}
body.m .toolbar button{font-size:12.5px;padding:8px 9px;white-space:nowrap;min-height:36px}
body.m input[type=text],body.m select,body.m input[type=number]{font-size:16px}
body.m .panel button{min-height:38px}
body.m .num input[type=range]{height:30px}
body.m .num input[type=number]{width:74px}
body.m header{margin-bottom:8px}
body.m h1{font-size:22px}
body.m .sub{display:none}
body.m .hint{font-size:11px}

/* riktig mobil (inte ram) */
body.m:not(.frame){padding:0}
body.m:not(.frame) #propbar{margin:0}
body.m:not(.frame).lay-a #shell{padding:0 10px 30px}

/* skrivbord: telefonram */
body.frame #propbar{margin-bottom:16px;justify-content:center}
body.frame #layNote{text-align:center}
body.frame #shell{width:390px;height:min(844px,calc(100vh - 110px));margin:0 auto;overflow:auto;transform:translateZ(0);border:10px solid #000;border-radius:42px;box-shadow:0 0 0 1px #2c3440,0 30px 80px rgba(0,0,0,.6);background:var(--bg);scrollbar-width:none}
body.frame #shell::-webkit-scrollbar{display:none}
body.frame.lay-a #shell{padding:10px 10px 30px}
body.frame:not(.lay-a) #shell{overflow:hidden}

/* --- A: sticky docka --- */
body.m.lay-a .stage{position:sticky;top:0;z-index:20;border-radius:0 0 12px 12px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
body.m.lay-a .view{height:calc(var(--H) * .44);min-height:0}

/* --- B: dra-upp-ark --- */
body.m.lay-b:not(.frame),body.m.lay-c:not(.frame){overflow:hidden;height:100%;overscroll-behavior:none}
body.m.lay-b header,body.m.lay-c header{display:none}
body.m.lay-b .stage,body.m.lay-c .stage{position:fixed;left:0;right:0;top:var(--top);z-index:5;border-radius:0;border-width:0 0 1px}
body.m.lay-b .view{height:max(150px,calc(var(--H) - var(--top) - var(--tb) - var(--sheet)));min-height:0;transition:height .28s cubic-bezier(.2,.8,.2,1)}
body.m.lay-b .panel{position:fixed;left:0;right:0;bottom:0;height:var(--sheet);z-index:10;border-radius:16px 16px 0 0;border-width:1px 0 0;overflow:auto;overscroll-behavior:contain;padding:36px 14px 30px;transition:height .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 30px rgba(0,0,0,.5)}
body.m.lay-b #grab{display:flex;justify-content:center;align-items:center;position:fixed;left:0;right:0;bottom:calc(var(--sheet) - 32px);height:32px;z-index:11;background:var(--panel);border-radius:16px 16px 0 0;cursor:grab;touch-action:none;transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
body.m.lay-b #grab i{display:block;width:44px;height:5px;border-radius:3px;background:var(--muted)}
#shell.dragging .view,#shell.dragging .panel,#shell.dragging #grab{transition:none!important}
body.m.lay-b .hint,body.m.lay-c .hint{display:none}

/* --- C: flikar --- */
body.m.lay-c .view{height:max(150px,calc(var(--H) - var(--top) - var(--tb) - var(--pane) - var(--tabs)));min-height:0}
body.m.lay-c .panel{position:fixed;left:0;right:0;bottom:var(--tabs);height:var(--pane);z-index:10;border-radius:0;border-width:0;overflow:auto;overscroll-behavior:contain;padding:12px 14px 20px;gap:12px}
body.m.lay-c .panel>[data-tab]:not(.act){display:none!important}
body.m.lay-c .panel>.divider{display:none}
body.m.lay-c .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
body.m.lay-c .chips::-webkit-scrollbar{display:none}
body.m.lay-c .chips button{white-space:nowrap;flex:none}
body.m.lay-c #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--tabs);z-index:12;background:#0A0D11;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
body.m.lay-c #tabs button{flex:1;border:0;border-radius:0;background:none;font:700 15px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
body.m.lay-c #tabs button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
</style>

<div id="propbar">
  <span class="pb-t">Förslag</span>
  <input type="range" id="lay" min="0" max="3" step="1" value="0" aria-label="Välj layoutförslag">

  <span id="layNote"></span>
</div>
<div id="shell">

  <section class="panel">

        <p class="sec-title">Tryckspec</p>
        <div class="row">
          <button id="copySpec">Kopiera</button>
          <button id="reset">Återställ</button>
        </div>
      </div>
      <pre class="spec" id="spec"></pre>
    </div>
  </section>
</div>
<div id="grab" aria-label="Dra upp/ner menyn" role="button" tabindex="0"><i></i></div>
<nav id="tabs">

  <button data-t="farg">Färg</button>
  <button data-t="spec">Spec</button>
</nav>
</div>

/* ---------- Kroppsmått (cm). y=0 = axelsöm/krage, positivt nedåt ---------- */
const PREF=140, Y0=-10, Y1=74, HT=Y1-Y0, K=16; // px per cm
const W=PREF*K, H=HT*K;
const PROFILE=[[-9,7.6,7.2],[-7.5,11,8.6],[-5.5,15.5,10],[-3,19,11.2],[0,20.5,12],[5,20,12.8],[14,19.2,13.2],[26,17.4,12.2],[36,16.4,11.4],[48,17.4,12],[58,18.2,12.6],[66,17.6,12],[72,15.5,10.8]];
function prof(y){
  const P=PROFILE;if(y<=P[0][0])return[P[0][1],P[0][2]];
  for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1];if(y<=b[0]){
    const t=(y-a[0])/(b[0]-a[0]),s=t*t*(3-2*t);
    // hermite-ish: blend linear and smoothstep for soft curve
    const m=.5*t+.5*s;return[a[1]+(b[1]-a[1])*m,a[2]+(b[2]-a[2])*m];}}
  const L=P[P.length-1];return[L[1],L[2]];
}
function halfPerim(a,b){const h=((a-b)/(a+b))**2;return Math.PI*(a+b)*(1+3*h/(10+Math.sqrt(4-3*h)))/2}

/* ---------- Textur ---------- */
const tex=document.createElement("canvas");tex.width=W;tex.height=H;
const tc=tex.getContext("2d");
const PX=(side,x)=>(side==="front"?.25:.75)*W+x*K;
const PY=y=>(y-Y0)*K;

function measureText(el){
  const f=fontById(el.font);
  tc.font=`${f.s} ${f.w} 100px "${f.fam}"`;
  const m=tc.measureText(el.text||" ");
  const cap=tc.measureText("H").actualBoundingBoxAscent||70;
  const wid=(m.actualBoundingBoxLeft+m.actualBoundingBoxRight)||m.width;
  return{f,m,capU:cap/100,wU:wid/100,left:m.actualBoundingBoxLeft};
}
// räknar ut faktisk bredd/höjd för textdetaljer
function resolve(el){
  if(el.type==="logo"){if(el.lock)el.h=+(el.w*LOGO_BOX.h/LOGO_BOX.w).toFixed(2);return}
  if(el.type==="flag"){el.h=+(el.w*10/16).toFixed(2);return}
  const mt=measureText(el);
  if(el.mode==="w"){const fs=el.w/mt.wU;el.h=+(fs*mt.capU).toFixed(2)}
  else if(el.mode==="h"){const fs=el.h/mt.capU;el.w=+(fs*mt.wU).toFixed(2)}
}

function drawSuit(){
  tc.fillStyle=S.suit;tc.fillRect(0,0,W,H);
  // sidopanel (vit) + rand (gul) längs sidorna, breddas mot höften – som Sparco Kerb
  const wW=y=>3.5+4.5*Math.max(0,y-3)/69, yW=2.4;
  for(const side of["front","back"]){
    for(const dir of[-1,1]){
      const band=(f0,f1,col)=>{tc.beginPath();
        for(let y=3;y<=Y1;y+=1){const[a,b]=prof(y);const e=halfPerim(a,b)/2;tc.lineTo(PX(side,dir*(e-f0(y))),PY(y))}
        for(let y=Y1;y>=3;y-=1){const[a,b]=prof(y);const e=halfPerim(a,b)/2;tc.lineTo(PX(side,dir*(e-f1(y))),PY(y))}
        tc.closePath();tc.fillStyle=col;tc.fill()};
      band(()=>-1,wW,S.panel);band(wW,y=>wW(y)+yW,S.stripe);
      if(side==="front"){ // midjeflik
        const[a,b]=prof(32);const e=halfPerim(a,b)/2;tc.fillStyle="#15181C";
        tc.fillRect(Math.min(PX(side,dir*(e+1)),PX(side,dir*(e-4.5))),PY(31),5.5*K,2.4*K);
      }
    }
  }
  // svarta sparco-axelpaneler (fasta, som på riktiga overallen)
  for(const side of["front","back"]){
    for(const dir of[-1,1]){
      const outer=y=>{const[a,b]=prof(y);return halfPerim(a,b)/2-wW(y)-yW+.2};
      const inner=y=>13.2+y*.12, yT=-4;
      tc.beginPath();
      for(let y=yT;y<=15;y+=1)tc.lineTo(PX(side,dir*inner(y)),PY(y));
      for(let y=17.5;y>=yT;y-=1)tc.lineTo(PX(side,dir*outer(y)),PY(y));
      tc.closePath();tc.fillStyle="#111418";tc.fill();
      // sparco-text längs panelen
      const yc=6.5,xc=(inner(yc)+outer(yc))/2;
      tc.save();tc.translate(PX(side,dir*xc),PY(yc));tc.rotate(dir*(side==="front"?1:-1)>0?Math.PI/2:-Math.PI/2);
      tc.font=`italic 700 ${2.6*K}px "Saira"`;tc.textAlign="center";tc.textBaseline="middle";tc.fillStyle="#FFFFFF";
      tc.fillText("sparco",0,0);tc.restore();
    }
  }
  if(S.stitch){
    tc.save();tc.strokeStyle="#C8D27C";tc.globalAlpha=.8;tc.lineWidth=.1*K;tc.setLineDash([.4*K,.25*K]);
    const chev=(side,yy,span,depth)=>{tc.beginPath();tc.moveTo(PX(side,-span),PY(yy));tc.lineTo(PX(side,0),PY(yy+depth));tc.lineTo(PX(side,span),PY(yy));tc.stroke()};
    [6,13,20].forEach(y=>chev("front",y,17,3.6));
    [5,13,21,29].forEach(y=>chev("back",y,19,4.5));
    tc.restore();
  }
  // dragkedjeslå fram
  tc.save();tc.strokeStyle="rgba(0,0,0,.45)";tc.lineWidth=.22*K;
  tc.beginPath();tc.moveTo(PX("front",0),PY(-9));tc.lineTo(PX("front",0),PY(74));tc.stroke();
  tc.strokeStyle="rgba(0,0,0,.22)";tc.lineWidth=.12*K;
  tc.beginPath();tc.moveTo(PX("front",1.8),PY(-9));tc.lineTo(PX("front",1.8),PY(60));tc.stroke();
  tc.restore();
}
function drawLogo(el){
  const x0=PX(el.side,el.x-el.w/2),y0=PY(el.y);
  const sx=el.w*K/LOGO_BOX.w, sy=el.h*K/LOGO_BOX.h;
  tc.save();tc.translate(x0,y0);tc.scale(sx,sy);tc.translate(-LOGO_BOX.x,-LOGO_BOX.y);
  tc.fillStyle=el.stroke;tc.fill(LOGO_P[0],"evenodd");
  tc.fillStyle=el.fill;tc.fill(LOGO_P[1],"evenodd");
  tc.fillStyle=el.racing;tc.fill(LOGO_P[2],"evenodd");
  tc.restore();
}
function drawText(el){
  if(!el.text)return;
  const mt=measureText(el);
  const fs=el.h/mt.capU; // cm
  const natW=fs*mt.wU, scx=el.w/natW;
  const fpx=fs*K;
  tc.save();
  tc.translate(PX(el.side,el.x),PY(el.y)+el.h*K);
  tc.scale(scx,1);
  tc.font=`${mt.f.s} ${mt.f.w} ${fpx}px "${mt.f.fam}"`;
  tc.textBaseline="alphabetic";tc.textAlign="left";
  const tx=-natW*K/2+mt.left*fs/100*100/100*1; // left bearing already in cm units*K below
  const lx=-natW*K/2+mt.left/100*fpx;
  if(el.sw>0){tc.lineJoin="round";tc.strokeStyle=el.stroke;tc.lineWidth=el.sw/10*K*2;tc.strokeText(el.text,lx,0)}
  tc.fillStyle=el.fill;tc.fillText(el.text,lx,0);
  tc.restore();
}
function drawFlag(el){
  const x0=PX(el.side,el.x-el.w/2),y0=PY(el.y),w=el.w*K,h=el.h*K;
  tc.fillStyle="#006AA7";tc.fillRect(x0,y0,w,h);
  tc.fillStyle="#FECC02";tc.fillRect(x0+w*5/16,y0,w*2/16,h);tc.fillRect(x0,y0+h*4/10,w,h*2/10);
}
function drawAll(){
  drawSuit();
  for(const el of S.els){if(!el.on)continue;resolve(el);
    if(el.type==="logo")drawLogo(el);else if(el.type==="flag")drawFlag(el);else drawText(el)}
  if(ctex)ctex.needsUpdate=true;
}

const LPX=10; // px per cm längs lemmen
const limbTex=[];
function limb(side,keys,paint){
  const curve=new THREE.CatmullRomCurve3(keys.map(k=>new THREE.Vector3(side*k[0],k[1],k[2])));
  const L=curve.getLength(),R=keys.length-1,NR=90,NA=48,pos=[],uv=[],idx=[];
  const rad=t=>{const f=t*R,i=Math.min(R-1,Math.floor(f)),g=f-i,s=g*g*(3-2*g);return[keys[i][3]+(keys[i+1][3]-keys[i][3])*s,keys[i][4]+(keys[i+1][4]-keys[i][4])*s]};
  const Z=new THREE.Vector3(0,0,1);
  for(let r=0;r<=NR;r++){
    const t=r/NR,C=curve.getPointAt(t),T=curve.getTangentAt(t);
    const F=Z.clone().sub(T.clone().multiplyScalar(T.dot(Z))).normalize();
    const O=new THREE.Vector3().crossVectors(F,T).normalize().multiplyScalar(side);
    const[ra,rb]=rad(t);
    for(let a=0;a<=NA;a++){const th=a/NA*Math.PI*2;
      const p=C.clone().addScaledVector(O,-Math.cos(th)*ra).addScaledVector(F,Math.sin(th)*rb);
      pos.push(p.x,p.y,p.z);uv.push(a/NA,1-t);}
  }
  for(let r=0;r<NR;r++)for(let a=0;a<NA;a++){const i=r*(NA+1)+a;idx.push(i,i+NA+1,i+1,i+1,i+NA+1,i+NA+2)}
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  const c=document.createElement("canvas");c.width=512;c.height=Math.round(L*LPX);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  const item={c,t,L,paint};limbTex.push(item);paintLimb(item);
  return new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:t,roughness:.84,side:THREE.DoubleSide}));
}
function paintLimb(it){

  x.fillStyle=S.suit;x.fillRect(0,0,Wl,it.c.height);it.paint(P,it.L,x,Wl);it.t.needsUpdate=true;
}

function buildTorso(){
  const M=72,pos=[],nor=[],uv=[],idx=[];const rows=[];
  for(let y=-9;y<=72;y+=1)rows.push(y);
  for(const half of[0,1]){
    const base=pos.length/3;
    for(const y of rows){
      const[a,b]=prof(y);
      const t0=half?Math.PI/2:-Math.PI/2,N=600;let cum=[0],pts=[[a*Math.sin(t0),b*Math.cos(t0),t0]];
      for(let i=1;i<=N;i++){const t=t0+Math.PI*i/N,p=[a*Math.sin(t),b*Math.cos(t),t],q=pts[i-1];cum.push(cum[i-1]+Math.hypot(p[0]-q[0],p[1]-q[1]));pts.push(p)}
      const L=cum[N];let j=0;
      for(let c=0;c<=M;c++){
        const s=L*c/M;while(j<N-1&&cum[j+1]<s)j++;
        const f=(s-cum[j])/((cum[j+1]-cum[j])||1),x=pts[j][0]+(pts[j+1][0]-pts[j][0])*f,z=pts[j][1]+(pts[j+1][1]-pts[j][1])*f;
        pos.push(x,150-y,z);
        const nx=x/(a*a),nz=z/(b*b),nl=Math.hypot(nx,nz)||1;nor.push(nx/nl,0,nz/nl);
        uv.push((half?.75:.25)+(s-L/2)/PREF,1-(y-Y0)/HT);
      }
    }
    for(let r=0;r<rows.length-1;r++)for(let c=0;c<M;c++){
      const i=base+r*(M+1)+c;idx.push(i,i+M+1,i+1,i+1,i+M+1,i+M+2);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);return g;
}

const CAMS={front:[0,100,340,92],back:[0,100,-340,92],side:[300,104,130,92],close:[0,130,150,128]};
let camTween=0;
function setCam(k,instant){
  const c=CAMS[k];if(!c||!camera)return;
  let cz=c[2];
  // "Nära" följer den sida man tittar på (fram/rygg)
  if(k==="close"&&camera.position.z-controls.target.z<0)cz=-cz;
  const to=new THREE.Vector3(c[0],c[1],cz),tt=new THREE.Vector3(0,c[3],0);
  // stoppa snurr + kvarvarande dragrörelse (damping)
  if(controls.autoRotate){controls.autoRotate=false;const sp=document.getElementById("spin");if(sp)sp.classList.remove("on")}
  controls.enableDamping=false;controls.update();controls.enableDamping=true;
  document.querySelectorAll("#camBtns button").forEach(b=>b.classList.toggle("on",b.dataset.cam===k));
  const id=++camTween;
  if(instant){camera.position.copy(to);controls.target.copy(tt);controls.update();return}
  // sfärisk interpolation runt dockan – kameran åker runt, inte rakt igenom
  const tf=controls.target.clone();
  const sFrom=new THREE.Spherical().setFromVector3(camera.position.clone().sub(tf));
  const sTo=new THREE.Spherical().setFromVector3(to.clone().sub(tt));
  let dth=sTo.theta-sFrom.theta;dth=Math.atan2(Math.sin(dth),Math.cos(dth));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur=reduce?0:650,t0=performance.now();
  controls.enabled=false;
  (function step(now){
    if(id!==camTween)return;
    const t=dur?Math.min(1,((now||performance.now())-t0)/dur):1;
    const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    const tg=tf.clone().lerp(tt,e);
    const s=new THREE.Spherical(sFrom.radius+(sTo.radius-sFrom.radius)*e,sFrom.phi+(sTo.phi-sFrom.phi)*e,sFrom.theta+dth*e);
    camera.position.copy(tg).add(new THREE.Vector3().setFromSpherical(s));
    controls.target.copy(tg);camera.lookAt(tg);
    if(t<1)requestAnimationFrame(step);else{controls.enabled=true;controls.update()}
  })();
}
function setupPick(){

$("stitch").onchange=e=>{S.stitch=e.target.checked;update()};
$("camBtns").querySelectorAll("button").forEach(b=>b.onclick=()=>{show3D();setCam(b.dataset.cam,false)});
$("spin").onclick=()=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=2.2;$("spin").classList.toggle("on",controls.autoRotate)};
function show3D(){flat.hidden=true;$("m3d").classList.add("on");$("m2d").classList.remove("on");$("hint").textContent="Dra för att snurra · nyp/scrolla för zoom · klick placerar vald detalj"}
$("m3d").onclick=show3D;
$("m2d").onclick=()=>{flat.hidden=false;$("m2d").classList.add("on");$("m3d").classList.remove("on");$("hint").textContent="Dra en detalj för att flytta · rutnät 5 cm · streckad linje = krage";drawFlat()};
$("copySpec").onclick=async()=>{const t=spec();try{await navigator.clipboard.writeText(t);$("copySpec").textContent="Kopierat";setTimeout(()=>$("copySpec").textContent="Kopiera",1500)}catch(e){const r=document.createRange();r.selectNodeContents($("spec"));const s=getSelection();s.removeAllRanges();s.addRange(r)}};
let armed=false;
$("reset").onclick=()=>{if(!armed){armed=true;$("reset").textContent="Klicka igen";setTimeout(()=>{armed=false;$("reset").textContent="Återställ"},2500);return}
  S=JSON.parse(JSON.stringify(DEFAULT));armed=false;$("reset").textContent="Återställ";
  $("suitColor").value=S.suit;$("stripeColor").value=S.stripe;$("panelColor").value=S.panel;$("stitch").checked=S.stitch;update();renderPanel()};

drawAll();renderPanel();$("spec").textContent=spec();
Promise.all(FONTS.map(f=>loadFont(f.id))).then(()=>{update();renderPanel()});

if(window.THREE&&THREE.OrbitControls)init3D();else{$("hint").textContent="3D kunde inte laddas – använd Ritning";$("m2d").click()}

<script>
/* ===== Mobilförslag – slider A/B/C ===== */
(()=>{
const NAMES=["Original","A · Sticky docka","B · Dra-upp-ark","C · Flikar"];
const NOTES=[
 "Nuvarande sidan som den är.",
 "Dockan står kvar överst medan du scrollar menyn under.",
 "Dockan i helskärm – dra upp menyn underifrån (tryck på handtaget för att växla).",
 "Dockan i helskärm – en flik i taget: Detalj, Färg, Spec."];
const LKEY="fjj-mobil-layout";
const body=document.body,shell=document.getElementById("shell"),bar=document.getElementById("propbar");
const rng=document.getElementById("lay"),nm=document.getElementById("layName"),note=document.getElementById("layNote");
const grab=document.getElementById("grab"),panel=document.querySelector(".panel"),tb=document.querySelector(".toolbar");
const q=new URLSearchParams(location.search).get("lay");
let lay=q!==null&&"0123".includes(q)?+q:(()=>{try{const v=localStorage.getItem(LKEY);if(v!==null)return +v}catch(e){}return innerWidth<=860?1:0})();
let sheet="peek",tab="detalj",dragH=null;
function snaps(){const H=parseFloat(shell.style.getPropertyValue("--H"))||innerHeight,top=parseFloat(shell.style.getPropertyValue("--top"))||0,av=H-top;
  return{peek:170,half:Math.round(av*.52),full:Math.round(av*.86)}}
function measure(){
  const fr=body.classList.contains("frame"),m=body.classList.contains("m");
  const H=fr?shell.clientHeight:(window.visualViewport?visualViewport.height:innerHeight);
  const top=fr||!m?0:bar.offsetHeight;
  const st=shell.style;
  st.setProperty("--H",H+"px");st.setProperty("--top",top+"px");st.setProperty("--tb",tb.offsetHeight+"px");
  st.setProperty("--tabs","58px");st.setProperty("--pane",Math.round((H-top)*.42)+"px");
  if(dragH===null)st.setProperty("--sheet",snaps()[sheet]+"px");
}
function apply(){
  const narrow=innerWidth<=860;
  body.classList.toggle("m",lay>0);body.classList.toggle("frame",lay>0&&!narrow);
  ["a","b","c"].forEach((k,i)=>body.classList.toggle("lay-"+k,lay===i+1));
  rng.value=lay;nm.textContent=NAMES[lay];
  note.textContent=NOTES[lay]+(lay>0&&!narrow?" (Visas i telefonram på datorn.)":"");
  setTab(tab);measure();requestAnimationFrame(measure);
  try{localStorage.setItem(LKEY,lay)}catch(e){}
  window.__lay=lay;
}
function setTab(t){tab=t;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  panel.querySelectorAll(":scope>[data-tab]").forEach(d=>d.classList.toggle("act",d.dataset.tab===t));
  panel.scrollTop=0}
function setSheet(s){sheet=s;dragH=null;measure()}
window.__setSheet=setSheet;window.__setTab=setTab;
rng.addEventListener("input",()=>{lay=+rng.value;apply()});
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
// handtag: dra eller tryck
let d=null;
grab.addEventListener("pointerdown",e=>{d={y:e.clientY,h:parseFloat(shell.style.getPropertyValue("--sheet")),moved:false};grab.setPointerCapture(e.pointerId);shell.classList.add("dragging")});
grab.addEventListener("pointermove",e=>{if(!d)return;const dy=d.y-e.clientY;if(Math.abs(dy)>4)d.moved=true;if(!d.moved)return;
  const sn=snaps();dragH=Math.max(120,Math.min(sn.full,d.h+dy));shell.style.setProperty("--sheet",dragH+"px")});
const end=()=>{if(!d)return;shell.classList.remove("dragging");const sn=snaps();
  if(!d.moved){setSheet(sheet==="peek"?"half":sheet==="half"?"full":"peek")}
  else{let best="peek",bd=1e9;for(const k in sn){const v=Math.abs(sn[k]-dragH);if(v<bd){bd=v;best=k}}setSheet(best)}
  d=null};
grab.addEventListener("pointerup",end);grab.addEventListener("pointercancel",end);
grab.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setSheet(sheet==="peek"?"half":sheet==="half"?"full":"peek")}});
// välj detalj i "peek" → öppna arket halvvägs
document.getElementById("chips").addEventListener("click",()=>{if(lay===2&&sheet==="peek")setSheet("half")});
addEventListener("resize",()=>apply());
if(window.visualViewport)visualViewport.addEventListener("resize",measure);
apply();
})();
</script>
