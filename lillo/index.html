<script type="module">
import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const TEST = Q.get('test');              // 'autoplay' | 'lose' | null
const FF = +(Q.get('ff') || 0);          // snabbspola N sekunder simulering före första bilden
const D2R = Math.PI / 180;

// =====================================================================
// CONFIG – all balans på ett ställe

const CONFIG = {
  startGubbar: 14,
  spawnPerSek: 4.2,            // nya jägare ur stallet per sekund

  vagor: [ { svin: 150, tid: 22 }, { svin: 480, tid: 28 }, { svin: 1400, tid: 36 } ],

// =====================================================================
// PALETT – Blommeröd (index 0 = papper/bakgrund)
// =====================================================================
const PAL = {
  papper: 0xf4e7e2, dimrosa: 0xe6b9ae, kalk: 0xf6f1e7, puts: 0xcdc3b6, svart: 0x241e22,
  tak: 0x786860, takLjus: 0x9f8c80, glas: 0x3d4d5f, grus: 0xdcc59f, grusMork: 0xb3966f,
  ang: 0xa5c262, angMork: 0x638b40, granMork: 0x3f5c30, asp: 0xf2c14e, rost: 0xc4622f,
  stam: 0x5e3c2b, tra: 0x8f5d3b, sjo: 0x5b97bd, sjoLjus: 0xa7d6e3, bla: 0x2f5ed6,
  blaLjus: 0x8db0f6, svin: 0x47291f, svinLjus: 0x7d5241, rod: 0xd7352b, gul: 0xfbc021, hud: 0xeab48e,
};
const PAL_LIST = Object.values(PAL);
const css = h => '#' + h.toString(16).padStart(6, '0');

// =====================================================================
// PLATTOR – Lillö som kedja av diorama-plattor (lokal z: norr = −z)
// Lägg till fler plattor här (Fastlandet, Allén söder, Udden …)
// =====================================================================
const PLATTOR = [
  { id: 'garibaldi',  namn: 'Garibaldistallet', z0: 8.2,   z1: -6.0, halv: 6.2, bygg: byggGaribaldi },
  { id: 'allen-norr', namn: 'Allén norr',       z0: -6.16, z1: -26.0, halv: 5.5, bygg: byggAllen },
];
const KEDJA = { z0: PLATTOR[0].z0, z1: PLATTOR[PLATTOR.length - 1].z1, halv: Math.max(...PLATTOR.map(p => p.halv)) };

// Bana
const VAG = { halv: 3.0 };                      // grusvägens halva bredd
const FILER = { v: [-3.0, -1.1], m: [-0.9, 0.9], h: [1.1, 3.0] };
const HALL_Z = -25.0;                           // jägarna håller linjen här
const SVIN_Z = -26.3;                           // svinen kliver in över plattkanten

// =====================================================================
// RNG (seedad så test blir reproducerbara)
// =====================================================================
let seed = (+(Q.get('seed') || 1337)) >>> 0;
function rnd(a = 0, b = 1) { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return a + (b - a) * (((t ^ (t >>> 14)) >>> 0) / 4294967296); }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// =====================================================================
// Renderer, låg upplösning + pixel-postprocess
// =====================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.localClippingEnabled = true;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const world = new THREE.Group();
world.rotation.y = 45 * D2R;           // kedjan längs diagonalen => kameran ser den rakt uppåt i stående läge
scene.add(world);
world.updateMatrixWorld(true);

const camera = new THREE.PerspectiveCamera(20, 1, 10, 400);
const CAM = { az: 45 * D2R, el: 33 * D2R, fov: 20, vy: +(Q.get('zoom') || 11), vyMin: 5.5, vyMax: 19, tx: 0, tz: -9, shake: 0 };

let rt = new THREE.WebGLRenderTarget(4, 4, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: rt.texture }, uRes: { value: new THREE.Vector2(4, 4) },
    uPal: { value: PAL_LIST.map(h => new THREE.Vector3(((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255)) },
    uDither: { value: 1.0 }, uInk: { value: 1.0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    precision highp float;
    #define NPAL ${PAL_LIST.length}
    uniform sampler2D tScene; uniform vec2 uRes; uniform vec3 uPal[NPAL]; uniform float uDither; uniform float uInk;
    varying vec2 vUv;
    float L(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
    float bayer2(vec2 a){ a=floor(a); return fract(a.x/2. + a.y*a.y*.75); }
    float bayer4(vec2 a){ return bayer2(.5*a)*.25 + bayer2(a); }
    void main(){
      vec2 px = 1./uRes;
      vec4 c0 = texture2D(tScene, vUv);
      if(c0.a < .5){ gl_FragColor = vec4(uPal[0],1.); return; }      // papper
      vec4 n1 = texture2D(tScene, vUv+vec2(px.x,0.)), n2 = texture2D(tScene, vUv-vec2(px.x,0.));
      vec4 n3 = texture2D(tScene, vUv+vec2(0.,px.y)), n4 = texture2D(tScene, vUv-vec2(0.,px.y));
      float l0 = L(c0.rgb), e = 0.;
      // kantsuppression mot pappret: ingen bläckhalo runt plattan
      if(n1.a>.5) e=max(e,abs(l0-L(n1.rgb))); if(n2.a>.5) e=max(e,abs(l0-L(n2.rgb)));
      if(n3.a>.5) e=max(e,abs(l0-L(n3.rgb))); if(n4.a>.5) e=max(e,abs(l0-L(n4.rgb)));
      e = pow(e, .4545);
      float platt = c0.a < .9 ? 0. : 1.;                                // skyltar/siffror: ingen kontur inuti
      vec3 c = pow(max(c0.rgb,0.), vec3(1./2.2));                       // gamma
      float g = L(c); c = mix(vec3(g), c, 1.08); c = (c-.5)*1.03+.5;    // grade före snäpp
      float ink = smoothstep(.13,.34,e) * uInk * platt;
      c = mix(c, vec3(.085,.082,.076), ink*.62);                        // bläckkontur
      float d = bayer4(gl_FragCoord.xy) - .5;
      float gate = smoothstep(.004,.055,e);
      c += d*(.010 + .045*gate)*uDither*platt;                                // svag Bayer, mest där toner rör sig
      vec3 w = vec3(1.,1.12,.93);
      float b1=1e9, b2=1e9; vec3 c1=uPal[1], c2=uPal[1];
      for(int i=1;i<NPAL;i++){ vec3 dd=(c-uPal[i])*w; float dist=dot(dd,dd);
        if(dist<b1){ b2=b1; c2=c1; b1=dist; c1=uPal[i]; } else if(dist<b2){ b2=dist; c2=uPal[i]; } }
      if(b2-b1 < .0012 && L(c2) > L(c1)) c1 = c2;                       // bryt nära-lika mot ljusare
      gl_FragColor = vec4(c1,1.);
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

let LOW = { w: 4, h: 4, css: 1.5, cw: 1, ch: 1 };
function resize() {
  const cw = Math.max(2, innerWidth), ch = Math.max(2, innerHeight);
  const pxs = Math.max(1.5, cw / 360);               // css-px per spelpixel (≈1/4 av skärmen på iPhone)
  LOW = { w: Math.round(cw / pxs), h: Math.round(ch / pxs), css: pxs, cw, ch };
  renderer.setSize(LOW.w, LOW.h, false);
  rt.setSize(LOW.w, LOW.h);
  postMat.uniforms.uRes.value.set(LOW.w, LOW.h);
  camera.aspect = LOW.w / LOW.h;
  updateCamera(0);
}

// klipp-plan per platta (rena kanter, inga jordsidor)
function klippPlan(x0, x1, z0, z1) {
  const P = [
    new THREE.Plane(new THREE.Vector3(1, 0, 0), -x0), new THREE.Plane(new THREE.Vector3(-1, 0, 0), x1),
    new THREE.Plane(new THREE.Vector3(0, 0, 1), -z1), new THREE.Plane(new THREE.Vector3(0, 0, -1), z0),
  ];
  P.forEach(p => p.applyMatrix4(world.matrixWorld));
  return P;
}
const KLIPP_KEDJA = klippPlan(-KEDJA.halv, KEDJA.halv, KEDJA.z0, KEDJA.z1);

// =====================================================================
// Ljus
// =====================================================================
scene.add(new THREE.HemisphereLight(0xfff4ec, 0xc9b6aa, 1.35));
const sol = new THREE.DirectionalLight(0xfff1e0, 1.25);
{
  const c = new THREE.Vector3(0, 0, -9).applyMatrix4(world.matrixWorld);
  const dir = new THREE.Vector3(-0.45, 1.1, 0.75).applyMatrix4(new THREE.Matrix4().makeRotationY(world.rotation.y)).normalize();
  sol.position.copy(c).addScaledVector(dir, 40); sol.target.position.copy(c);
  sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
  Object.assign(sol.shadow.camera, { left: -21, right: 21, top: 21, bottom: -21, near: 5, far: 90 });
  sol.shadow.bias = -0.0006; sol.shadow.normalBias = 0.02; sol.shadow.intensity = 0.65;
  scene.add(sol, sol.target);
}

// =====================================================================
// Voxel-hjälpare (allt statiskt slås ihop till få meshar med vertexfärg)
// =====================================================================
const _col = new THREE.Color();
function paint(g, hex) {
  _col.set(hex); const n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = _col.r; a[i * 3 + 1] = _col.g; a[i * 3 + 2] = _col.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3)); return g;
}
const _eu = new THREE.Euler(), _m4 = new THREE.Matrix4();
function box(L, w, h, d, x, y, z, hex, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.BoxGeometry(w, h, d).toNonIndexed(); g.deleteAttribute('uv');
  if (rx || ry || rz) g.applyMatrix4(_m4.makeRotationFromEuler(_eu.set(rx, ry, rz)));
  g.translate(x, y, z); paint(g, hex); L.push(g); return g;
}
function tris(L, triList, hex, center) {
  const pos = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3(), m = new THREE.Vector3();
  for (const [A, B, C] of triList) {
    a.fromArray(A); b.fromArray(B); c.fromArray(C);
    n.subVectors(b, a).cross(m.subVectors(c, a));
    const cen = a.clone().add(b).add(c).multiplyScalar(1 / 3).sub(center);
    if (n.dot(cen) < 0) pos.push(...A, ...C, ...B); else pos.push(...A, ...B, ...C);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals(); paint(g, hex); L.push(g); return g;
}
// valmat tak (hip roof) ~33°
function valmTak(L, w, d, x, y0, z, hex, lut = 33) {
  const hw = w / 2, hd = d / 2, h = Math.min(hw, hd) * Math.tan(lut * D2R);
  const A = [x - hw, y0, z - hd], B = [x + hw, y0, z - hd], C = [x + hw, y0, z + hd], D = [x - hw, y0, z + hd];
  let T;
  if (w >= d) { const r = hw - hd, R1 = [x - r, y0 + h, z], R2 = [x + r, y0 + h, z]; T = [[A, B, R2], [A, R2, R1], [C, D, R1], [C, R1, R2], [B, C, R2], [D, A, R1]]; }
  else { const r = hd - hw, R1 = [x, y0 + h, z - r], R2 = [x, y0 + h, z + r]; T = [[D, A, R1], [D, R1, R2], [B, C, R2], [B, R2, R1], [A, B, R1], [C, D, R2]]; }
  tris(L, T, hex, new THREE.Vector3(x, y0 - 1, z));
  return h;
}
function mats(planes) {
  return {
    v: new THREE.MeshLambertMaterial({ vertexColors: true, clippingPlanes: planes }),
    vatten: new THREE.MeshLambertMaterial({ color: PAL.sjo, flatShading: true, clippingPlanes: planes }),
  };
}
function slaIhop(L, mat, skugga = true) {
  const m = new THREE.Mesh(mergeGeometries(L), mat);
  m.castShadow = skugga; m.receiveShadow = true; return m;
}
const vattenYtor = [];
function vatten(grp, mat, x0, x1, z0, z1) {
  const g = new THREE.PlaneGeometry(x1 - x0, z0 - z1, Math.ceil((x1 - x0) / 0.55), Math.ceil((z0 - z1) / 0.55));
  g.rotateX(-Math.PI / 2); g.translate((x0 + x1) / 2, -0.06, (z0 + z1) / 2);
  const m = new THREE.Mesh(g, mat); m.receiveShadow = true; grp.add(m);
  vattenYtor.push({ g, bas: Float32Array.from(g.attributes.position.array) });
}

// =====================================================================
// Pixelfont 3×5 (egen, skarp i låg upplösning)
// =====================================================================
const FONT = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001011001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111',
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', F: '111100110100100',
  G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
  M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100', Q: '010101101110011', R: '110101110101101',
  S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
  Y: '101101010010010', Z: '111001010100111', 'Å': '010010101111101', 'Ä': '101010101111101', 'Ö': '101010101101010',
  '+': '000010111010000', '×': '000101010101000', '-': '000000111000000', '/': '001001010100100', '!': '010010010000010',
  ':': '000010000010000', '.': '000000000000010', '?': '111001011000010', ' ': '000000000000000',
  '♥': '0101011111111110111000100', '@': '010111010101101',
};
const glyf = ch => FONT[ch] || FONT[ch.toUpperCase()] || FONT['?'];
function textW(s, k) { let w = 0; for (const ch of s) w += (glyf(ch).length / 5) * k + k; return Math.max(0, w - k); }
function drawText(ctx, s, cx, y, k, col, outline) {
  const x0 = Math.round(cx - textW(s, k) / 2);
  const pass = (c, o) => {
    ctx.fillStyle = c; let x = x0;
    for (const ch of s) {
      const g = glyf(ch), gw = g.length / 5;
      for (let r = 0; r < 5; r++) for (let q = 0; q < gw; q++) if (g[r * gw + q] === '1') ctx.fillRect(x + q * k - o, y + r * k - o, k + 2 * o, k + 2 * o);
      x += gw * k + k;
    }
  };

const TPU = 24; // texlar per världsenhet ≈ spelpixlar vid standardzoom
// skylt-/sifferytor skrivs med alfa 0.75 i render-targeten => posten hoppar över bläck/dither där (annars äter konturen pixeltexten)
const PLATT = { blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.ZeroFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.ZeroFactor, opacity: 0.75, alphaTest: 0.5 };
const skyltMat = o => new THREE.MeshBasicMaterial({ ...PLATT, ...o });
function canvasTex(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;
  return { cv, ctx: cv.getContext('2d'), tex };
}
// skylt = plan med canvas-textur, lutad mot kameran
function skylt(grp, w, h, x, y, z, ritare, mat) {
