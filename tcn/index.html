const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function oppna(raw) {
  if (document.readyState !== 'complete') await new Promise(r => window.addEventListener('load', r, { once: true }));
  const nyckel = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const d = b64(DATA), html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, nyckel, d.slice(12)));
  document.open(); document.write(html); document.close();
}
async function harled(pw) {
  const bas = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().toLowerCase()), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(SALT), iterations: ITER }, bas, 256));
}
(async () => {
  const sparad = localStorage.getItem(LS);
  if (sparad) { try { const o = JSON.parse(sparad); if (o.t > Date.now()) return await oppna(b64(o.k)); } catch (e) { localStorage.removeItem(LS); } }
})();
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  try {
    const raw = await harled(document.getElementById('p').value);
    localStorage.setItem(LS, JSON.stringify({ k: btoa(String.fromCharCode(...raw)), t: Date.now() + 30 * 864e5 }));
    await oppna(raw);
  } catch (err) {
    localStorage.removeItem(LS);
    const f = document.getElementById('f'); f.classList.remove('skak'); void f.offsetWidth; f.classList.add('skak');
    document.getElementById('fel').textContent = 'Fel lösenord';
  }
};
