<meta property="og:title" content="Kartkoll Sverige 2.0">

<meta property="og:url" content="https://www.buttercup.nu/so/">
<meta property="og:image" content="https://www.buttercup.nu/so/og.jpg?v=2"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#FFFBF2; --card:#FFFFFF; --card2:#F6F2E8; --ink:#1F2D3D; --muted:#5E6B78; --line:#E7E0CF;
  --sea:#DDEFFA; --sea2:#C9E5F6; --nbland:#F1EFE6; --nbline:#D6D1C2; --land:#F4F1E4; --pline:#8E9CA6;
  --gl:#FFDF94; --sv:#B5DCF7; --nl:#BFE8B8; --gl2:#F2B93B; --sv2:#4E9BD8; --nl2:#47A85A;
  --lake:#8FCBEF; --lake2:#4C9BD1;
  --accent:#FF7A59; --accent-soft:#FFE4DB; --blue:#4F7FE8; --blue-soft:#E1E9FD;
  --sun:#FFC53D; --sun-soft:#FFF1CC;
  --good:#22A061; --good-soft:#D7F4E3; --bad:#E5534B; --bad-soft:#FDE2DF;
  --p1:#FFE6A8;--p2:#CDE8FA;--p3:#D6F1CB;--p4:#FBD3E6;--p5:#E3DAFB;--p6:#FFD9BF;--p7:#CDF1EC;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:20px; --top:0px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- top bar ---------- */
.top{background:rgba(255,251,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:20;
  padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:var(--ink);text-decoration:none}
.logo small{font-size:.75rem;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;vertical-align:3px}
.logo svg{width:32px;height:32px;color:var(--ink)}
.logo-n{transform-origin:16px 16px;animation:needle 6s ease-in-out infinite}
@keyframes needle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(28deg)}84%{transform:rotate(-16deg)}92%{transform:rotate(6deg)}}
.stars{display:flex;align-items:center;gap:6px;font-weight:800;background:var(--sun-soft);border:1.5px solid #F7DB8A;border-radius:999px;padding:5px 14px;font-variant-numeric:tabular-nums;font-size:1.05rem}
.stars svg{width:22px;height:22px}
.stars.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.35) rotate(-6deg)}}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 9px;scrollbar-width:none;scroll-behavior:smooth}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:800;font-size:.92rem;padding:0 14px;height:40px;display:flex;align-items:center;gap:6px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);white-space:nowrap;transition:background .3s,color .3s,transform .3s}
.nav a i{font-style:normal}
.nav a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:#fff;transform:translateY(-1px)}

/* ---------- app layout ---------- */
.app{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.top{min-width:0}
.stage{position:relative;flex:0 0 48%;min-height:220px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#EAF6FD 0%,var(--sea) 55%,var(--sea2) 100%);border-bottom:1px solid var(--line)}
.panel{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px max(14px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.app.tall .stage{flex-basis:58%}
.app.short .stage{flex-basis:34%}
@media (min-width:820px){
  .app{flex-direction:row}
  .stage,.app.tall .stage,.app.short .stage{flex:1 1 auto;order:2;border-bottom:none;border-left:1px solid var(--line)}
  .panel{flex:0 0 min(460px,46%);order:1;padding:20px 20px 60px}
}
svg.map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}

/* ---------- map styles ---------- */
.map .sea{fill:transparent}
.map .grat{fill:none;stroke:#9CC6E3;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 5;opacity:.55}
.map .nb{fill:var(--nbland);stroke:var(--nbline);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.map text{font-family:var(--f-body);font-weight:800;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:.28em;stroke-linejoin:round;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.map .nbl{fill:#A8A291;stroke:var(--nbland);font-size:1.05em;letter-spacing:.12em;text-transform:uppercase}
.map .seal{fill:#3E86BF;stroke:var(--sea);font-style:italic;font-size:.95em;letter-spacing:.04em;transition:opacity .5s}
.map.noseal .seal{opacity:0}
.map .prov{fill:var(--land);stroke:var(--pline);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .55s ease,opacity .5s;cursor:pointer}
.map.ldc .prov.lG,.map .prov.lG.ok{fill:var(--gl)}
.map.ldc .prov.lS,.map .prov.lS.ok{fill:var(--sv)}
.map.ldc .prov.lN,.map .prov.lN.ok{fill:var(--nl)}
.map .prov.sel{fill:var(--sun)!important}
.map .prov.bad{fill:var(--bad-soft)!important}
.map .prov.hint{animation:phint 1s ease-in-out infinite}
.map .prov.dim{opacity:.35}
.map .prov.glow{fill:#FFD27A!important}
@keyframes phint{50%{fill:var(--sun)}}
@media (hover:hover){.map.taphover .prov:hover{fill:#FFEFC2}}
.map .prov.shake{transform-box:fill-box;transform-origin:center;animation:pshake .5s ease}
@keyframes pshake{20%{transform:translateX(-4%)}40%{transform:translateX(3.5%)}60%{transform:translateX(-2.5%)}80%{transform:translateX(1.5%)}}
.map .lake{fill:var(--lake);stroke:var(--lake2);stroke-width:.8;vector-effect:non-scaling-stroke;transition:fill .4s}
.map .lake.sel,.map .lake.hint{fill:var(--sun)}.map .lake.hint{animation:lhint 1s infinite}
@keyframes lhint{50%{fill:var(--lake)}}
.map .lake.ok{fill:#5FB3E8}.map .lake.bad{fill:var(--bad)}
.map.lakes-tap .lake{cursor:pointer}
.map .lifted{transform-box:fill-box;transform-origin:center;stroke:#fff;stroke-width:2.2;pointer-events:none;filter:drop-shadow(0 4px 5px rgba(31,45,61,.35));animation:lift 1s cubic-bezier(.3,1.7,.5,1) forwards}
.map .lifted.down{animation:liftdown .5s ease forwards}
@keyframes lift{0%{transform:scale(1)}45%{transform:scale(1.28) translateY(-7%)}100%{transform:scale(1.14) translateY(-4%)}}
@keyframes liftdown{0%{transform:scale(1.14) translateY(-4%);opacity:1}100%{transform:scale(1);opacity:0}}
.map .dot{fill:var(--accent);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.map .dot.ring{fill:#fff;stroke:var(--accent);stroke-width:3}
.map .dot.ok{fill:var(--good)}.map .dot.bad{fill:var(--bad)}.map .dot.hint{animation:dhint 1s infinite}
@keyframes dhint{50%{fill:var(--sun);stroke:var(--sun)}}
.map .dot.blue{fill:var(--blue)}
.map .peak{fill:#6B5B4B;stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
.map .peak.ok{fill:var(--good)}.map .peak.hint{animation:dhint 1s infinite}
.map .hit{fill:transparent;cursor:pointer}
.map .seaz{fill:#4F9FD8;fill-opacity:.08;stroke:#4F9FD8;stroke-dasharray:6 6;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer;animation:wave 3s ease-in-out infinite}
.map .seaz.ok{fill:var(--good);fill-opacity:.3;stroke:var(--good);animation:none}
.map .seaz.bad{fill:var(--bad);fill-opacity:.25}
.map .seaz.hint{fill:var(--sun);fill-opacity:.55}
@keyframes wave{50%{stroke-dashoffset:12;fill-opacity:.16}}
.map .pulse{fill:none;stroke:var(--accent);stroke-width:3;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
.map .pulse.d2{animation-delay:.8s}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.6);opacity:0}}
.map .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.map .lbl-ok{fill:#16613D}
.map .lbl-big{font-size:1.5em}
.map .lbl-sm{font-size:.82em}
.map .lbl-xs{font-size:.7em}
.map .lbl-num{font-size:.95em;fill:#fff;stroke:var(--ink);stroke-width:.32em}
.map .route{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .route.ghost{stroke:#fff;stroke-width:7;opacity:.85}
.map .route.alv{stroke:var(--blue);stroke-dasharray:7 6}
.map .route.trail{stroke:var(--accent);stroke-dasharray:2 7;stroke-width:3;opacity:.7}
.map .draw{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .grid line{stroke:var(--accent);stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:.8}
.map .grid .frame{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.map .cell{fill:transparent;cursor:pointer;transition:fill .3s}
.map .cell.ok{fill:var(--good);fill-opacity:.28}.map .cell.bad{fill:var(--bad);fill-opacity:.25}
.map text.gl{fill:var(--accent);font-size:1.15em}
.map .arrow{stroke:var(--blue);stroke-width:4;fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.map .arrowhead{fill:var(--blue)}
.map .rul{stroke:var(--ink);stroke-width:3.5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:10 6}
.map .rul-h{fill:var(--accent);stroke:#fff;stroke-width:3;vector-effect:non-scaling-stroke;cursor:grab}
.map .rul-h.snap{fill:var(--good)}
.map .rul-t{font-size:1.15em;fill:var(--ink)}
.map .boat{pointer-events:none}
.map.drawin .prov{fill:transparent;stroke:#5D7180;stroke-width:1.6;stroke-dasharray:1 1;stroke-dashoffset:1;vector-effect:none;animation:drawin 1.6s ease-in-out forwards}
@keyframes drawin{to{stroke-dashoffset:0}}
.map.drawin .lake{opacity:0}
.map .lake{transition:opacity .8s,fill .4s}
.map .compassmk path{fill:var(--blue)}
.map .origin{fill:#fff;stroke:var(--blue);stroke-width:3;vector-effect:non-scaling-stroke}

/* map UI overlay */
.mapui{position:absolute;inset:0;pointer-events:none}
.mapui>*{pointer-events:auto}
.north{position:absolute;top:10px;right:10px;width:40px;height:40px;pointer-events:none}
.zoomctl{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.zoomctl button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:1.5rem;font-weight:800;line-height:1;box-shadow:0 3px 10px rgba(31,45,61,.12);display:grid;place-items:center;transition:transform .2s}
.zoomctl button:active{transform:scale(.9)}
.zpre{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 70px)}
.zpre button{height:40px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.92);font-weight:800;font-size:.85rem;box-shadow:0 2px 8px rgba(31,45,61,.08)}
.zpre button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.scalebar{position:absolute;left:12px;bottom:14px;display:flex;flex-direction:column;gap:2px;pointer-events:none;font-weight:800;font-size:.75rem;color:var(--ink)}
.scalebar i{display:block;height:8px;border:2px solid var(--ink);border-top:none;background:linear-gradient(90deg,var(--ink) 0 50%,#fff 50% 100%);background-size:100% 4px;background-repeat:no-repeat;background-position:bottom;transition:width .2s}
.scalebar span{background:rgba(255,255,255,.8);border-radius:6px;padding:0 4px;align-self:flex-start}
.toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,14px) scale(.9);opacity:0;background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:0 6px 20px rgba(31,45,61,.18);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none;white-space:nowrap;max-width:calc(100% - 150px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.good{background:var(--good);color:#fff}.toast.bad{background:var(--bad);color:#fff}
.dragghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) scale(1.12) rotate(-3deg);box-shadow:0 10px 24px rgba(31,45,61,.28)!important}
.dragghost.home{transition:left .45s cubic-bezier(.3,1.4,.5,1),top .45s cubic-bezier(.3,1.4,.5,1),transform .45s}
.dragghost.snapto{transition:left .35s ease,top .35s ease,transform .35s ease,opacity .35s;transform:translate(-50%,-50%) scale(.6);opacity:0}

/* ---------- panel content ---------- */
.view{display:flex;flex-direction:column;gap:14px;animation:viewin .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes viewin{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
.head{display:flex;flex-direction:column;gap:2px}
.head h2{font-size:clamp(1.6rem,5vw,2.1rem)}
.head p{margin:2px 0 0;color:var(--muted);font-size:.98rem}
.eyebrow{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--accent)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 0 rgba(31,45,61,.04)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 15px;font-weight:800;font-size:.92rem;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.prompt{font-family:var(--f-display);font-size:clamp(1.3rem,4.4vw,1.65rem);font-weight:700;line-height:1.18}
.prompt b{color:var(--accent)}
.prompt.pin{animation:viewin .45s cubic-bezier(.2,.9,.3,1)}
.fb{border-radius:14px;padding:10px 14px;font-weight:800;min-height:1.5em;animation:fbin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes fbin{0%{transform:scale(.92);opacity:0}}
.fb:empty{display:none}
.fb.good{background:var(--good-soft);color:#13693F}
.fb.bad{background:var(--bad-soft);color:#B3322B}
.fb.info{background:var(--card2);color:var(--ink);font-weight:700}
.bar{height:12px;background:var(--card2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--sun));width:0;border-radius:999px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.btn{min-height:48px;border:none;background:var(--accent);color:#fff;font-weight:800;border-radius:999px;padding:10px 22px;font-size:1.02rem;box-shadow:0 3px 0 #D9593A;transition:transform .15s,box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #D9593A}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #3560C2}
.btn.green{background:var(--good);box-shadow:0 3px 0 #17784A}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{flex:1 1 160px;min-width:0;min-height:50px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;font-size:1.1rem;font-weight:700}
.inp:focus{border-color:var(--blue);outline:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opt{min-height:52px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;text-align:left;transition:transform .15s,background .3s}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.note{font-size:.92rem;color:var(--muted);margin:0}
.hintline{font-size:.95rem;background:var(--sun-soft);border-radius:14px;padding:9px 13px;animation:fbin .35s}
.big{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.celebrate{align-items:center;text-align:center}
.celebrate .big{font-size:3.2rem;animation:pop2 .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop2{0%{transform:scale(.3)}}
.starrow{display:flex;gap:6px;justify-content:center}
.starrow svg{width:44px;height:44px;animation:starin .6s cubic-bezier(.3,1.8,.5,1) both}
.starrow svg:nth-child(2){animation-delay:.15s}.starrow svg:nth-child(3){animation-delay:.3s}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}}

/* hem */
.hero h1{font-size:clamp(2.2rem,8vw,3.1rem);color:var(--ink)}
.hero h1 span{color:var(--accent)}
.score{display:flex;align-items:center;gap:14px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--card2)}.ring .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.3,1.2,.5,1);transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font-family:var(--f-display);font-weight:800;font-size:22px;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.group h3{font-size:1.15rem;display:flex;align-items:center;gap:8px}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1.5px dashed var(--line)}
.ck:first-of-type{border-top:none}
.ck input{width:26px;height:26px;flex:none;accent-color:var(--good)}
.ck label{flex:1;min-width:0;font-size:.97rem}
.ck a{flex:none;font-weight:800;color:#fff;background:var(--blue);text-decoration:none;font-size:.85rem;border-radius:999px;padding:0 12px;height:40px;display:flex;align-items:center}
.badge{display:inline-block;font-size:.7rem;font-weight:800;background:var(--good-soft);color:#13693F;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-weight:800;font-size:.9rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:18px;border-radius:6px;border:1px solid rgba(0,0,0,.12)}

/* begrepp */
.vis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vis button{min-height:76px;border:2px solid var(--line);background:#fff;border-radius:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .2s,border-color .2s,background .2s}
.vis button span{font-size:1.7rem;line-height:1}
.vis button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.terms{display:flex;flex-wrap:wrap;gap:8px}
.term{min-height:46px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:1rem;transition:transform .2s,background .3s}
.term.on{border-color:var(--ink);background:var(--sun-soft);transform:scale(1.06)}
.defs{display:flex;flex-direction:column;gap:8px}
.def{min-height:48px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;text-align:left;display:flex;gap:10px;font-weight:600;transition:background .4s}
.def .lt{font-weight:800;color:var(--muted);flex:none;width:1.4em}
.def .tag{margin-left:auto;font-weight:800;flex:none}
.term.done,.def.done{border-color:transparent;cursor:default}
.def.done{animation:fbin .4s}
.fcard{perspective:900px;height:240px;cursor:pointer}
.fcard-in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.fcard.flip .fcard-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center}
.face.front{background:#fff}
.face.back{background:var(--blue-soft);transform:rotateY(180deg);font-size:1.12rem;font-weight:700}
.face .emo{font-size:3rem;line-height:1}
.face .w{font-family:var(--f-display);font-size:2.3rem;font-weight:800}

/* chips / labels to drag */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .3s,transform .2s,background .2s;box-shadow:0 2px 0 var(--line)}
.chip.k-stad{border-color:#FFB8A6}.chip.k-sjö{border-color:#9DD1F1}.chip.k-hav{border-color:#8FB8E8;font-style:italic}.chip.k-berg{border-color:#C9B8A6}
.chip.on{background:var(--sun-soft);border-color:var(--ink);transform:scale(1.06)}
.chip.used{opacity:.3;cursor:default;box-shadow:none}
.chip.lift{opacity:.25}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800;min-height:2.2em}
.order span{background:var(--accent-soft);color:#B2462B;border-radius:999px;padding:4px 12px;animation:pop2 .4s cubic-bezier(.3,1.8,.5,1)}

/* provblad */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.sheet label{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.sheet label span{width:1.8em;text-align:right;color:var(--muted)}
.sheet input{flex:1;min-width:0;min-height:40px;border:none;border-bottom:2px dashed var(--line);background:transparent;padding:4px 2px;font-weight:700;font-size:1rem}
.sheet input:focus{outline:none;border-bottom-color:var(--blue);background:var(--blue-soft)}
.sheet input.ok{border-bottom:2px solid var(--good);color:#13693F}
.sheet input.bad{border-bottom:2px solid var(--bad);color:#B3322B}
.sheet small{display:block;font-size:.75rem;color:#B3322B;margin-left:2.3em;margin-top:-4px}

/* kartbok */
.register{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.9rem;background:#FFFDF6;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.register .rh{font-family:var(--f-body);font-weight:800;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.register div.r{display:flex;gap:6px;white-space:nowrap;border-radius:6px;padding:0 4px}
.register div.r .d{flex:1;overflow:hidden;color:var(--line)}
.register div.r .p{flex:none;font-weight:700}
.register div.r.t{background:var(--sun-soft);animation:fbin .4s}
.pagebtns{display:flex;gap:8px;flex-wrap:wrap}
.pagebtns .btn{min-height:44px;padding:6px 14px;font-size:.92rem}
.symbol{width:110px;height:82px;border:1.5px solid var(--line);border-radius:14px;background:var(--land);flex:none}
.symbol .wv{animation:wv 2.4s ease-in-out infinite}
@keyframes wv{50%{transform:translateX(6px)}}
.symbol .tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.2s ease-in-out infinite}
.symbol .tree:nth-child(2n){animation-delay:-.7s}
@keyframes sway{50%{transform:rotate(7deg)}}
.symbol .rail{animation:rail 1s linear infinite}
@keyframes rail{to{stroke-dashoffset:-16}}
.symbol .road{stroke-dasharray:200;animation:road 2.6s ease-in-out infinite}
@keyframes road{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}
.symbol .border{animation:rail 1.4s linear infinite}
.symbol .city{transform-box:fill-box;transform-origin:center;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.15)}}
.symbol .mtn{transform-box:fill-box;transform-origin:50% 100%;animation:rise 2.4s cubic-bezier(.3,1.5,.5,1) infinite}
@keyframes rise{0%{transform:scaleY(.3)}35%,100%{transform:scaleY(1)}}
.symbol .plane{animation:fly 3s ease-in-out infinite}
@keyframes fly{0%{transform:translate(-30px,14px) rotate(20deg)}50%{transform:translate(0,0) rotate(0)}100%{transform:translate(30px,-14px) rotate(20deg)}}
.symbol .field{animation:wv 3s ease-in-out infinite}
.legendgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.legendgrid figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.85rem;text-align:center}

/* kompass */
.compass{width:min(100%,250px);margin:0 auto;display:block;touch-action:none;user-select:none}
.compass .rose{transform-origin:0 0;animation:spin 1.2s cubic-bezier(.25,1.4,.45,1)}
@keyframes spin{0%{transform:rotate(-300deg) scale(.6);opacity:.2}100%{transform:rotate(0) scale(1);opacity:1}}
.compass .sec{fill:#fff;stroke:var(--line);stroke-width:1.5;cursor:pointer;transition:fill .25s}
@media (hover:hover){.compass .sec:hover{fill:var(--sun-soft)}}
.compass .sec.ok{fill:var(--good-soft);stroke:var(--good)}.compass .sec.bad{fill:var(--bad-soft);stroke:var(--bad)}
.compass .sec.hintsec{fill:var(--sun-soft);stroke:var(--sun);animation:dhint2 1s infinite}
@keyframes dhint2{50%{fill:var(--sun)}}
.compass text{font-family:var(--f-body);font-weight:800;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.compass .needle{fill:var(--accent)}.compass .needle2{fill:#B9C2CA}
.compass .swipe{stroke:var(--blue);stroke-width:6;stroke-linecap:round;fill:none;opacity:.8}

/* skala */
.ruler{width:100%;height:auto;display:block}
.ruler .rb{fill:var(--sun-soft);stroke:var(--sun)}
.ruler line{stroke:var(--ink)}
.ruler text{font-family:var(--f-body);font-weight:800;fill:var(--ink);font-size:11px;text-anchor:middle}
.ruler .meas{stroke:var(--accent);stroke-width:3;stroke-dasharray:300;stroke-dashoffset:300;animation:meas 1s .2s ease forwards}
@keyframes meas{to{stroke-dashoffset:0}}
.ruler circle{fill:var(--accent)}
.steps{display:flex;flex-direction:column;gap:6px;background:var(--card2);border-radius:14px;padding:12px 14px;font-weight:700}
.steps .eq{font-variant-numeric:tabular-nums}
.trick{border-left:5px solid var(--sun);padding:9px 13px;background:var(--sun-soft);border-radius:0 14px 14px 0}
.kmread{font-family:var(--f-display);font-size:2rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}

/* egna ord */
textarea.inp{min-height:110px;resize:vertical;width:100%;font-weight:600;font-size:1.05rem;line-height:1.45}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys span{font-weight:800;font-size:.88rem;border-radius:999px;padding:3px 10px;animation:pop2 .4s cubic-bezier(.3,1.8,.5,1) both}
.keys .y{background:var(--good-soft);color:#13693F}
.keys .n{background:var(--card2);color:var(--muted);border:1px dashed var(--line)}
.model{background:var(--blue-soft);border-radius:14px;padding:12px 14px;font-weight:600;animation:fbin .4s}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.qnav button.cur{border-color:var(--ink);border-width:2.5px}
.qnav button.done{background:var(--good-soft);border-color:var(--good);color:#13693F}
.miss{border-top:1.5px dashed var(--line);padding-top:8px}
.result{display:flex;flex-direction:column;gap:10px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
#testbox{position:fixed;left:8px;bottom:8px;z-index:80;background:#1F2D3D;color:#fff;font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px 10px;border-radius:10px;max-width:90vw;max-height:40vh;overflow:auto;white-space:pre-wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.mapq{position:absolute;left:10px;top:10px;max-width:calc(100% - 70px);background:rgba(255,255,255,.95);border-radius:16px;padding:6px 12px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.2;box-shadow:0 4px 14px rgba(31,45,61,.14);opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .3s;pointer-events:none}
.mapq.on{opacity:1;transform:none}
.map .nse{vector-effect:none}
.zpre:not(:empty)~.mapq{top:58px}
@media (max-width:819px){.zpre{display:none}.zpre:not(:empty)~.mapq{top:10px}}

</style>

function addPlaces(){const out={};
  ['Östersjön','Kattegatt','Bottenviken','Bottenhavet','Skagerrak'].forEach((n,i)=>{const[x,y]=G.seas[n];const e=S('ellipse',{cx:x,cy:y,rx:n==='Kattegatt'||n==='Skagerrak'?26:34,ry:26,class:'seaz pop','data-k':'sea','data-n':n});e.style.animationDelay=(i*80)+'ms';L.fx.append(e);out[n]={el:e,kind:'hav'}});
  ['Vänern','Vättern','Mälaren','Hjälmaren','Siljan','Storsjön','Torneträsk'].forEach(n=>{out[n]={el:MAP.lakes[n],kind:'sjö'}});
  const[kx,ky]=G.places.Kebnekaise;const pk=S('path',{d:'M0 -10L9 6L-9 6Z',class:'peak','data-k':'place','data-n':'Kebnekaise'});const pkg=S('g'),pin=S('g',{class:'pop'});pin.append(pk,S('circle',{cx:0,cy:0,r:16,class:'hit','data-k':'place','data-n':'Kebnekaise'}));pkg.append(pin);scaled(pkg,kx,ky,1);out.Kebnekaise={el:pk,kind:'berg'};
  ['Malmö','Göteborg','Stockholm','Umeå','Kiruna'].forEach((n,i)=>{const[x,y]=G.places[n];const g=S('g',{class:'pop'});g.style.animationDelay=(200+i*90)+'ms';const d=dot(x,y,6.5,'dot',g);d.dataset.k='place';d.dataset.n=n;const hh=dot(x,y,16,'hit',g);hh.dataset.k='place';hh.dataset.n=n;L.fx.append(g);out[n]={el:d,kind:'stad'}});

function setCls(el,c){const base=el.classList.contains('lake')?'lake':el.classList.contains('peak')?'peak':el.tagName==='ellipse'?'seaz':'dot';el.setAttribute('class',base+(c?' '+c:''))}
function placeLabel(n,cls=''){const[x,y]=placeXY(n);const k=(PLACE[n]||{}).k||(G.seas[n]?'hav':LAKE[n]?'sjö':'stad');const t=label(x,y,n,(k==='hav'?'seal ':'')+'pop '+cls);

/* hitta platsen vid en skärmpunkt (för dra-och-släpp) */
function placeAt(sx,sy,pl){const[x,y]=toWorld(sx,sy);const pt=new DOMPoint(x,y);
  for(const n in pl){const e=pl[n].el;if(pl[n].kind==='sjö'&&e.isPointInFill(pt))return n}
  for(const n in pl){const e=pl[n].el;if(pl[n].kind==='hav'&&e.isPointInFill(pt))return n}
  let best=null,bd=30;for(const n in pl){const k=pl[n].kind;if(k!=='stad'&&k!=='berg'&&k!=='sjö')continue;const[ax,ay]=k==='sjö'?LAKE[n].c:G.places[n];const[px,py]=toScreen(ax,ay);const d=Math.hypot(px-sx,py-sy)-(k==='sjö'?6:0);if(d<bd){bd=d;best=n}}
  if(!best){for(const n in pl){if(pl[n].kind!=='hav')continue;const[ax,ay]=G.seas[n];const[px,py]=toScreen(ax,ay);if(Math.hypot(px-sx,py-sy)<40)return n}}
  return best}

    pick(TERMS,4).forEach(t=>Q.push({type:'mcq',q:t.d,opts:shuffle([t.t,...pick(TERMS.filter(x=>x!==t).map(x=>x.t),3)]),a:t.t,tag:'Begrepp'}));
    pick(TEN,2).forEach(n=>Q.push({type:'tapProv',q:`Tryck på ${n} på kartan.`,a:n,tag:'Landskap'}));
    pick(PROVS,2).forEach(n=>Q.push({type:'nameProv',q:'Vilket landskap är markerat på kartan?',a:n,opts:shuffle([n,...pick(PROVS.filter(x=>x!==n),3)]),tag:'Landskap'}));
    pick(PLACES,2).forEach(x=>Q.push({type:'tapPlace',q:`Tryck på ${x.n} på kartan.`,a:x.n,tag:'Platser'}));
    Q.push({type:'mcq',...PROVMCQ[0],opts:shuffle(PROVMCQ[0].opts)});
    pick(VQ,2).forEach(([t,ans])=>{const right=DIRNAME[ans[0]];Q.push({type:'mcq',q:t,opts:shuffle([right,...pick(DIRS.map(d=>d[1]).filter(d=>!ans.map(a=>DIRNAME[a]).includes(d)),3)]),a:right,tag:'Väderstreck'})});
    {const[s0,km]=pick(SCALES.slice(1,6),1)[0];const cm=pick([3,4,5,6],1)[0];Q.push({type:'num',q:`Skalan är 1:${fmt(s0)}. Du mäter ${cm} cm. Hur många km är det i verkligheten?`,a:+(cm*km).toFixed(1),tag:'Skala'})}
    Q.push({type:'mcq',...PROVMCQ[1],opts:shuffle(PROVMCQ[1].opts)});
    return shuffle(Q)}
  let Q,i,sc,miss;
  function start(){Q=gen();i=0;sc=0;miss=[];q()}
  function q(){clearFx();clearProv();dropLift();Object.values(MAP.lakes).forEach(e=>e.setAttribute('class','lake'));MAP.onTap=null;MAP.nearProv=false;mapMode('');
    if(i>=Q.length){fin();return}
    const x=Q[i];const b=bar();b.set(i/Q.length);const f=h('div',{class:'fb'});const area=h('div',{style:'display:flex;flex-direction:column;gap:10px'});let answered=false;
    const nx=h('button',{type:'button',class:'btn',hidden:true,onclick:()=>{i++;q()}},i===Q.length-1?'Se resultat':'Nästa');
    const res=(ok,txt)=>{if(answered)return;answered=true;if(ok){sc++;fb(f,'good','Rätt!')}else{miss.push([x,txt]);fb(f,'bad','Fel. Rätt svar: '+x.a)}nx.hidden=false;nx.focus({preventScroll:true})};
    if(x.type==='mcq'||x.type==='nameProv'){fly(camHome,{bump:.1});const o=h('div',{class:'opts'});x.opts.forEach(n=>o.append(h('button',{type:'button',class:'opt',onclick:e=>{if(answered)return;o.querySelectorAll('button').forEach(b=>b.disabled=true);e.currentTarget.classList.add(n===x.a?'ok':'bad');res(n===x.a,n)}},n)));
      if(x.type==='nameProv'){provCls(x.a,'sel');fly(fit(provBox(x.a,3.5,260)))}area.append(o)}
    else if(x.type==='tapProv'){mapMode('taphover');MAP.nearProv=true;zoomPresets(true);fly(camHome);area.append(h('p',{class:'note'},'Nyp eller använd + för att zooma.'));
      MAP.onTap=hit=>{if(answered||hit.k!=='prov')return;const n=hit.n;provCls(n,n===x.a?'ok':'bad');if(n!==x.a){provCls(x.a,'hint');shakeProv(n)}else lift(n);res(n===x.a,n)}}
    else if(x.type==='tapPlace'){mapMode('noseal lakes-tap');fly(camHome);const pl=addPlaces();
      MAP.onTap=hit=>{const n=hit.n;if(answered||!n||!pl[n])return;setCls(pl[n].el,n===x.a?'ok':'bad');if(n!==x.a)setCls(pl[x.a].el,'hint');res(n===x.a,n)}}
    else if(x.type==='num'){const inp=h('input',{class:'inp',id:'prov-num',inputmode:'decimal',autocomplete:'off',placeholder:'Svar'});const go=()=>{const v2=parseFloat(inp.value.replace(',','.'));inp.disabled=true;res(Math.abs(v2-x.a)<.01,inp.value)};inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();answered?(i++,q()):go()}});area.append(h('div',{class:'row'},inp,h('span',{style:'font-weight:800'},'km'),h('button',{type:'button',class:'btn',onclick:go},'Svara')))}
    zoomPresets(x.type==='tapProv');
    card.replaceChildren(h('div',{class:'meta'},h('span',{},`Fråga ${i+1} av ${Q.length}`),h('span',{},x.tag)),b.el,h('div',{class:'prompt pin'},x.q),area,f,h('div',{class:'row'},nx));
    if(innerWidth<820)scrollToCard();TEST&&(window.KK_PROV={x,res})}
  function fin(){fly(camHome);mapMode('ldc');const pr=sc/Q.length;record('prov',pr);const st=pr>=.9?5:pr>=.7?3:1;stars(st);if(pr>=.7)confetti();
    const link={Begrepp:'begrepp',Landskap:'landskap',Platser:'platser',Landsdelar:'landsdelar',Väderstreck:'vaderstreck',Skala:'skala','Göta kanal':'kanal'};
    card.replaceChildren(h('div',{class:'result'},h('div',{class:'prompt'},pr>=.9?'Du är redo för provet! 🎉':pr>=.7?'Riktigt bra!':'Bra kämpat, öva lite till!'),h('div',{class:'big'},`${sc} / ${Q.length}`),h('p',{class:'note'},`+${st} stjärnor`),
      miss.length?h('div',{},h('h3',{},'Det här kan du öva mer på'),...miss.map(([x,t])=>h('div',{class:'miss'},h('b',{},x.tag+': '),x.q,h('br'),'Du svarade: ',h('i',{},t||'–'),'. Rätt: ',h('b',{},String(x.a)),' ',h('a',{href:'#'+link[x.tag]},'Träna →')))):null,
      h('div',{class:'row'},h('button',{type:'button',class:'btn',onclick:start},'Nytt övningsprov'),h('a',{class:'btn alt',href:'#hem'},'Till checklistan'))));TEST&&(window.LAST_DONE={key:'prov',score:sc,total:Q.length})}
  intro()};

/* =========================================================
   Router, navigation och automatiskt test (?test=1)
   ========================================================= */
const nav=document.getElementById('nav');
ROUTES.forEach(([k,t,e])=>nav.append(h('a',{href:'#'+k,'data-k':k},h('i',{'aria-hidden':'true'},e),t)));
function route(force){const k=(location.hash||'#hem').slice(1);const r=V[k]?k:'hem';if(!force&&route.cur===r)return;route.cur=r;
  nav.querySelectorAll('a').forEach(a=>{const on=a.dataset.k===r;if(on){a.setAttribute('aria-current','page');a.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}else a.removeAttribute('aria-current')});
  resetMap();panelEl.replaceChildren();panelEl.scrollTop=0;V[r](panelEl);if(!['hem','begrepp','egna-ord'].includes(r))setTimeout(scrollToCard,1100)}
function scrollToCard(){if(innerWidth>=820)return;const c=panelEl.querySelector('.view .card');if(c)panelEl.scrollTo({top:c.offsetTop-8,behavior:'smooth'})}
panelEl.addEventListener('click',e=>{if(e.target.closest('.view > .seg'))setTimeout(scrollToCard,350)});
addEventListener('hashchange',()=>route());
document.getElementById('starCount').textContent=ST.stars;
applyCam();
route();

/* ---------- automatiskt genomklickande ---------- */
if(RUNTEST){(async()=>{
  const log=[];const box=document.getElementById('testbox');box.hidden=false;const out=s=>{log.push(s);box.textContent=log.join('\n');console.log('[TEST] '+s)};
  const W=ms=>sleep(ms);const go=async k=>{location.hash='#'+k;await W(700)};
  const btnText=(t,root=panelEl)=>[...root.querySelectorAll('button')].find(b=>b.textContent.trim()===t);
  const res={};
  try{
    // 1) Landskap: peka på alla 25 (första gången trycker vi fel med flit)
    await go('landskap');btnText('Alla 25').click();await W(300);let wrongDone=false;
    for(let k=0;k<25;k++){const n=panelEl.querySelector('.prompt b').textContent;
      if(!wrongDone){const w=PROVS.find(x=>x!==n);tapAt(MAP.prov[w],...PM[w]);wrongDone=true;await W(300)}
      tapAt(MAP.prov[n],...PM[n]);await W(1150)}
    res.landskap=window.LAST_DONE;out(`landskap: ${LAST_DONE.key} ${LAST_DONE.score}/${LAST_DONE.total} (väntat 24/25, ett fel med flit)`);
    // 2) Väderstreck: 10 frågor
    await go('vaderstreck');
    for(let k=0;k<10;k++){const Q=window.KK_VQ;if(Q.ans)Q.pick(Q.ans[0]);else Q.pick();await W(250);btnText('Nästa').click();await W(350)}
    res.vader=window.LAST_DONE;out(`väderstreck: ${LAST_DONE.score}/${LAST_DONE.total} (väntat 10/10)`);
    // 3) Skala: linjalen
    await go('skala');let rul=[];
    for(let k=0;k<RULER.length;k++){const cur=RULER[k];[...panelEl.querySelectorAll('.opt')].find(b=>b.textContent.includes(fmt(cur.km))).click();await W(250);
      KK_RUL.set(cur.a,cur.b);const km=KK_RUL.km();rul.push(`${cur.a}–${cur.b} ${Math.round(km)} km`);if(Math.abs(km-cur.km)>10)out('FEL avstånd '+cur.a+cur.b+' '+km);await W(250);btnText('Nästa →').click();await W(500)}
    res.linjal=window.LAST_DONE;out(`skala/linjal: ${LAST_DONE.score}/${LAST_DONE.total} – ${rul.join(', ')}`);
    btnText('Räkna med skala').click();await W(400);
    for(let k=0;k<8;k++){const s=KK_SK;s.i1.value=String(s.km).replace('.',',');s.go();await W(80);s.i2.value=String(s.tot).replace('.',',');s.go();await W(80);s.go();await W(150)}
    res.rakna=window.LAST_DONE;out(`skala/räkna: ${LAST_DONE.score}/${LAST_DONE.total} (väntat 8/8)`);
    // 4) Platser: dra alla namnlappar
    await go('platser');for(const x of PLACES){KK_DRA(x.n);await W(200)}await W(1600);
    res.platser=window.LAST_DONE;out(`platser/dra: ${LAST_DONE.score}/${LAST_DONE.total} (väntat 10/10)`);
    // 5) Kartbok: register & kartrutor
    await go('kartbok');
    for(let k=0;k<8;k++){const cur=KK_REG.cur();const c=cellOf(cur.p);KK_REG.setPage(c.pg);await W(150);const rc=L.fx.querySelector(`.cell[data-n="${c.cell}"]`);MAP.onTap({k:'cell',n:c.cell,el:rc});await W(150);
      [...panelEl.querySelectorAll('.opt')].find(b=>b.textContent===cur.ls).click();await W(150);btnText('Nästa plats →').click();await W(250)}
    res.kartbok=window.LAST_DONE;out(`kartbok: ${LAST_DONE.score}/${LAST_DONE.total} (väntat 8/8)`);
    // 6) Göta kanal: bygg vägen
    await go('kanal');btnText('Bygg vägen').click();await W(500);for(const s of G.canal){panelEl.querySelector(`.chip[data-n="${s.n}"]`).click();await W(120)}
    out(`kanal/bygg: rekord ${ST.best.kanal}`);
    out('KLART');window.TEST_RESULT={ok:true,res,log}}
  catch(e){out('KRASCH: '+e.message+'\n'+e.stack);window.TEST_RESULT={ok:false,err:String(e),log}}
})()}
