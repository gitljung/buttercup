<style>
/* Layout: sticky top bar with scrollable section chips; each section = task panel + map side by side on wide screens, stacked on phones */
:root{
  --bg:#EDF3F0; --surface:#FFFFFF; --surface2:#F5F8F6; --ink:#15302A; --muted:#58706A; --line:#CCD9D4;
  --pine:#2D6A4C; --pine-soft:#DCEDE3; --lake:#2A68A8; --lake-fill:#8DBBE0; --sea:#D4E5F1; --land:#E4EEDA; --border:#53675F;
  --falu:#B3362C; --falu-soft:#F6DEDA; --sun:#F1B42F; --sun-soft:#FCEFC9;
  --good:#23825A; --good-soft:#CDEBDB; --bad:#C2412D; --bad-soft:#F7D8D2;
  --gl:#EFD98E; --sv:#A9D0EA; --nl:#BFE0B4;
  --p1:#FCE2A6;--p2:#C8E4F6;--p3:#D6EFC9;--p4:#F5D0E2;--p5:#E0D6F7;--p6:#FBD4B8;--p7:#CDEEEA;
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1916; --surface:#16241F; --surface2:#1C2D27; --ink:#E3EEEA; --muted:#9BB2AB; --line:#2D423B;
  --pine:#73C79C; --pine-soft:#1F3B2F; --lake:#7DB2EA; --lake-fill:#2E5F8E; --sea:#132B40; --land:#2A4234; --border:#9DB7AC;
  --falu:#EC7064; --falu-soft:#43211E; --sun:#F4C451; --sun-soft:#3E3417;
  --good:#5CCB92; --good-soft:#173A2A; --bad:#F07A66; --bad-soft:#45221C;
  --gl:#6C5F2C; --sv:#2E5878; --nl:#35613C;
  --p1:#5A4A1E;--p2:#22445C;--p3:#2E4D2A;--p4:#57304A;--p5:#3E3566;--p6:#5A3A22;--p7:#1F4D49;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#16241F; --surface2:#1C2D27; --ink:#E3EEEA; --muted:#9BB2AB; --line:#2D423B;
  --pine:#73C79C; --pine-soft:#1F3B2F; --lake:#7DB2EA; --lake-fill:#2E5F8E; --sea:#132B40; --land:#2A4234; --border:#9DB7AC;
  --falu:#EC7064; --falu-soft:#43211E; --sun:#F4C451; --sun-soft:#3E3417;
  --good:#5CCB92; --good-soft:#173A2A; --bad:#F07A66; --bad-soft:#45221C;
  --gl:#6C5F2C; --sv:#2E5878; --nl:#35613C;
  --p1:#5A4A1E;--p2:#22445C;--p3:#2E4D2A;--p4:#57304A;--p5:#3E3566;--p6:#5A3A22;--p7:#1F4D49;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.45rem;color:var(--pine);text-decoration:none}
.logo svg{width:30px;height:30px}
.stars{display:flex;align-items:center;gap:6px;font-weight:800;background:var(--sun-soft);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.stars svg{width:20px;height:20px}
.nav{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:.95rem;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);white-space:nowrap}
.nav a[aria-current="page"]{background:var(--pine);border-color:var(--pine);color:var(--surface)}

main{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.head h2{font-size:clamp(1.7rem,4.5vw,2.3rem)}
.head p{margin:0;color:var(--muted);max-width:62ch}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--falu)}

.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 13px;font-weight:700;font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.split{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:860px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}.split.mapfirst>.mapbox{order:2}.sticky{position:sticky;top:120px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.zoom{display:flex;gap:6px;flex-wrap:wrap}
.zoom button{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:4px 10px;font-weight:700;font-size:.85rem}
.zoom button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine)}
svg.map{width:100%;height:auto;max-height:78vh;display:block;touch-action:manipulation;border-radius:10px}
.map .sea{fill:var(--sea)}
.map .prov{fill:var(--land);stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s}
.map.tap .prov{cursor:pointer}
@media (hover:hover){.map.tap .prov:hover{fill:var(--sun-soft)}}
.map .prov.sel{fill:var(--sun)}
.map .prov.ok{fill:var(--good-soft)}
.map .prov.bad{fill:var(--bad-soft)}
.map .prov.hint{animation:pulse 1s ease-in-out infinite}
.map .prov.ld-Götaland{fill:var(--gl)}.map .prov.ld-Svealand{fill:var(--sv)}.map .prov.ld-Norrland{fill:var(--nl)}
.map .lake{fill:var(--lake-fill);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.map.lakes-tap .lake{pointer-events:auto;cursor:pointer}
.map .lake.sel{fill:var(--sun)}.map .lake.ok{fill:var(--good)}.map .lake.bad{fill:var(--bad)}
.map .lake.hint{animation:pulse 1s infinite}
@keyframes pulse{50%{fill:var(--sun)}}
.map text{font-family:var(--f-body);font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:.24em;stroke-linejoin:round;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.map text.sea-t{fill:var(--lake);font-style:italic}
.map .dot{fill:var(--falu);stroke:var(--surface);stroke-width:1.5;vector-effect:non-scaling-stroke}
.map .dot.ok{fill:var(--good)}.map .dot.bad{fill:var(--bad)}.map .dot.hint{animation:pulse2 1s infinite}
@keyframes pulse2{50%{fill:var(--sun)}}
.map .hit{fill:transparent;cursor:pointer}
.map .seaz{fill:var(--lake);fill-opacity:.07;stroke:var(--lake);stroke-dasharray:4 4;stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
.map .seaz.ok{fill:var(--good);fill-opacity:.35}.map .seaz.bad{fill:var(--bad);fill-opacity:.3}.map .seaz.hint{fill:var(--sun);fill-opacity:.5}
.map .peak{fill:var(--ink);stroke:var(--surface);stroke-width:1;vector-effect:non-scaling-stroke}
.map .peak.ok{fill:var(--good)}.map .peak.hint{fill:var(--sun)}
.map .grid line{stroke:var(--falu);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.7}
.map .cell{fill:transparent;cursor:pointer}
@media (hover:hover){.map .cell:hover{fill:var(--sun);fill-opacity:.25}}
.map .cell.ok{fill:var(--good);fill-opacity:.25}.map .cell.bad{fill:var(--bad);fill-opacity:.25}
.map text.gl{fill:var(--falu)}
.map .route{fill:none;stroke:var(--falu);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .route.alv{stroke:var(--lake);stroke-dasharray:6 5}
.map .draw{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}

.prompt{font-family:var(--f-display);font-size:clamp(1.35rem,3.6vw,1.75rem);font-weight:700;line-height:1.2}
.prompt b{color:var(--falu)}
.fb{border-radius:12px;padding:10px 14px;font-weight:700;min-height:1.5em}
.fb:empty{display:none}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--surface2);color:var(--ink);font-weight:600}
.bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--pine);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.btn{border:none;background:var(--pine);color:var(--surface);font-weight:800;border-radius:12px;padding:10px 18px;font-size:1rem}
.btn.alt{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--falu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{flex:1 1 180px;min-width:0;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:1.1rem;font-weight:700}
.inp:focus{border-color:var(--pine);outline:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px;font-weight:700;text-align:left}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.note{font-size:.93rem;color:var(--muted)}
.hintline{font-size:.95rem;background:var(--sun-soft);border-radius:10px;padding:8px 12px}

/* Home */
.hero{display:grid;gap:16px;grid-template-columns:1fr;align-items:center;margin-bottom:22px}
@media(min-width:760px){.hero{grid-template-columns:1.2fr .8fr}}
.hero h1{font-size:clamp(2.4rem,7vw,3.6rem);color:var(--pine)}
.hero p{max-width:52ch;margin:6px 0 0;color:var(--muted)}
.hero .scorecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.group h3{font-size:1.2rem;margin-bottom:8px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.ck:first-of-type{border-top:none}
.ck input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--pine)}
.ck label{flex:1;min-width:0}
.ck a{flex:none;font-weight:800;color:var(--falu);text-decoration:none;font-size:.9rem;padding-top:2px}
.badge{display:inline-block;font-size:.72rem;font-weight:800;background:var(--good-soft);color:var(--good);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:2px}

/* Begrepp */
.terms{display:flex;flex-wrap:wrap;gap:8px}
.term{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 12px;font-weight:800;font-size:1.02rem}
.term.on{border-color:var(--ink);background:var(--sun-soft)}
.defs{display:flex;flex-direction:column;gap:8px}
.def{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;text-align:left;display:flex;gap:10px;font-weight:600}
.def .lt{font-weight:800;color:var(--muted);flex:none;width:1.4em}
.def .tag{margin-left:auto;font-weight:800;flex:none}
.term.done,.def.done{border-color:transparent;cursor:default}
.card{perspective:900px;height:260px;cursor:pointer}
.card-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.face.front{background:var(--surface2)}
.face.back{background:var(--pine-soft);transform:rotateY(180deg);font-size:1.15rem;font-weight:700}
.face .emo{font-size:3.2rem;line-height:1}
.face .w{font-family:var(--f-display);font-size:2.4rem;font-weight:800}
@media (prefers-reduced-motion:reduce){.card-in{transition:none}.shake{animation:none}.map .prov.hint,.map .lake.hint,.map .dot.hint{animation:none;fill:var(--sun)}}

/* Provblad */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.sheet label{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.sheet label span{width:1.8em;text-align:right;color:var(--muted)}
.sheet input{flex:1;min-width:0;border:none;border-bottom:2px dashed var(--line);background:transparent;padding:4px 2px;font-weight:700;font-size:1rem}
.sheet input:focus{outline:none;border-bottom-color:var(--pine)}
.sheet input.ok{border-bottom:2px solid var(--good);color:var(--good)}
.sheet input.bad{border-bottom:2px solid var(--bad);color:var(--bad)}
.sheet small{display:block;font-size:.75rem;color:var(--bad);margin-left:2.3em;margin-top:-4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-weight:700;font-size:.9rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:4px;border:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 14px;font-weight:800}
.chip.used{opacity:.35;cursor:default}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800;min-height:2em}
.order span{background:var(--pine-soft);color:var(--pine);border-radius:999px;padding:3px 11px}

/* Kartbok */
.register{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.92rem;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.register .rh{font-family:var(--f-body);font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.register div.r{display:flex;gap:6px;white-space:nowrap}
.register div.r .n{flex:none}
.register div.r .d{flex:1;overflow:hidden;color:var(--line)}
.register div.r .p{flex:none;font-weight:700}
.register div.r.t{background:var(--sun-soft);border-radius:6px}
.symbol{width:96px;height:72px;border:1px solid var(--line);border-radius:10px;background:var(--land);flex:none}

/* Compass */
.compass{width:min(100%,300px);margin:0 auto;display:block}
.compass .sec{fill:var(--surface2);stroke:var(--line);stroke-width:1.5;cursor:pointer}
@media (hover:hover){.compass .sec:hover{fill:var(--sun-soft)}}
.compass .sec.ok{fill:var(--good-soft);stroke:var(--good)}.compass .sec.bad{fill:var(--bad-soft);stroke:var(--bad)}
.compass text{font-family:var(--f-body);font-weight:800;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.compass .needle{fill:var(--falu)}.compass .needle2{fill:var(--muted)}

/* Skala */
.ruler{width:100%;height:auto;display:block}
.ruler .rb{fill:var(--sun-soft);stroke:var(--sun)}
.ruler line{stroke:var(--ink)}
.ruler text{font-family:var(--f-body);font-weight:800;fill:var(--ink);font-size:11px;text-anchor:middle}
.ruler .meas{stroke:var(--falu);stroke-width:3}
.ruler circle{fill:var(--falu)}
.steps{display:flex;flex-direction:column;gap:6px;background:var(--surface2);border-radius:12px;padding:12px 14px;font-weight:700}
.steps .eq{font-variant-numeric:tabular-nums}
.trick{border-left:4px solid var(--sun);padding:8px 12px;background:var(--sun-soft);border-radius:0 12px 12px 0}

/* Egna ord */
textarea.inp{min-height:110px;resize:vertical;width:100%;font-weight:600;font-size:1.05rem;line-height:1.45}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys span{font-weight:800;font-size:.88rem;border-radius:999px;padding:3px 10px}
.keys .y{background:var(--good-soft);color:var(--good)}
.keys .n{background:var(--surface2);color:var(--muted);border:1px dashed var(--line)}
.model{background:var(--pine-soft);border-radius:12px;padding:12px 14px;font-weight:600}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-weight:800;font-variant-numeric:tabular-nums}
.qnav button.cur{border-color:var(--ink)}
.qnav button.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}

/* Prov */
.result{display:flex;flex-direction:column;gap:10px}
.miss{border-top:1px dashed var(--line);padding-top:8px}
.minimap svg.map{max-height:52vh}
.mapq{display:none;font-family:var(--f-display);font-weight:700;font-size:1.1rem;padding:2px 6px}
.mapq:empty{display:none}
@media (max-width:859px){.mapq{display:block}svg.map{max-height:72vh}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <a class="logo" href="#hem" aria-label="Kartkoll start">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16 5 L20 16 L16 27 L12 16Z" fill="var(--falu)"/><path d="M16 16 L20 16 L16 27Z" fill="currentColor" opacity=".5"/></svg>
        Kartkoll
      </a>
      <div class="stars" title="Dina stjärnor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="var(--sun)"/></svg><span id="starCount">0</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Avsnitt"></nav>
  </div>
</header>
<main id="app"></main>
