const P=D.projekt, Q=D.fragor;
const STEG=['Förstudie','Modellering','Design Review','Montering'];
const stegIx=s=>({'idé':0,'förstudie':0,'modellering':1,'modell i DR':2,'montering':3})[s]??0;
const pn=k=>{const p=P.find(p=>p.kanal==k);return p?(p.namn||nice(k)):nice(k)};
function nice(k){return k.replace(/^yamay-/,'Yamay ').replace(/-/g,' ').replace(/^./,c=>c.toUpperCase())}
function ago(t){if(!t)return'';const s=(Date.now()-new Date(t))/1e3;if(s<3600)return Math.max(1,s/60|0)+' min';if(s<86400)return(s/3600|0)+' h';return(s/86400|0)+' d'}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const who=document.getElementById('who');who.value=localStorage.pp_who||'Vicke';who.onchange=()=>{localStorage.pp_who=who.value;render()};
function toast(t){const e=document.getElementById('toast');e.innerHTML=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',5200)}
function zoom(src){const z=document.getElementById('zoom');z.querySelector('img').src=src;z.style.display='flex'}
function go(h){location.hash=h}
window.onhashchange=render;

function qCard(q){
  const alts=q.alt.map(a=>`<button class="alt" data-k="${a.k}" onclick="pick('${q.id}','${a.k}')"><b>${a.k}</b>${esc(a.t)}${a.rek?'<span class="rek">★ rek</span>':''}</button>`).join('');
  return `<div class="q" id="q-${q.id}">
   <div class="top"><span class="pj" onclick="go('p=${q.kanal}')">${esc(pn(q.kanal))}</span>›<span>${esc(q.trad)}</span><span class="age">${ago(q.fran)} sedan</span></div>
   <h3>${esc(q.q)}</h3>${q.kontext?`<div class="ctx">${esc(q.kontext)}</div>`:''}
   ${q.img?`<img src="${q.img}" onclick="zoom(this.src)" alt="">`:'<div class="noimg">ingen skiss till denna fråga (gamla formatet)</div>'}
   <div class="alts">${alts}</div>
   <div class="ann"><input placeholder="Annat svar …" id="qa-${q.id}"><button class="btn sm" onclick="pick('${q.id}','fritext')">Skicka</button></div></div>`;
}
function pick(id,k){
  const q=Q.find(q=>q.id==id), el=document.getElementById('q-'+id);
  let txt; if(k=='fritext'){txt=document.getElementById('qa-'+id).value.trim();if(!txt)return}
  else{const a=q.alt.find(a=>a.k==k);txt=`${k}: ${a.t}`;el.querySelectorAll('.alt').forEach(b=>b.classList.toggle('on',b.dataset.k==k))}
  el.classList.add('sent');
  toast(`<b>Skiss:</b> skulle posta i #${esc(q.kanal)} › ${esc(q.trad)}<br>”${esc(who.value)} (webb): ${esc(q.q)} → ${esc(txt)}”<br>Vickan tar det därifrån som vanligt.`);
}
function pCard(p){
  const ix=stegIx(p.steg), oq=Q.filter(q=>q.kanal==p.kanal).length, oi=(p.arenden.oppen||0)+(p.arenden.analyserad||0)+(p.arenden.pagar||0)+(p.arenden.delvis||0);
  return `<div class="p" onclick="go('p=${p.kanal}')">
   <div class="nm">${esc(p.namn||nice(p.kanal))}</div>
   <div class="tp">${esc(p.topic)||'&nbsp;'}</div>
   <div class="steps">${STEG.map((s,i)=>`<span class="${i<ix?'d':i==ix?'c':''}"></span>`).join('')}</div>
   <div class="stl">${STEG[ix]}</div>
   <div class="chips">${oq?`<span class="chip r">❓ ${oq} till dig</span>`:''}${oi?`<span class="chip y">📋 ${oi} öppna ärenden</span>`:''}<span class="chip">💬 ${ago(p.last)} sedan</span></div></div>`;
}
function home(){
  return `<h2>Att ta ställning till <span class="n">${Q.length}</span></h2>
   <div class="qs">${Q.map(qCard).join('')}</div>
   <h2>Projekt <span class="n">${P.length}</span></h2>
   <div class="ps">${P.map(pCard).join('')}</div>`;
}
function proj(k){
  const p=P.find(p=>p.kanal==k); if(!p)return home();
  const ix=stegIx(p.steg), qs=Q.filter(q=>q.kanal==k);
  const dc=`https://discord.com/channels/1114447465203109918/${p.id}`;
  const trs=p.tradar.map(t=>`<div class="tr"><div class="h"><b>${esc(t.name)}</b>${t.vantar_pa_vicke?'<span class="chip r">väntar på svar</span>':''}<button class="btn sm" onclick="comp('${t.id}')">Svara</button><a class="btn sm" href="${t.link}" target="_blank">Discord ↗</a></div>
     <div class="m">Senast ${ago(t.last)} sedan · ${esc(t.by)}${t.n?` · ${t.n} inlägg`:''}</div>
     <div class="comp" id="c-${t.id}"><textarea placeholder="Skriv till tråden ${esc(t.name)} …"></textarea>
       <div class="r"><label class="btn sm">📎 Bild<input type="file" accept="image/*" hidden></label><span class="sp"></span>
       <button class="btn sm pri" onclick="sendT('${t.id}','${esc(t.name)}')">Skicka till tråden</button></div></div></div>`).join('');
  const iss=p.oppna.length?`<div class="is">${p.oppna.map(i=>`<a class="ic" href="${i.url}" target="_blank">${i.img?`<img src="${i.img}">`:''}<div>${i.sev||''} #${i.nr} ${esc(i.t)}</div></a>`).join('')}</div>`:'<div class="empty">Inga öppna ärenden.</div>';
  const bes=p.beslut.length?`<ul class="bl">${p.beslut.map(b=>`<li><span class="d">${b.d.slice(5)}</span>${esc(b.t)}</li>`).join('')}</ul>`:'<div class="empty">Inga beslut loggade i PROJEKT.md än.</div>';
  return `<div class="back" onclick="go('')">← Alla projekt</div>
   <div class="ph"><h1 class="t">${esc(p.namn||nice(k))}</h1>
     <div class="acts">${p.dr.map(d=>`<a class="btn" target="_blank" href="https://www.buttercup.nu/design-review/?p=${d.slug}">3D ${esc(d.name.replace(/^Yamay /,''))}${d.v?' v'+d.v:''}</a>`).join('')}<a class="btn" target="_blank" href="${dc}">#${esc(k)} ↗</a></div></div>
   <div class="steps" style="margin:12px 0 4px">${STEG.map((s,i)=>`<span class="${i<ix?'d':i==ix?'c':''}"></span>`).join('')}</div>
   <div class="stl">${STEG.map((s,i)=>i==ix?`<span style="color:var(--chili)">${s}</span>`:s).join(' · ')}</div>
   ${qs.length?`<h2>Att ta ställning till <span class="n">${qs.length}</span></h2><div class="qs">${qs.map(qCard).join('')}</div>`:''}
   <div class="cols"><div><h2>Trådar</h2><div class="box">${trs||'<div class="empty">Inga trådar.</div>'}</div></div>
   <div><h2>Öppna ärenden</h2><div class="box">${iss}</div><h2>Beslut</h2><div class="box">${bes}</div></div></div>`;
}
function comp(id){document.getElementById('c-'+id).classList.toggle('on')}
function sendT(id,name){const t=document.querySelector('#c-'+id+' textarea');if(!t.value.trim())return;
  toast(`<b>Skiss:</b> skulle posta i tråden ${esc(name)} som ”${esc(who.value)} (webb)”:<br>”${esc(t.value.slice(0,140))}”`);t.value='';comp(id)}
function render(){const h=location.hash.slice(1);const m=h.match(/^p=(.+)$/);document.getElementById('main').innerHTML=m?proj(decodeURIComponent(m[1])):home();scrollTo(0,0)}
render();
</script>
