<div class="bc-bar"><a href="/">← Buttercup.nu</a><span>Pågående projekt · Yamay utekök</span><b>Plan B(lommeröd)</b></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import GUI from 'lil-gui';

// ------------------------------------------------------------------ parametrar (mm)
const P = {
  L: 2500, D: 650, H: 900,              // bänkskivans yttermått + total höjd (KEMA 50595)
  ohF: 250, ohS: 25, ohB: 25,           // överhäng: gästsida (bar), gavlar, kocksida
  kant: 40, plat: 6,                    // nedvikt kant + plåttjocklek bänkskiva (6 mm rostfri)
  // rostfria luckor på kocksidan
  luckor: true, luckDj: 20, luckMax: 600, luckOppen: 0,
  // stomme – bockad C-profil
  pa: 60, pb: 40, pt: 3, cc: 800, feet: 40, stommeMat: 'corten',
  hat: 30, hatMax: 450,                 // regeldjup (bockad hattprofil) för ekpanel
  liv: true,                            // ekpanelen i liv med bänkskivans kant
  // ekpanel TP1
  panF: true, panS: true, panB: false, golvluft: 15, fog: 2,
  // wok
  wok: true, wokX: 0, wokW: 650, wokDj: 480, wokSank: 160, brannare: 300,
  // inredning
  hylla: true, hyllaH: 330,
  // visa
  visaPanel: true, visaTopp: true, visaStomme: true, visaSkruv: true, visaLuckor: true, mått: true, snitt: false,
};
const PRESETS = {
  'KEMA 2500×650 (50595)': {L:2500, D:650, H:900, ohF:250},
  'KEMA ö 2600×800':       {L:2600, D:800, H:900, ohF:300},
  'Kompakt 1800×650':      {L:1800, D:650, H:900, ohF:200},
  'Lång 3200×800':         {L:3200, D:800, H:900, ohF:300},
};
// TP1-profil (Hugos ritning): x längs väggen, z utåt; baksida z=0, spets z=22
const TP1 = [[9,0],[45,0],[45,8],[34,8],[34,16],[17,22],[0,16],[0,8],[9,8]];
const TP1_W = 45, TP1_COVER = 36, TP1_D = 22;

// ------------------------------------------------------------------ scen
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer(); labelR.setSize(innerWidth, innerHeight);
Object.assign(labelR.domElement.style,{position:'absolute',top:0,left:0,pointerEvents:'none'});
document.body.appendChild(labelR.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#FCC222');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.01, 100);
camera.position.set(2.2, 2.4, 4.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.35, 0.35, 0); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight('#fff8ee', '#8a7a66', 0.8));
const sun = new THREE.DirectionalLight('#fff3df', 2.2);
sun.position.set(3, 5, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-3,right:3,top:3,bottom:-3}); sun.shadow.bias=-0.0004;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(14,14), new THREE.MeshStandardMaterial({color:'#e9cf86', roughness:.95}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ------------------------------------------------------------------ material
function canvasTex(w,h,draw,rep=[1,1]){ const c=document.createElement('canvas'); c.width=w;c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(...rep); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
const rnd = (a=0,b=1)=>a+Math.random()*(b-a);
const oakTex = canvasTex(256,1024,(g,w,h)=>{ g.fillStyle='#b98448'; g.fillRect(0,0,w,h);
  for(let i=0;i<260;i++){ const x=rnd(0,w); g.strokeStyle=`rgba(${rnd(90,140)|0},${rnd(55,80)|0},${rnd(25,40)|0},${rnd(.08,.3)})`; g.lineWidth=rnd(.5,2.5);
    g.beginPath(); g.moveTo(x,0); for(let y=0;y<=h;y+=32) g.lineTo(x+Math.sin(y*.01+i)*rnd(1,4),y); g.stroke(); }
  for(let i=0;i<40;i++){ g.fillStyle=`rgba(230,190,130,${rnd(.05,.15)})`; g.fillRect(rnd(0,w),rnd(0,h),rnd(2,6),rnd(20,120)); }
},[1/120,1/900]);
const cortenTex = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#8a4524'; g.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){ const r=rnd(.5,5); g.fillStyle=`rgba(${rnd(90,190)|0},${rnd(40,85)|0},${rnd(15,35)|0},${rnd(.1,.4)})`; g.beginPath(); g.arc(rnd(0,w),rnd(0,h),r,0,7); g.fill(); }
},[2,2]);
const M = {
  oak:   new THREE.MeshStandardMaterial({map:oakTex, roughness:.75, color:'#ffffff'}),
  oakEnd:new THREE.MeshStandardMaterial({color:'#9c6a36', roughness:.8}),
  steel: new THREE.MeshStandardMaterial({color:'#d4d8dc', metalness:.85, roughness:.28}),
  brushed:new THREE.MeshStandardMaterial({color:'#c4c8cc', metalness:.75, roughness:.42}),
  corten:new THREE.MeshStandardMaterial({map:cortenTex, roughness:.9, metalness:.15}),
  iron:  new THREE.MeshStandardMaterial({color:'#262424', roughness:.6, metalness:.5}),
  screw: new THREE.MeshStandardMaterial({color:'#e9ecef', metalness:.9, roughness:.2}),
  hat:   new THREE.MeshStandardMaterial({color:'#b9bec3', metalness:.6, roughness:.5}),
  ghost: new THREE.MeshStandardMaterial({color:'#9aa', transparent:true, opacity:.12, depthWrite:false}),
};
const frameMat = () => P.stommeMat==='corten' ? M.corten : M.brushed;

// ------------------------------------------------------------------ hjälpfunktioner (allt i mm, root skalas 0.001)
const root = new THREE.Group(); root.scale.setScalar(0.001); scene.add(root);
let G, BOM;
function add(mesh, grp=G){ mesh.castShadow = mesh.receiveShadow = true; grp.add(mesh); return mesh; }
function box(x0,x1,y0,y1,z0,z1,mat,grp=G){ const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0)),mat);
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); return add(m,grp); }
// bockad C-profil a×b×t, extruderad längs w; öppningen åt u
const V = (x,y,z)=>new THREE.Vector3(x,y,z);
function cProfile(p0, w, len, u, kind, grp){
  const a=P.pa, b=P.pb, t=P.pt, s=new THREE.Shape();
  [[0,0],[b,0],[b,t],[t,t],[t,a-t],[b,a-t],[b,a],[0,a]].forEach(([x,y],i)=> i? s.lineTo(x-b/2,y-a/2) : s.moveTo(x-b/2,y-a/2));
  const geo = new THREE.ExtrudeGeometry(s,{depth:len, bevelEnabled:false});
  const v = new THREE.Vector3().crossVectors(w,u).normalize();
  const m = new THREE.Mesh(geo, frameMat());
  m.matrixAutoUpdate=false; m.matrix.makeBasis(u,v,w).setPosition(p0); add(m, grp);
  BOM.prof.push({kind, len:Math.round(len)}); return m;
}
const screws = [];
function screw(x,y,z,n){ screws.push([x,y,z,n]); }
function label(text,x,y,z,cls=''){ const d=document.createElement('div'); d.className='lbl '+cls; d.textContent=text;
  const o=new CSS2DObject(d); o.position.set(x,y,z); G.add(o); return o; }

// ------------------------------------------------------------------ bygg
function build(){
  if(G){ root.remove(G); G.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.element) o.element.remove(); }); }
  G = new THREE.Group(); root.add(G); screws.length=0;
  BOM = {prof:[], hat:[], ribbor:[], luckor:[], warn:[]};
  const {L,D,H,kant,plat,pa,pb} = P;
  const panB = P.panB && !P.luckor;                // luckor ersätter ek på kocksidan
  // i liv-läge: inget överhäng på panelklädda sidor – panelens framsida = bänkskivans kantplan
  const ohF = (P.liv&&P.panF)?0:P.ohF, ohS = (P.liv&&P.panS)?0:P.ohS, ohB = (P.liv&&(panB||P.luckor))?0:P.ohB;
  const pan = TP1_D + P.hat;                       // panel + regel
  // ytterytor
  const zPf = D/2-ohF, zPb = -D/2+ohB, xPs = L/2-ohS;            // panelens utsida
  const zf = zPf-(P.panF?pan:0), zb = zPb+(P.luckor ? P.luckDj+3 : panB?pan:0), Xf = xPs-(P.panS?pan:0); // stommens utsida
  const yTop = H-plat, yBot = P.feet;
  if (zf-zb < 250) BOM.warn.push('Stommen blir väldigt grund – minska överhänget.');

  // --- wok-urtag (öppet mot kocksidan) -------------------------------------
  const W = P.wok ? (()=>{
    let x1 = P.wokX-P.wokW/2, x2 = P.wokX+P.wokW/2;
    const lim = Xf-pb-20; if (x2>lim){x1-=x2-lim;x2=lim;} if (x1<-lim){x2+=-lim-x1;x1=-lim;}
    const zN = Math.min(-D/2+P.wokDj, zf-pb-20);
    return {x1,x2,zN,yF:H-P.wokSank};
  })() : null;

  // --- stomme: stolpar ------------------------------------------------------
  const nSpan = Math.max(1, Math.ceil((2*Xf)/P.cc));
  const xs = [...Array(nSpan+1)].map((_,i)=>-Xf+pb/2+i*(2*Xf-pb)/nSpan);
  let xsB = xs.slice();
  if (W){ xsB = xs.filter(x=>x<W.x1-pb*1.5||x>W.x2+pb*1.5); xsB.push(W.x1-pb/2-2, W.x2+pb/2+2); xsB.sort((a,b)=>a-b);
          xsB = xsB.filter((x,i)=>i===0||x-xsB[i-1]>pb*2); }
  const postLen = yTop-yBot;
  const fg = new THREE.Group(); G.add(fg); fg.name='stomme';
  for (const x of xs)  cProfile(V(x,yBot,zf-pa/2), V(0,1,0), postLen, V(0,0,-1), 'Stolpe', fg);
  for (const x of xsB) cProfile(V(x,yBot,zb+pa/2), V(0,1,0), postLen, V(0,0, 1), 'Stolpe', fg);
  // fötter
  for (const [x,z] of [...xs.map(x=>[x,zf-pa/2]), ...xsB.map(x=>[x,zb+pa/2])]){
    const f=new THREE.Mesh(new THREE.CylinderGeometry(14,18,yBot,16), M.iron); f.position.set(x,yBot/2,z); add(f,fg); }
  // långreglar (topp + botten) mellan stolparna, liv mot utsidan
  const zRF = zf - pa/2, zRB = zb + pa/2;
  const spans = (arr)=> arr.slice(1).map((x,i)=>[arr[i]+pb/2, x-pb/2]);
  for (const [y,op] of [[yTop-pa/2,V(0,0,-1)],[yBot+pa/2,V(0,0,-1)]])
    for (const [a,b] of spans(xs)) { cProfile(V(a,y,zRF), V(1,0,0), b-a, op,'Långregel',fg); screw(a,y,zf,2); screw(b,y,zf,2); }
  for (const [y,op,isTop] of [[yTop-pa/2,V(0,0,1),1],[yBot+pa/2,V(0,0,1),0]])
    for (const [a,b] of spans(xsB)) {
      if (isTop && W && a>=W.x1-pb*2 && b<=W.x2+pb*2) continue;          // ingen toppregel i wokurtaget
      cProfile(V(a,y,zRB), V(1,0,0), b-a, op,'Långregel',fg); screw(a,y,zb,2); screw(b,y,zb,2); }
  // tvärreglar vid varje stolppar (gavlar + mellan), topp & botten
  const crossXs = [...new Set([...xs, ...(W?[W.x1-pb/2-2, W.x2+pb/2+2]:[])].map(x=>Math.round(x)))].sort((a,b)=>a-b);
  for (const x of crossXs) for (const [y,top] of [[yTop-pb/2,1],[yBot+pb/2,0]]){
    const inWok = top && W && x>=W.x1-pb*2 && x<=W.x2+pb*2;   // ingen tvärregel genom wokurtaget
    const z0 = inWok ? W.zN+pb : zb+pa, z1 = zf-pa;
    if (z1-z0 < 40) continue;
    cProfile(V(x,y,z0), V(0,0,1), z1-z0, top?V(0,-1,0):V(0,1,0), 'Tvärregel', fg);
    screw(x,y,z0,2); screw(x,y,z1,2);
  }
  // wok: bärreglar under urtagets botten
  if (W){
    const y = W.yF - plat - pb/2;
    cProfile(V(W.x1-2,y,zb+pa), V(0,0,1), (W.zN+pa)-(zb+pa), V(1,0,0), 'Wokregel', fg);
    cProfile(V(W.x2+2,y,zb+pa), V(0,0,1), (W.zN+pa)-(zb+pa), V(-1,0,0), 'Wokregel', fg);
    cProfile(V(W.x1,y,W.zN+pb/2), V(1,0,0), W.x2-W.x1, V(0,0,-1), 'Wokregel', fg);
    screw(W.x1,y,zb,4); screw(W.x2,y,zb,4);
  }
  // konsoler för överhäng (bar-sida)
  if (ohF > 120){
    for (const x of xs){ const z0=zf, z1=D/2-kant-10; if(z1-z0<40) continue;
      cProfile(V(x,yTop-pb/2,z0), V(0,0,1), z1-z0, V(0,-1,0), 'Konsol', fg); screw(x,yTop-pb/2,zf,2); }
    if (ohF > 350) BOM.warn.push('Överhäng > 350 mm: räkna på konsolerna / benstöd.');
  }
  // hyllor (kocksidan öppen)
  if (P.hylla){
    const sx0=-Xf+pb, sx1=Xf-pb, sz0=zb+pa, sz1=zf-pa;
    box(sx0,sx1,yBot+pa,yBot+pa+3,sz0,sz1, frameMat(), fg);
    const hy = Math.min(P.hyllaH, (W? W.yF-260 : yTop-200));
    if (hy > yBot+pa+150){
      const segs = W ? [[sx0, W.x1-pb], [W.x2+pb, sx1]] : [[sx0,sx1]];
      if (W && hy < W.yF-260+1) segs.splice(0,2,[sx0,sx1]);
      for (const [a,b] of segs) box(a,b,hy,hy+3,sz0,sz1, frameMat(), fg);
      label(`hylla ${Math.round(hy)}`, sx0+80, hy+20, sz0);
    }
  }

  // --- hattprofiler (reglar för ek) -----------------------------------------
  const pg = new THREE.Group(); G.add(pg); pg.name='panel';
  const panelY0 = P.golvluft, panelY1 = P.liv ? H - kant - 2 : H - plat - 1;   // liv: panelen stannar 2 mm under kanten
  const hatYs = (()=>{ const a=yBot+40, b=yTop-60, n=Math.max(1,Math.ceil((b-a)/P.hatMax)); return [...Array(n+1)].map((_,i)=>a+i*(b-a)/n); })();
  const hatRun = (x0,z0,x1,z1,nx,nz)=>{ for (const y of hatYs){
      const len=Math.hypot(x1-x0,z1-z0);
      box(Math.min(x0,x1+nx*P.hat), Math.max(x0,x1+nx*P.hat), y-25, y+25, Math.min(z0,z1+nz*P.hat), Math.max(z0,z1+nz*P.hat), M.hat, pg);
      BOM.hat.push(Math.round(len)); } };
  if (P.panF) hatRun(-Xf, zf, Xf, zf, 0, 1);
  if (panB) hatRun(-Xf, zb, Xf, zb, 0, -1);
  if (P.panS){ hatRun(Xf, zb, Xf, zf, 1, 0); hatRun(-Xf, zb, -Xf, zf, -1, 0); }

  // --- ekpanel TP1 -------------------------------------------------------------
  const sh = new THREE.Shape(); TP1.forEach(([x,z],i)=> i? sh.lineTo(x,z) : sh.moveTo(x,z));
  const ph = panelY1-panelY0;
  const bGeo = new THREE.ExtrudeGeometry(sh,{depth:ph, bevelEnabled:false}); bGeo.rotateX(Math.PI/2); bGeo.translate(0,ph,0);
  const wall = (name, x0, z0, rotY, run)=>{
    const g = new THREE.Group(); g.position.set(x0, panelY0, z0); g.rotation.y = rotY; pg.add(g);
    const n = Math.ceil((run-(TP1_W-TP1_COVER))/TP1_COVER);
    for (let i=0;i<n;i++){
      const m = new THREE.Mesh(bGeo, [M.oakEnd, M.oak]); m.position.x = i*TP1_COVER;
      const rem = run - i*TP1_COVER;
      if (rem < TP1_W) m.scale.x = rem/TP1_W;   // sista ribban klyvs
      add(m, g);
    }
    const lastW = Math.round(run-(n-1)*TP1_COVER);
    BOM.ribbor.push({name, n, len:Math.round(ph), run:Math.round(run), lastW});
    for (const y of hatYs) screws.push(['rib', n*2]);          // 2 skruv/ribba/regel (dold, bakifrån)
  };
  const endFront = P.panF ? zPf-TP1_D : zf, endBack = panB ? zPb+TP1_D : P.luckor ? zPb : zb;   // med luckor: eken viker runt till kocksidans kant
  if (P.panF) wall('Gästsida', -xPs, zPf-TP1_D, 0, 2*xPs);
  if (panB) wall('Kocksida', xPs, zPb+TP1_D, Math.PI, 2*xPs);
  if (P.panS){
    wall('Gavel höger',  xPs-TP1_D, endFront,  Math.PI/2, endFront-endBack);
    wall('Gavel vänster', -(xPs-TP1_D), endBack, -Math.PI/2, endFront-endBack);
  }

  // --- rostfria luckor, kocksidan (i liv med bänkskivans kant) --------------
  const dg = new THREE.Group(); G.add(dg); dg.name='luckor';
  if (P.luckor){
    const gap = 3, zF = zPb, dt = P.luckDj;            // luckans framsida = kantplanet
    const xD = P.panS ? xPs - TP1_D : xPs;               // luckorna fyller mellan ekgavlarna
    const y0 = P.golvluft, yT = H - kant - gap;
    let zones = [[-xD, xD, yT]];
    if (W) zones = [[-xD, W.x1, yT], [W.x1, W.x2, W.yF - kant - gap], [W.x2, xD, yT]];
    zones = zones.filter(([a,b])=>b-a > 5);
    const angle = P.luckOppen*Math.PI/180;
    for (const [a,b,top] of zones){
      const w = b-a, h = top-y0;
      if (w < 150){                                       // för smalt för lucka → fast passbit
        box(a+gap/2, b-gap/2, y0, top, zF, zF+dt, M.brushed, dg);
        BOM.luckor.push({w:Math.round(w-gap), h:Math.round(h), fast:true}); continue; }
      const n = Math.ceil(w / P.luckMax), dw = w/n;
      for (let i=0;i<n;i++){
        const x0 = a+i*dw+gap/2, x1 = a+(i+1)*dw-gap/2, ww = x1-x0;
        const leftHinge = n===1 ? (a+b)/2 < 0 : i < n/2;
        const piv = new THREE.Group(); piv.position.set(leftHinge? x0 : x1, 0, zF); piv.rotation.y = leftHinge? angle : -angle; dg.add(piv);
        const sx = leftHinge? 0 : -ww;
        box(sx, sx+ww, y0, top, 0, dt, M.brushed, piv);                       // bockad lucka
        box(sx+6, sx+ww-6, top-14, top-4, -1, 0.5, M.iron, piv);             // bockat grepp i överkant
        BOM.luckor.push({w:Math.round(ww), h:Math.round(h), gang: h>900?3:2});
      }
    }
    if (P.mått) label(`rostfria luckor ${BOM.luckor.filter(l=>!l.fast).length} st`, 0, H/2, zF-30, 'red');
  }

  // --- bänkskiva (rostfri, nedvikt kant) ------------------------------------
  const tg = new THREE.Group(); G.add(tg); tg.name='topp';
  const poly = W ? [[-L/2,-D/2],[W.x1,-D/2],[W.x1,W.zN],[W.x2,W.zN],[W.x2,-D/2],[L/2,-D/2],[L/2,D/2],[-L/2,D/2]]
                 : [[-L/2,-D/2],[L/2,-D/2],[L/2,D/2],[-L/2,D/2]];
  const ts = new THREE.Shape(); poly.forEach(([x,z],i)=> i? ts.lineTo(x,-z) : ts.moveTo(x,-z));
  const tGeo = new THREE.ExtrudeGeometry(ts,{depth:plat, bevelEnabled:false}); tGeo.rotateX(-Math.PI/2); tGeo.translate(0,H-plat,0);
  add(new THREE.Mesh(tGeo, M.steel), tg);
  const t2 = plat;
  // kanter
  box(-L/2, L/2, H-kant, H, D/2-t2, D/2, M.steel, tg);
  box(L/2-t2, L/2, H-kant, H, -D/2, D/2, M.steel, tg);
  box(-L/2, -L/2+t2, H-kant, H, -D/2, D/2, M.steel, tg);
  if (W){ box(-L/2, W.x1, H-kant, H, -D/2, -D/2+t2, M.steel, tg); box(W.x2, L/2, H-kant, H, -D/2, -D/2+t2, M.steel, tg);
    // urtagets väggar + botten med brännarhål + framkant
    box(W.x1, W.x1+t2, W.yF, H, -D/2, W.zN, M.steel, tg);
    box(W.x2-t2, W.x2, W.yF, H, -D/2, W.zN, M.steel, tg);
    box(W.x1, W.x2, W.yF, H, W.zN-t2, W.zN, M.steel, tg);
    const fs = new THREE.Shape(); [[W.x1,-D/2],[W.x2,-D/2],[W.x2,W.zN],[W.x1,W.zN]].forEach(([x,z],i)=> i? fs.lineTo(x,-z):fs.moveTo(x,-z));
    const cx=(W.x1+W.x2)/2, cz=(W.zN-D/2)/2+ -0, r=P.brannare/2*0.75;
    const hole=new THREE.Path(); hole.absarc(cx,-(-D/2+W.zN)/2,r,0,Math.PI*2,true); fs.holes.push(hole);
    const fGeo=new THREE.ExtrudeGeometry(fs,{depth:t2,bevelEnabled:false}); fGeo.rotateX(-Math.PI/2); fGeo.translate(0,W.yF-t2,0);
    add(new THREE.Mesh(fGeo, M.steel), tg);
    box(W.x1, W.x2, W.yF-kant, W.yF, -D/2, -D/2+t2, M.steel, tg);
    // wokbrännare + galler
    const bz = (-D/2+W.zN)/2;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(P.brannare/2, 9, 10, 48), M.iron); ring.rotation.x=Math.PI/2; ring.position.set(cx, W.yF+40, bz); add(ring,tg);
    const bur = new THREE.Mesh(new THREE.CylinderGeometry(r*0.55, r*0.7, 60, 32), M.iron); bur.position.set(cx, W.yF-10, bz); add(bur,tg);
    for (let k=0;k<4;k++){ const a=k*Math.PI/2+Math.PI/4, rr=P.brannare/2;
      const arm = new THREE.Mesh(new THREE.BoxGeometry(rr*0.75, 14, 10), M.iron);
      arm.position.set(cx+Math.cos(a)*rr*0.62, W.yF+48, bz+Math.sin(a)*rr*0.62); arm.rotation.y=-a; add(arm,tg);
      const leg = new THREE.Mesh(new THREE.BoxGeometry(10, 45, 10), M.iron); leg.position.set(cx+Math.cos(a)*rr, W.yF+22, bz+Math.sin(a)*rr); add(leg,tg); }
    label(`wok ${Math.round(W.x2-W.x1)}×${Math.round(W.zN+D/2)}, −${P.wokSank}`, cx, H+60, bz, 'red');
  } else box(-L/2, L/2, H-kant, H, -D/2, -D/2+t2, M.steel, tg);

  // --- skruvar (yamay-infästning, synliga på stommen) -----------------------
  const sg = new THREE.Group(); G.add(sg); sg.name='skruv';
  let nFrameScrews = 0, nRib = 0;
  const sGeo = new THREE.CylinderGeometry(6.5,6.5,4,16);
  for (const s of screws){
    if (s[0]==='rib'){ nRib += s[1]; continue; }
    const [x,y,z,n]=s; nFrameScrews += n;
    const m=new THREE.Mesh(sGeo, M.screw); m.rotation.x=Math.PI/2; m.position.set(x, y, z+Math.sign(z)*2); add(m, sg);
  }

  // --- måttlinjer -------------------------------------------------------------
  if (P.mått){
    label(`L ${L}`, 0, H+90, D/2);
    label(`D ${D}`, L/2+60, H+60, 0);
    label(`H ${H}`, L/2+40, H/2, D/2);
    if (ohF>30) label(`överhäng ${ohF}`, -L/2+250, H-120, D/2-ohF/2, 'red');
    if (P.liv) label(`ek i liv med kant · regel ${P.hat}`, -L/2+300, H-kant-60, D/2, 'red');
    label('gästsida (ek)', 0, H/2, D/2-ohF+40);
    if (!panB && !P.luckor) label('kocksida (öppen)', 0, H/2+150, -D/2);
  }

  // synlighet
  pg.visible = P.visaPanel; tg.visible = P.visaTopp; fg.visible = P.visaStomme; sg.visible = P.visaSkruv && P.visaStomme; dg.visible = P.visaLuckor;
  if (P.snitt){ pg.children.forEach(c=>{ if(c.rotation.y===0) c.visible=false; }); }

  // --- info / kapplista -----------------------------------------------------------
  const lm = a=>a.reduce((s,v)=>s+v,0)/1000;
  const profLen = lm(BOM.prof.map(p=>p.len));
  const ribLm = BOM.ribbor.reduce((s,r)=>s+r.n*r.len,0)/1000;
  const nRibTot = BOM.ribbor.reduce((s,r)=>s+r.n,0);
  const devL = L+2*kant, devD = D+2*kant + (W? 0:0);
  const kgProf = profLen * ((P.pa+2*P.pb-2*P.pt)*P.pt*7.85e-3);
  const kgTop = (devL*devD*P.plat*7.95e-6) + (W? (W.x2-W.x1+2*(W.zN+D/2))*P.wokSank*P.plat*7.95e-6 : 0);
  const lgrp = {}; BOM.luckor.forEach(l=>{ const k=`${l.w} × ${l.h}${l.fast?' (fast passbit)':''}`; lgrp[k]=(lgrp[k]||0)+1; });
  const nLuck = BOM.luckor.filter(l=>!l.fast).length, nGang = BOM.luckor.reduce((s,l)=>s+(l.gang||0),0);
  if (P.plat >= 5) BOM.warn.push(`${P.plat} mm topp: kanten kantpressas med stor radie (min fläns ≈ 6×t = ${6*P.plat} mm), wok-urtaget svetsas som låda.`);
  window.__BOM = {BOM, profLen, ribLm, nRibTot, nFrameScrews, nRib, W, devL, devD, lgrp, nGang};
  document.getElementById('info').innerHTML = `
    <span class="tgl">▴</span><h1>ヤマイ Yamay utekök</h1>
    <table>
    <tr><td>Bänkskiva (rostfri ${P.plat} mm)</td><td>${L} × ${D} × ${H}</td></tr>
    <tr><td>&nbsp;utvikt plåt</td><td>${devL} × ${devD}</td></tr>
    <tr><td>Stomme (${P.stommeMat}) C ${P.pa}×${P.pb}×${P.pt}</td><td>${(2*Xf).toFixed(0)} × ${(zf-zb).toFixed(0)}</td></tr>
    <tr><td>&nbsp;profiler</td><td>${BOM.prof.length} st · ${profLen.toFixed(1)} lm · ~${kgProf.toFixed(0)} kg</td></tr>
    <tr><td>&nbsp;stolpar c/c</td><td>${((2*Xf-pb)/nSpan).toFixed(0)} (${xs.length} fram, ${xsB.length} bak)</td></tr>
    <tr><td>&nbsp;yamay-skruv i stommen</td><td>${nFrameScrews} st</td></tr>
    <tr><td>Hattregel ${P.hat} mm djup</td><td>${lm(BOM.hat).toFixed(1)} lm (${hatYs.length} rader)</td></tr>
    <tr><td>Ek TP1 45×22 (täck 36)</td><td>${nRibTot} st · ${ribLm.toFixed(1)} lm</td></tr>
    ${BOM.ribbor.map(r=>`<tr><td>&nbsp;${r.name}</td><td>${r.n} × ${r.len} (sista ${r.lastW})</td></tr>`).join('')}
    <tr><td>&nbsp;dold skruv, bakifrån</td><td>${nRib} st</td></tr>
    ${W?`<tr><td>Wok-urtag</td><td>${Math.round(W.x2-W.x1)} × ${Math.round(W.zN+D/2)}, −${P.wokSank}</td></tr>`:''}
    ${P.luckor?`<tr><td>Rostfria luckor (${P.luckDj} mm bockade)</td><td>${nLuck} st · ${nGang} gångjärn</td></tr>
    ${Object.entries(lgrp).map(([k,n])=>`<tr><td>&nbsp;${n} ×</td><td>${k}</td></tr>`).join('')}`:''}
    <tr><td>Topp inkl. urtag</td><td>~${kgTop.toFixed(0)} kg</td></tr>
    </table>
    ${BOM.warn.map(w=>`<div class="warn">⚠ ${w}</div>`).join('')}
    <div class="sub">Grundmått från KEMA 50595 (2500×650×900). TP1-profil från Hugos ritning. Profil-, skruv- och wokmått är
    uppskattningar – inte bygghandling. ${P.liv?`Ekpanelen ligger i liv med bänkskivans kant (stommen + ${P.hat} mm regel + 22 mm ek = kantplanet), 2 mm skuggfog under kanten.`:'Ekribborna går upp bakom bänkskivans nedvikta kant, så ändträt döljs.'}</div>`;
}

// ------------------------------------------------------------------ GUI
let needsBuild = true; const rb = ()=>needsBuild=true;
const gui = new GUI({title:'Yamay utekök'});
const fP = gui.addFolder('Förinställning');
const pre = {val:'KEMA 2500×650 (50595)'};
fP.add(pre,'val',Object.keys(PRESETS)).name('modell').onChange(k=>{ Object.assign(P,PRESETS[k]); gui.controllersRecursive().forEach(c=>c.updateDisplay()); rb(); });
const fM = gui.addFolder('Mått (mm)');
fM.add(P,'L',1200,4000,10).name('längd').onChange(rb);
fM.add(P,'D',500,1100,10).name('djup').onChange(rb);
fM.add(P,'H',800,1100,5).name('höjd inkl. topp').onChange(rb);
fM.add(P,'liv').name('ek i liv med bänkskiva').onChange(rb);
fM.add(P,'hat',15,120,1).name('regeldjup (liv)').onChange(rb);
fM.add(P,'ohF',20,450,5).name('överhäng gästsida').onChange(rb);
fM.add(P,'ohS',10,150,5).name('överhäng gavlar').onChange(rb);
fM.add(P,'ohB',10,100,5).name('överhäng kocksida').onChange(rb);
fM.add(P,'kant',20,80,1).name('nedvikt kant').onChange(rb);
fM.add(P,'plat',1.5,8,0.5).name('topp godstjocklek').onChange(rb);
const fS = gui.addFolder('Stomme (bockad)');
fS.add(P,'stommeMat',['corten','rostfri']).name('material').onChange(rb);
fS.add(P,'pa',40,100,5).name('profil liv a').onChange(rb);
fS.add(P,'pb',25,60,5).name('profil fläns b').onChange(rb);
fS.add(P,'pt',1.5,4,0.5).name('godstjocklek').onChange(rb);
fS.add(P,'cc',500,1200,10).name('max c/c stolpar').onChange(rb);
fS.add(P,'hatMax',300,700,10).name('max c/c hattregel').onChange(rb);
const fW = gui.addFolder('Wok-nedsänkning');
fW.add(P,'wok').name('på').onChange(rb);
fW.add(P,'wokX',-1200,1200,10).name('läge (x från mitt)').onChange(rb);
fW.add(P,'wokW',400,1000,10).name('bredd').onChange(rb);
fW.add(P,'wokDj',300,700,10).name('djup in i bänken').onChange(rb);
fW.add(P,'wokSank',60,300,5).name('nedsänkning').onChange(rb);
fW.add(P,'brannare',200,450,10).name('brännare Ø').onChange(rb);
const fI = gui.addFolder('Panel & inredning');
fI.add(P,'panF').name('ek gästsida').onChange(rb);
fI.add(P,'panS').name('ek gavlar').onChange(rb);
fI.add(P,'panB').name('ek kocksida').onChange(rb);
fI.add(P,'golvluft',0,60,1).name('golvluft').onChange(rb);
fI.add(P,'hylla').name('hyllor').onChange(rb);
fI.add(P,'hyllaH',150,600,10).name('hyllhöjd').onChange(rb);
const fL = gui.addFolder('Rostfria luckor (kocksida)');
fL.add(P,'luckor').name('på').onChange(rb);
fL.add(P,'luckMax',350,800,10).name('max luckbredd').onChange(rb);
fL.add(P,'luckDj',15,40,1).name('luckdjup (bockad)').onChange(rb);
fL.add(P,'luckOppen',0,110,1).name('öppna luckor °').onChange(rb);
const fV = gui.addFolder('Visa');
for (const [k,n] of [['visaTopp','bänkskiva'],['visaPanel','ekpanel'],['visaLuckor','luckor'],['visaStomme','stomme'],['visaSkruv','skruvar'],['mått','mått'],['snitt','snitt (dölj gästpanel)']])
  fV.add(P,k).name(n).onChange(rb);
const views = {
  'Gästsida':  ()=>{camera.position.set(2.2,2.4,4.6); controls.target.set(-0.35,.35,0);},
  'Kocksida':  ()=>{camera.position.set(-1.6,1.9,-2.6); controls.target.set(0,.6,0);},
  'Wok närbild':()=>{const x=(P.wokX)/1000; camera.position.set(x+.25,1.55,-1.25); controls.target.set(x,.75,-.15);},
  'Ovanifrån': ()=>{camera.position.set(0,4.2,0.01); controls.target.set(0,0,0);},
  'Gavel':     ()=>{camera.position.set(3.2,.8,0); controls.target.set(0,.45,0);},
  'Hörn (ek)': ()=>{camera.position.set(1.65,.75,.95); controls.target.set(1.2,.45,.05);},
};
const fC = gui.addFolder('Kameravyer'); for (const k in views) fC.add(views,k);
const ex = {
  'PNG': ()=>{ renderer.render(scene,camera); const a=document.createElement('a'); a.href=renderer.domElement.toDataURL('image/png'); a.download='yamay_utekok.png'; a.click(); },
  'GLB': ()=>{ new GLTFExporter().parse(root, g=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([g],{type:'model/gltf-binary'})); a.download='yamay_utekok.glb'; a.click(); }, e=>console.error(e), {binary:true}); },
  'Kapplista (csv)': ()=>{ const B=window.__BOM; const rows=[['del','antal','längd mm']];
    const grp={}; B.BOM.prof.forEach(p=>{const k=p.kind+'|'+p.len; grp[k]=(grp[k]||0)+1;});
    Object.entries(grp).sort().forEach(([k,n])=>{const [a,b]=k.split('|'); rows.push([`C-profil ${P.pa}x${P.pb}x${P.pt} – ${a}`,n,b]);});
    B.BOM.ribbor.forEach(r=>rows.push([`Ek TP1 – ${r.name} (sista klyvs till ${r.lastW})`,r.n,r.len]));
    rows.push(['Rostfri topp utvikt',1,`${B.devL}x${B.devD}`]); rows.push(['Yamay-skruv stomme',B.nFrameScrews,'']); rows.push(['Dold skruv ek',B.nRib,'']);
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(';')).join('\n')],{type:'text/csv'})); a.download='yamay_utekok_kapplista.csv'; a.click(); },
};
const fE = gui.addFolder('Export'); for (const k in ex) fE.add(ex,k);
[fS,fW,fI,fL,fV,fC,fE].forEach(f=>f.close());

window.__three = {THREE, scene, renderer, camera, controls, root, ground}; if(matchMedia('(max-width:700px)').matches) gui.close();
document.getElementById('info').addEventListener('click',e=>e.currentTarget.classList.toggle('open'));
window.__P = P; window.__rebuild = ()=>{ build(); needsBuild=false; }; window.__views = views;
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labelR.setSize(innerWidth,innerHeight); });
(function loop(){ requestAnimationFrame(loop); if(needsBuild){ build(); needsBuild=false; } controls.update(); renderer.render(scene,camera); labelR.render(scene,camera); })();
</script>
</body>
