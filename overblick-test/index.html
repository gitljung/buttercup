    let t = Math.min(1, (now - t0) / ms); t = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    cur = {kat: mix(fran.kat, mal.kat, t), prj: mix(fran.prj, mal.prj, t), dots: mix(fran.dots, mal.dots, t), mod: mix(fran.mod, mal.mod, t)};
    rita(cur); if (t < 1) requestAnimationFrame(steg);
  })(t0);
  setTimeout(() => { cur = JSON.parse(JSON.stringify(mal)); rita(cur); }, ms + 80);   // om fliken inte ritar (bakgrund)
}
function cnt(ds) { const c = {r: 0, o: 0, g: 0, a: 0, k: 0}; ds.forEach(d => c[d.f]++); return c; }
function iKat(k) { return D.dots.map((d, i) => i).filter(i => D.prj[D.dots[i].p].kat === k); }
function omfang() { return S.fok != null ? D.dots.map((d, i) => i).filter(i => D.dots[i].p === S.fok) : iKat(S.z); }
function valbar(i) { return 'rog'.includes(D.dots[i].f); }

function zoom(k) { if (S.z === k) return; S.z = k; S.fok = null; S.sel.clear(); S.kvitto = null; flytta(480); ui(); hash(); }
function klickPrj(i, ev) {
  const p = D.prj[i];
  if (S.z !== p.kat) return zoom(p.kat);
  S.fok = S.fok === i ? null : i; S.kvitto = null; stil(); ui();
}
function klickDot(i, ev) {
  const d = D.dots[i], p = D.prj[d.p];
  if (S.z !== p.kat) return zoom(p.kat);
  if (!valbar(i)) return tip(i, ev, true);
  S.sel.has(i) ? S.sel.delete(i) : S.sel.add(i); S.kvitto = null; stil(); ui(); hash();
}
function farg(f) {
  const alla = omfang().filter(i => D.dots[i].f === f);
  if (!alla.length) return;
  const allaValda = alla.every(i => S.sel.has(i));
  alla.forEach(i => allaValda ? S.sel.delete(i) : S.sel.add(i)); S.kvitto = null; stil(); ui(); hash();
}
function rensa() { S.sel.clear(); S.kvitto = null; stil(); ui(); hash(); }
function tip(i, ev, tvinga) {
  const d = D.dots[i], t = $('#tt');
  t.innerHTML = `<b>${esc(d.nr)} · ${esc(D.prj[d.p].namn)}</b>${esc(d.t)}<br><span style="opacity:.7">${{r: 'Akut', o: 'Bör åtgärdas', g: 'Kan vänta', a: 'Agent arbetar', k: 'Avklarat'}[d.f]}${d.vem ? ' · ' + esc(d.vem) : ''}</span>`;
  t.style.display = 'block'; t.style.left = Math.min(ev.clientX + 14, innerWidth - 285) + 'px'; t.style.top = (ev.clientY + 14) + 'px';
  if (tvinga) setTimeout(() => t.style.display = 'none', 2500);
}
const VAL = [['🧐', 'Fable går igenom alla och föreslår svar', 'Du godkänner eller ändrar ett förslag i taget. Fable ser först om några hör ihop.'],
  ['🤖', 'Ge alla till Vickan att åtgärda', 'Blir kort med Vickan som ägare. Det som kräver Fusion köas och körs ett i taget.'],
  ['🙋', 'Jag svarar själv', 'Korten visas ett i taget med sina alternativ.'],
  ['👤', 'Tilldela en person', 'Till exempel en team-medlem som ska prova eller mäta.'],
  ['⏸', 'Skjut upp eller markera som inaktuella', 'Försvinner ur ringen men ligger kvar i historiken.']];
const prick = (f, px) => `<i style="width:${px}px;height:${px}px;background:${F[f]};${f === 'a' ? 'border:2.5px solid ' + F.k : ''}"></i>`;
const LEG = `<h3>Så läser du prickarna</h3><div class="lg">${prick('r', 14)}<span><b>Akut</b> – A-avvikelse eller prioriterat kort som väntar på en människa</span>${prick('o', 14)}<span><b>Bör åtgärdas</b> – B</span>${prick('g', 14)}<span><b>Kan vänta</b> – C</span>${prick('a', 14)}<span><b>Agent arbetar</b> – kräver inget av dig</span>${prick('k', 14)}<span><b>Avklarat</b> – besvarat kort eller stängd avvikelse</span></div>`;
function ui() {
  const alla = cnt(D.dots);
  $('#sum').textContent = `${alla.r + alla.o + alla.g} väntar på människa · ${alla.a} hos agent · ${alla.k} avklarade`;
  const tb = $('#tb'), pn = $('#pn');
  tb.classList.toggle('on', !!S.z);
  if (!S.z) {
    pn.innerHTML = '<h2>ÖVERSIKT</h2><div class="sub">Klicka på en kategori för att zooma in.</div>' + D.kat.map(k => { const c = cnt(iKat(k.id).map(i => D.dots[i]));
      return `<div class="sm" style="border-color:${k.farg}" onclick="zoom('${k.id}')"><b style="color:${k.farg}">${esc(k.namn.toUpperCase())}</b><span>${D.prj.filter(p => p.kat === k.id).length} projekt</span><div>${prick('r', 14)}${c.r}${prick('o', 14)}${c.o}${prick('g', 14)}${c.g}${prick('a', 14)}${c.a}${prick('k', 14)}${c.k}</div></div>`; }).join('') + LEG;
    return;
  }
  const k = D.kat.find(x => x.id === S.z), om = omfang(), c = cnt(om.map(i => D.dots[i]));
  const kn = f => { const ids = om.filter(i => D.dots[i].f === f), on = ids.length && ids.every(i => S.sel.has(i));
    return `<span class="btn${on ? ' on' : ''}${ids.length ? '' : ' tom'}" onclick="farg('${f}')"><i style="background:${F[f]}"></i>${NAMN[f]} ${ids.length}${on ? ' ✓' : ''}</span>`; };
  tb.innerHTML = `<span class="btn" onclick="zoom(null)">← Översikt</span><u>MARKERA${S.fok != null ? ' I ' + esc(D.prj[S.fok].kort.toUpperCase()) : ''}</u>${kn('r')}${kn('o')}${kn('g')}` +
    (S.sel.size ? `<span class="btn" onclick="rensa()">avmarkera</span>` : '') + (S.fok != null ? `<span class="btn" onclick="klickPrj(${S.fok})">hela ${esc(k.namn)}</span>` : '');
  if (S.kvitto) { pn.innerHTML = S.kvitto; return; }
  if (!S.sel.size) {
    const akut = om.filter(valbar).sort((a, b) => D.dots[b].s - D.dots[a].s).slice(0, 9);
    pn.innerHTML = `<h2>${esc((S.fok != null ? D.prj[S.fok].namn : k.namn).toUpperCase())}</h2><div class="sub">${c.r + c.o + c.g} väntar på människa · ${c.a} hos agent · ${c.k} avklarade</div>` +
      `<h3>Mest akut</h3>` + (akut.length ? akut.map(i => { const d = D.dots[i], px = 12 + d.s * 2.6; return `<div class="rad" onclick="klickDot(${i},event)"><i style="width:${px}px;height:${px}px;background:${F[d.f]}"></i><div><u>${esc(d.nr)}</u> <b>${esc(D.prj[d.p].kort)}</b>${d.vem ? ' · väntar på ' + esc(d.vem) : ''}<br>${esc(d.t)}</div></div>`; }).join('') : '<div class="sub">Inget väntar på en människa här.</div>') +
      `<div class="tip"><b>Markera:</b> klicka på en färg i raden ovanför kartan, eller på enstaka prickar. <b>Klicka på en projektring</b> för att markera bara inom det projektet.</div>` + LEG;
    return;
  }
  const grp = {}; [...S.sel].sort((a, b) => D.dots[b].s - D.dots[a].s).forEach(i => (grp[D.dots[i].p] = grp[D.dots[i].p] || []).push(i));
  pn.innerHTML = `<h2>${S.sel.size} MARKERADE</h2><div class="sub">i ${Object.keys(grp).length} projekt i ${esc(k.namn)}</div>` +
    Object.entries(grp).map(([p, ids]) => `<div class="gp"><span>${esc(D.prj[p].namn)}</span><span>${ids.length}</span></div>` + ids.map(i => { const d = D.dots[i]; return `<div class="rad" onclick="klickDot(${i},event)" title="Klicka för att avmarkera"><i style="width:12px;height:12px;background:${F[d.f]};box-shadow:0 0 0 1.5px #fff,0 0 0 3px #1d1a16"></i><div><u>${esc(d.nr)}</u> ${esc(d.t)}</div></div>`; }).join('')).join('') +
    `<h3>Hur vill du angripa dem?</h3>` + VAL.map((v, i) => `<div class="op${S.val === i ? ' on' : ''}" onclick="S.val=${i};ui()"><em>${v[0]}</em><div><b>${v[1]}</b><span>${v[2]}</span></div></div>`).join('') +
    `<textarea id="ins" rows="2" placeholder="Instruktion till alla (valfritt)"></textarea><div style="margin-top:10px;display:flex;gap:8px"><span class="btn p" onclick="starta()">▶ Starta</span><span class="btn k" onclick="rensa()">Avbryt</span></div>`;
}
function starta() {
  const n = S.sel.size, ins = ($('#ins').value || '').trim();
  S.kvitto = `<h2>TESTSIDA</h2><div class="kvitto"><b>Inget startades.</b> Det här är en testsida med en fryst kopia av datan.<br><br>I den riktiga versionen hade <b>${n} kort</b> gått till:<br><b>${VAL[S.val][0]} ${esc(VAL[S.val][1])}</b>${ins ? '<br><br>Instruktion: “' + esc(ins) + '”' : ''}</div><div style="margin-top:12px;display:flex;gap:8px"><span class="btn k" onclick="S.kvitto=null;ui()">← Tillbaka till markeringen</span><span class="btn k" onclick="rensa()">Avmarkera</span></div>`;

function hash() { history.replaceState(null, '', S.z ? '#' + S.z + (S.sel.size ? ':' + [...S.sel].join(',') : '') : location.pathname); }
(function start() {
  const m = decodeURIComponent(location.hash.slice(1)).split(':');
  if (m[0] && D.lay.z[m[0]]) { S.z = m[0]; if (m[1] === 'r' || m[1] === 'o' || m[1] === 'g') iKat(S.z).filter(i => D.dots[i].f === m[1]).forEach(i => S.sel.add(i));
    else if (m[1]) m[1].split(',').map(Number).filter(i => D.dots[i] && valbar(i) && D.prj[D.dots[i].p].kat === S.z).forEach(i => S.sel.add(i)); }
  flytta(0); ui();
})();
svg.addEventListener('click', ev => { if (ev.target === svg && S.z && !S.sel.size) zoom(null); });
window.__app = {S, D, zoom, farg, klickDot, klickPrj, starta, rensa};
