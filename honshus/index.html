<body>
<div id="info">
  <h1>Hönshus · The Bearded Builder-stil</h1>
  <div id="stats"></div>
  <div class="small">Mått och planlösning från hans filmer. Detaljerna är uppskattade från bilderna.
  Exakta ritningar: stan.store/Beardedbuilder.<br>Dra för att rotera · scrolla för zoom · högerklick för att panorera.</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import GUI from 'lil-gui';

const DEG = Math.PI/180, FT = 0.3048, V3 = THREE.Vector3;

/* ---------------- Förinställningar (enligt filmerna) ---------------- */
const PRESETS = {
  'Original 8×16 ft (~50 höns)': {W:2.44,L:4.88,H:2.30,pitch:27,oh:0.25,DW:1.60,DH:1.80,doorOpen:0,SDW:0.80,sideOpen:0,win:35,F:0.55,PL:1.90,gap:0.30,nests:4,clear:3},
  'Mini 6×12 ft (~25 höns)':     {W:1.83,L:3.66,H:2.05,pitch:27,oh:0.22,DW:1.25,DH:1.65,doorOpen:0,SDW:0.70,sideOpen:0,win:35,F:0.50,PL:1.40,gap:0.30,nests:3,clear:2},
  'Mikro 5×8 ft (~15 höns)':     {W:1.52,L:2.44,H:1.85,pitch:27,oh:0.20,DW:1.05,DH:1.50,doorOpen:0,SDW:0.60,sideOpen:0,win:35,F:0.45,PL:1.00,gap:0.30,nests:2,clear:1},
};
const P = Object.assign({preset:'Original 8×16 ft (~50 höns)', winter:false, cupola:true, roof:true, cutaway:false,
                         apron:false, dims:true, evening:false}, PRESETS['Original 8×16 ft (~50 höns)']);

/* ---------------- Renderare / scen ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style,{position:'absolute',top:'0',left:'0',pointerEvents:'none'});
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe3f0');
scene.fog = new THREE.Fog('#cfe3f0', 25, 70);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 200);
camera.position.set(6.5, 3.8, 7.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI*0.495;

const hemi = new THREE.HemisphereLight('#e8f3ff', '#56643a', 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff6e6', 2.4);
sun.position.set(7, 11, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-8,right:8,top:8,bottom:-8,near:1,far:40});
sun.shadow.bias = -0.0005;
scene.add(sun);

/* ---------------- Texturer ---------------- */
function canvasTex(size, draw){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function noise(g,s,n,cols,a=1){ for(let i=0;i<n;i++){ g.globalAlpha=a*Math.random(); g.fillStyle=cols[i%cols.length];
  g.fillRect(Math.random()*s,Math.random()*s,1+Math.random()*2.5,1+Math.random()*2.5);} g.globalAlpha=1; }

const sidingTex = canvasTex(256,(g,s)=>{ g.fillStyle='#dfe9ec'; g.fillRect(0,0,s,s); noise(g,s,900,['#cfdadd','#eaf1f3'],.5);
  g.fillStyle='#edf3f4'; g.fillRect(0,0,30,s); g.fillStyle='#aebcc0'; g.fillRect(30,0,3,s); g.fillStyle='#fbfdfd'; g.fillRect(0,0,2,s); });
sidingTex.repeat.set(1/0.40, 1);           // läkt var 40:e cm (UV i meter)

const meshTex = canvasTex(64,(g,s)=>{ g.clearRect(0,0,s,s); g.strokeStyle='#ffffff'; g.lineWidth=5; g.strokeRect(0,0,s,s); });
meshTex.colorSpace = THREE.NoColorSpace;
const CELL = 0.035;

const corrTex = canvasTex(64,(g,s)=>{ for(let y=0;y<s;y++){ const v=Math.round(165+60*Math.sin(y/s*Math.PI*2)); g.fillStyle=`rgb(${v},${v+4},${v+8})`; g.fillRect(0,y,s,1);} });
const compostTex = canvasTex(256,(g,s)=>{ g.fillStyle='#6d5a43'; g.fillRect(0,0,s,s); noise(g,s,7000,['#8a7454','#4c3d2c','#a08a63','#3a2f22']); });
compostTex.repeat.set(3,3);
const shavTex = canvasTex(256,(g,s)=>{ g.fillStyle='#d9c79d'; g.fillRect(0,0,s,s); noise(g,s,6000,['#efe2bf','#bfa979','#e6d3a6']); });
shavTex.repeat.set(3,3);
const grassTex = canvasTex(256,(g,s)=>{ g.fillStyle='#6f8d45'; g.fillRect(0,0,s,s); noise(g,s,9000,['#7fa04f','#5d7a37','#8aab5a','#566f33']); });
grassTex.repeat.set(40,40);
const woodTex = canvasTex(128,(g,s)=>{ g.fillStyle='#8c857a'; g.fillRect(0,0,s,s); for(let i=0;i<40;i++){ g.globalAlpha=.25; g.fillStyle=i%2?'#6f695f':'#a59e92';
  g.fillRect(0,Math.random()*s,s,1+Math.random()*2);} g.globalAlpha=1; noise(g,s,500,['#5e584f'],.6); });

/* ---------------- Material ---------------- */
const std = (color, rough=.8, extra={}) => new THREE.MeshStandardMaterial(Object.assign({color, roughness:rough}, extra));
const M = {
  siding:  new THREE.MeshStandardMaterial({map:sidingTex, roughness:.55, metalness:.25, side:THREE.DoubleSide}),
  trim:    std('#f4f4ef',.6),
  wood:    std('#ffffff',.9,{map:woodTex}),
  plank:   std('#5d5a55',.9),
  doorFr:  std('#a39f97',.85),
  ply:     std('#c9a676',.8),
  osb:     std('#b8935f',.85),
  metal:   new THREE.MeshStandardMaterial({map:corrTex, bumpMap:corrTex, bumpScale:2, color:'#e3e8eb', metalness:.15, roughness:.45, side:THREE.DoubleSide}),
  clear:   new THREE.MeshStandardMaterial({map:corrTex, color:'#ffffff', transparent:true, opacity:.32, roughness:.15, side:THREE.DoubleSide, depthWrite:false}),
  mesh:    new THREE.MeshStandardMaterial({map:meshTex, color:'#6f7275', transparent:true, alphaTest:.3, side:THREE.DoubleSide, metalness:.5, roughness:.55}),
  apron:   new THREE.MeshStandardMaterial({map:meshTex, color:'#b02a2a', transparent:true, alphaTest:.3, side:THREE.DoubleSide}),
  glass:   std('#a9cadb',.08,{transparent:true, opacity:.4, metalness:.1}),
  black:   std('#232323',.5,{metalness:.6}),
  red:     std('#c4271f',.45),
  white:   std('#f1f1f1',.5),
  compost: std('#ffffff',1,{map:compostTex}),
  shav:    std('#ffffff',1,{map:shavTex}),
  bulb:    std('#fff1c8',.3,{emissive:'#ffd98a', emissiveIntensity:0}),
  ground:  std('#ffffff',1,{map:grassTex}),
};

/* ---------------- Mark ---------------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), M.ground);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

/* ---------------- Hjälpfunktioner ---------------- */
function box(w,h,d,mat,x,y,z,parent){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); parent.add(m); return m; }
function beam(a,b,w,h,mat,parent){ // balk mellan två punkter (lokala koordinater i parent)
  const d=new V3().subVectors(b,a), len=d.length();
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,len),mat);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new V3(0,0,1), d.normalize());
  parent.add(m); return m;
}
function frameRect(w,h,bw,d,mat){ const g=new THREE.Group();
  box(w,bw,d,mat,0,h/2-bw/2,0,g); box(w,bw,d,mat,0,-h/2+bw/2,0,g);
  box(bw,h-2*bw,d,mat,-w/2+bw/2,0,0,g); box(bw,h-2*bw,d,mat,w/2-bw/2,0,0,g); return g; }
function meshPanel(w,h,mat=M.mesh){ const g=new THREE.PlaneGeometry(w,h), uv=g.attributes.uv;
  for(let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*w/CELL, uv.getY(i)*h/CELL);
  const m=new THREE.Mesh(g,mat); m.userData.noShadow=true; return m; }
function planarUV(geo, ox, oz, su, sv){ const p=geo.attributes.position, uv=geo.attributes.uv;
  for(let i=0;i<p.count;i++) uv.setXY(i,(p.getX(i)+ox)/su,(p.getZ(i)+oz)/sv); }
function wallMesh(outline, holes, t){
  const s=new THREE.Shape(outline.map(([x,y])=>new THREE.Vector2(x,y)));
  for(const h of holes){ const p=new THREE.Path(); p.moveTo(h[0],h[1]); p.lineTo(h[2],h[1]); p.lineTo(h[2],h[3]); p.lineTo(h[0],h[3]); p.closePath(); s.holes.push(p); }
  return new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false,curveSegments:1}), M.siding);
}
function sash(w,h,cols,rows){ const g=new THREE.Group(), bw=.05, d=.04;
  g.add(frameRect(w,h,bw,d,M.trim));
  for(let i=1;i<cols;i++) box(.022,h-2*bw,d*.8,M.trim,-w/2+i*w/cols,0,0,g);
  for(let j=1;j<rows;j++) box(w-2*bw,.022,d*.8,M.trim,0,-h/2+j*h/rows,0,g);
  const gl=new THREE.Mesh(new THREE.PlaneGeometry(w-2*bw,h-2*bw),M.glass); gl.userData.noShadow=true; g.add(gl);
  return g; }
function awningWindow(w,h,cols,rows,openDeg,t,withMesh=true){
  const g=new THREE.Group();
  if(withMesh){ const mp=meshPanel(w,h); mp.position.z=-t/2; g.add(mp); }
  const tr=frameRect(w+.14,h+.14,.07,.022,M.trim); tr.position.z=.011; g.add(tr);
  const pivot=new THREE.Group(); pivot.position.set(0,h/2,.035); g.add(pivot);
  const s=sash(w-.02,h-.02,cols,rows); s.position.y=-h/2; pivot.add(s);
  const a=openDeg*DEG; pivot.rotation.x=-a;
  if(openDeg>3) for(const sx of [-1,1]){ const x=sx*(w/2-.07);
    beam(new V3(x,-h/2+.03,.03), new V3(x,h/2-.8*h*Math.cos(a),.035+.8*h*Math.sin(a)), .014,.014,M.black,g); }
  return g; }
function meshLeaf(w,h,winter){ const g=new THREE.Group(), bw=.075, d=.045;
  const f=frameRect(w,h,bw,d,M.doorFr); f.position.set(w/2,h/2,0); g.add(f);
  box(w-2*bw,bw,d,M.doorFr,w/2,h*.5,0,g);
  beam(new V3(bw,bw,0),new V3(w-bw,h*.5-bw/2,0),.06,.04,M.doorFr,g);          // snedsträva nedre fält
  const mp=meshPanel(w-2*bw+.02,h-2*bw+.02); mp.position.set(w/2,h/2,-.012); g.add(mp);
  box(.03,.12,.03,M.black,w-.05,h*.5,.04,g);                                   // regel
  for(const y of [.18,h-.18]) box(.22,.035,.01,M.black,.11,y,.028,g);           // gångjärn
  if(winter) box(w-.05,h-.2,.012,M.ply,w/2,(h-.2)/2+.03,-d/2-.008,g);            // vinterskiva (springa upptill)
  return g; }
function plankLeaf(w,h){ const g=new THREE.Group(), n=Math.max(3,Math.round(w/.14)), pw=w/n;
  for(let i=0;i<n;i++) box(pw-.006,h,.03,M.plank,-w+pw*(i+.5),h/2,0,g);
  for(const y of [h*.15,h*.85]) box(w-.06,.11,.024,M.plank,-w/2,y,.027,g);
  beam(new V3(-.08,h*.15+.04,.027),new V3(-w+.08,h*.85-.04,.027),.1,.024,M.plank,g);
  for(const y of [h*.15,h*.85]) box(.3,.03,.01,M.black,-.15,y,.045,g);
  box(.03,.14,.03,M.black,-w+.06,h*.5,.04,g);
  return g; }
function barnLight(){ const g=new THREE.Group();
  box(.1,.1,.02,M.black,0,0,.01,g);
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.3,8),M.black); arm.rotation.x=Math.PI/2; arm.position.set(0,0,.16); g.add(arm);
  const sh=new THREE.Mesh(new THREE.ConeGeometry(.17,.11,24,1,true),M.black); sh.position.set(0,-.02,.31); g.add(sh);
  const b=new THREE.Mesh(new THREE.SphereGeometry(.035,12,8),M.bulb); b.position.set(0,-.07,.31); g.add(b);
  return g; }

/* ---------------- Bygg modellen ---------------- */
let house=null, dims=null; const ROOSTS={n:0,len:0};
const eveningLights=[];
function disposeTree(o){ o.traverse(c=>{ if(c.geometry) c.geometry.dispose(); if(c.element) c.element.remove(); }); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lin=(a,b,n)=>Array.from({length:n+1},(_,i)=>a+(b-a)*i/n);

function build(){
  if(house){ scene.remove(house); disposeTree(house); }
  if(dims){ scene.remove(dims); disposeTree(dims); }
  eveningLights.length=0;
  house=new THREE.Group(); house.name='Honshus';
  const W=P.W, L=P.L, H=P.H, t=.03, th=Math.tan(P.pitch*DEG), cs=Math.cos(P.pitch*DEG);
  const R=H+W/2*th;
  const F=clamp(P.F,.25,Math.min(1.0,H-1.1));
  const PL=clamp(P.PL,.8,L-1.0);
  const pitStart=L/2-PL;
  const DW=clamp(P.DW,.6,W-.3), DH=clamp(P.DH,1.0,H-.05);
  const inner=W/2-t;

  const leftG=new THREE.Group(); leftG.name='Vanster_langvagg'; house.add(leftG);
  const roofG=new THREE.Group(); roofG.name='Tak'; house.add(roofG);

  function place(side,obj,u,v,out=0){
    const par = side==='left'?leftG:house;
    if(side==='front'){ obj.position.set(u,v,L/2+out); obj.rotation.y=0; }
    if(side==='back'){ obj.position.set(u,v,-L/2-out); obj.rotation.y=Math.PI; }
    if(side==='right'){ obj.position.set(W/2+out,v,u); obj.rotation.y=Math.PI/2; }
    if(side==='left'){ obj.position.set(-W/2-out,v,u); obj.rotation.y=-Math.PI/2; }
    par.add(obj); return obj; }

  /* --- stolpar & fack --- */
  const zA=-L/2+t+.05, zB=L/2-t-.05;
  const nf=Math.max(1,Math.ceil((pitStart-zA)/1.25)), np=Math.max(1,Math.ceil((zB-pitStart)/1.25));
  const fz=lin(zA,pitStart,nf), pz=lin(pitStart,zB,np);
  const postZ=[...fz,...pz.slice(1)];
  const floorBays=fz.slice(0,-1).map((z,i)=>[z,fz[i+1]]);

  /* --- gavel fram: pardörrar + fönster --- */
  {
    const ww=Math.min(1.05,DW*.75); let wy0=DH+.12, wh=.52;
    const topAllowed=H+(W/2-ww/2-.1)*th-.06;
    wh=Math.min(wh, topAllowed-wy0);
    const holes=[]; if(wh>=.25) holes.push([-ww/2,wy0,ww/2,wy0+wh]);
    const outline=[[-W/2,0],[-DW/2,0],[-DW/2,DH],[DW/2,DH],[DW/2,0],[W/2,0],[W/2,H],[0,R],[-W/2,H]];
    const wm=wallMesh(outline,holes,t); wm.position.z=L/2-t; house.add(wm);
    // dörrar
    const dg=new THREE.Group();
    const lw=DW/2-.008, lh=DH-.04;
    const pl=new THREE.Group(); pl.position.set(-DW/2,.03,.03); pl.rotation.y=-P.doorOpen*DEG; dg.add(pl);
    pl.add(meshLeaf(lw,lh,P.winter));
    const pr=new THREE.Group(); pr.position.set(DW/2,.03,.03); pr.rotation.y=P.doorOpen*DEG; dg.add(pr);
    const rl=meshLeaf(lw,lh,P.winter); rl.position.x=-lw; pr.add(rl);
    const df=new THREE.Group(); box(.07,DH,.03,M.trim,-DW/2-.035,DH/2,0,df); box(.07,DH,.03,M.trim,DW/2+.035,DH/2,0,df); box(DW+.14,.07,.03,M.trim,0,DH+.035,0,df);
    df.position.z=.015; dg.add(df);
    place('front',dg,0,0);
    if(wh>=.25) place('front',awningWindow(ww,wh,3,2,P.win,t),0,wy0+wh/2);
    place('front',barnLight(),clamp(-DW/2-.2,-W/2+.15,0),Math.min(DH+.1,H-.1));
  }

  /* --- gavel bak: fast fyrrutsfönster --- */
  {
    const bw=Math.min(.62,W*.35); let by0=H-.35, bh=.55;
    bh=Math.min(bh,H+(W/2-bw/2-.1)*th-.06-by0);
    const holes = bh>.25 ? [[-bw/2,by0,bw/2,by0+bh]] : [];
    const outline=[[-W/2,0],[W/2,0],[W/2,H],[0,R],[-W/2,H]];
    const wm=wallMesh(outline,holes,t); wm.position.z=-L/2; house.add(wm);
    if(bh>.25) place('back',awningWindow(bw,bh,2,2,0,t,false),0,by0+bh/2);
  }

  /* --- långväggar --- */
  const longOutline=[[-L/2+t,0],[L/2-t,0],[L/2-t,H],[-L/2+t,H]];
  const band = F>.3 ? [-L/2+.15,.1,pitStart-.08,F-.08] : null;
  const pitOpen=[pitStart+.08,.35,L/2-.15,H-.3];
  const SDW=Math.min(P.SDW,(floorBays[0][1]-floorBays[0][0])-.15);
  const SDH=Math.min(1.75,H-F-.12);
  const doorZ=(floorBays[0][0]+floorBays[0][1])/2;
  const lastBay=floorBays[floorBays.length-1];
  const winW=Math.min(.75,(lastBay[1]-lastBay[0])-.25), winH=.5, winY0=H-.72;

  for(const side of ['right','left']){
    const holes=[]; if(band) holes.push(band); holes.push(pitOpen);
    const hasDoor = side==='right' && SDW>.45 && SDH>1.0;
    const hasWin = winW>.35 && (side==='left' || floorBays.length>1);
    if(hasDoor) holes.push([doorZ-SDW/2,F,doorZ+SDW/2,F+SDH]);
    const wz=(lastBay[0]+lastBay[1])/2;
    if(hasWin) holes.push([wz-winW/2,winY0,wz+winW/2,winY0+winH]);
    const wm=wallMesh(longOutline,holes,t); wm.rotation.y=-Math.PI/2;
    wm.position.x = side==='right'? W/2 : -W/2+t;
    (side==='left'?leftG:house).add(wm);
    const xs = side==='right'?1:-1;
    // nätband under golvet + stora nätöppningar vid gropen
    for(const hb of (band?[band,pitOpen]:[pitOpen])){
      const w=hb[2]-hb[0], h=hb[3]-hb[1], uc=(hb[0]+hb[2])/2, vc=(hb[1]+hb[3])/2;
      const g=new THREE.Group(); const mp=meshPanel(w,h); mp.position.z=-t/2; g.add(mp);
      const tr=frameRect(w+.12,h+.12,.06,.022,M.trim); tr.position.z=.011; g.add(tr);
      for(const k of [1,2,3].slice(0,Math.floor(w/1.2))) box(.05,h,.022,M.trim,-w/2+k*w/(Math.floor(w/1.2)+1),0,.011,g);
      place(side,g,uc,vc);
      if(P.winter && hb===pitOpen){ // vinterluckor invändigt, springa upptill för ventilation
        const pg=new THREE.Group(); box(w+.06,h-.12,.012,M.ply,0,-.06,0,pg);
        place(side,pg,uc,vc,-t-.008);
      }
    }
    if(hasDoor){
      const dg=new THREE.Group();
      const pv=new THREE.Group(); pv.position.set(SDW/2,0,.02); pv.rotation.y=P.sideOpen*DEG; dg.add(pv);
      pv.add(plankLeaf(SDW-.01,SDH-.01));
      const df=new THREE.Group(); box(.07,SDH,.03,M.trim,-SDW/2-.035,SDH/2,0,df); box(.07,SDH,.03,M.trim,SDW/2+.035,SDH/2,0,df); box(SDW+.14,.07,.03,M.trim,0,SDH+.035,0,df);
      df.position.z=.015; dg.add(df);
      place(side,dg,doorZ,F);
      if(F>.3){ const st=new THREE.Group(); box(SDW+.2,.05,.38,M.wood,0,F/2,.19,st); box(.05,F/2,.05,M.wood,-SDW/2,F/4,.34,st); box(.05,F/2,.05,M.wood,SDW/2,F/4,.34,st); place(side,st,doorZ,0); }
      place(side,barnLight(),doorZ,Math.min(F+SDH+.2,H-.1));
    }
    if(hasWin) place(side,awningWindow(winW,winH,3,2,P.win,t),wz,winY0+winH/2);
  }

  /* --- hörnbrädor --- */
  for(const sx of [-1,1]) for(const sz of [-1,1]) box(.1,H,.1,M.trim,sx*(W/2-.04),H/2,sz*(L/2-.04),house);

  /* --- stomme (grov, gammal) --- */
  const px=inner-.05;
  for(const z of postZ) for(const sx of [-1,1]){
    box(.1,H-.05,.1,M.wood,sx*px,(H-.05)/2,z,sx<0?leftG:house);
    beam(new V3(sx*px,H-.6,z),new V3(sx*(px-.5),H-.12,z),.08,.08,M.wood,house);
  }
  for(const sx of [-1,1]) box(.1,.1,L-2*t,M.wood,sx*px,H-.05,0,sx<0?leftG:house);
  for(const z of postZ) box(W-2*t,.12,.08,M.wood,0,H-.08,z,house);

  /* --- tak --- */
  const ohG=.15, Lr=L+2*ohG, Se=P.oh/cs, Sr=(W/2)/cs+.02;
  const rafN=Math.max(2,Math.ceil(L/.6)), rafZ=lin(-L/2+.03,L/2-.03,rafN);
  const sheetY=.17;
  for(const s of [-1,1]){
    const sg=new THREE.Group();
    sg.position.set(s*W/2,H,0);
    sg.rotation.set(0, s<0?0:Math.PI, P.pitch*DEG);
    house.add(sg);
    const xc=(Sr-Se)/2, xl=Sr+Se;
    for(const z of rafZ) box(xl,.12,.05,M.wood,xc,.06,z,sg);                    // takstolar/sparrar (+ synliga sparrändar)
    for(const x of [-Se+.08, Sr*.33, Sr*.66, Sr-.06]) box(.05,.04,Lr,M.wood,x,.14,0,sg); // läkt
    const sheets=new THREE.Group(); roofG.add(sheets);
    // ljusinsläpp: valda fack på vänster takfall (s=-1)
    const clearBays=new Set();
    if(s<0 && P.clear>0){ const nb=rafN, mid=Math.floor(nb/2);
      const order=[]; for(let k=0;k<nb;k++){ const i=mid+(k%2?1:-1)*Math.ceil(k/2)*2; if(i>=0&&i<nb && !order.includes(i)) order.push(i); }
      order.slice(0,P.clear).forEach(i=>clearBays.add(i)); }
    const a=Sr*.18, b=Sr*.86;
    const piece=(x0,x1,z0,z1,mat)=>{ const g=new THREE.BoxGeometry(x1-x0,.012,z1-z0); planarUV(g,(x0+x1)/2,(z0+z1)/2,1,.2);
      const m=new THREE.Mesh(g,mat); m.position.set((x0+x1)/2,sheetY,(z0+z1)/2); sheets.add(m); if(mat===M.clear) m.userData.noShadow=true; };
    const edges=[-Lr/2,...rafZ.slice(1,-1),Lr/2];
    for(let i=0;i<edges.length-1;i++){
      const z0=edges[i], z1=edges[i+1], zz0=s<0?z0:-z1, zz1=s<0?z1:-z0; // spegla z på höger takfall
      if(clearBays.has(i)){ piece(-Se-.03,a,zz0,zz1,M.metal); piece(a,b,zz0,zz1,M.clear); piece(b,Sr,zz0,zz1,M.metal); }
      else piece(-Se-.03,Sr,zz0,zz1,M.metal);
    }
    sheets.position.copy(sg.position); sheets.rotation.copy(sg.rotation);
    // vindskivor (vita) vid gavlarna
    for(const sz of [-1,1]) box(xl,.16,.025,M.trim,xc,.08,sz*(Lr/2-.0125),sg);
  }
  const ridgeTop=R+(sheetY+.012)/cs;
  box(.08,.16,L,M.wood,0,R+.02,0,house);                                       // nockbalk
  { const cap=new THREE.Mesh(new THREE.BoxGeometry(.26,.015,Lr),M.metal); planarUV(cap.geometry,0,0,1,.2); cap.position.set(0,ridgeTop,0); roofG.add(cap); }

  /* --- takkupol (cupola) med jalusier --- */
  if(P.cupola){
    const cg=new THREE.Group(); cg.name='Takkupol'; roofG.add(cg);
    const c=clamp(W*.2,.36,.6), ch=.42, base=ridgeTop-c/2*th;
    const bh=ch+(ridgeTop-base);
    box(c,bh,c,M.trim,0,base+bh/2,0,cg);
    const ly=ridgeTop+ch*.5;
    for(const [nx,nz,ry] of [[0,1,0],[0,-1,Math.PI],[1,0,Math.PI/2],[-1,0,-Math.PI/2]]){
      const f=new THREE.Group(); f.position.set(nx*(c/2+.002),ly,nz*(c/2+.002)); f.rotation.y=ry; cg.add(f);
      box(c*.68,ch*.62,.006,M.black,0,0,0,f);
      for(let i=0;i<5;i++){ const s=box(c*.66,.012,.06,M.trim,0,-ch*.26+i*ch*.13,.02,f); s.rotation.x=40*DEG; }
    }
    const cth=Math.tan(35*DEG), half=c/2+.07, top=base+bh;
    for(const s of [-1,1]){ const r=new THREE.Mesh(new THREE.BoxGeometry(half/Math.cos(35*DEG),.02,c+.14),M.metal);
      r.position.set(s*half/2,top+half/2*cth,0); r.rotation.z=-s*35*DEG; cg.add(r); }
    box(.03,.12,.03,M.black,0,top+half*cth+.06,0,cg);
  }

  /* --- övre plan (upphöjt golv) --- */
  const fl0=-L/2+t, fl1=pitStart, flL=fl1-fl0;
  { const f=box(W-2*t,.035,flL,M.shav,0,F-.0175,(fl0+fl1)/2,house);
    planarUV(f.geometry,0,0,.8,.8);
    for(const z of lin(fl0+.05,fl1-.05,Math.max(2,Math.ceil(flL/.4)))) box(W-2*t,.14,.045,M.wood,0,F-.105,z,house);   // golvbjälkar
    box(W-2*t,F,.03,M.osb,0,F/2,fl1+.015,house);                                                                     // front mot gropen
    box(W-2*t,.09,.06,M.wood,0,F+.045,fl1+.03,house);                                                                // kantlist
  }
  /* --- kompostgrop --- */
  { const c=box(W-2*t,.12,PL-.03,M.compost,0,.06,(pitStart+L/2-t)/2,house); planarUV(c.geometry,0,0,.9,.9);
  }
  /* --- sittpinnar: lutande stege över gropen --- */
  // Stegen står på övre planets golvkant och hänger i gavelns reglar ovanför pardörrarna.
  // Gropgolvet är helt fritt, så en lastare kan köra in genom pardörrarna.
  { const rx=inner-.14;
    const zw=L/2-t-.06;
    const hdrTop=DH+.14;                                   // hammarbandets överkant (dörrens ovandel + en regel)
    const topY=clamp(hdrTop+.05,F+.6,H-.1);                // bärregeln sitter direkt ovanpå hammarbandet
    const p0=new V3(0,F+.02,pitStart-.12);
    const p1=new V3(0,topY,zw-.05);
    const len=p0.distanceTo(p1);
    const gap=clamp(P.gap,.2,.6);
    const n=Math.max(2,Math.floor((len-.15)/gap)+1);       // fler pinnar ju längre stegen blir
    ROOSTS.n=n; ROOSTS.len=len;
    for(const sx of [-1,1]) beam(new V3(sx*rx,p0.y,p0.z),new V3(sx*rx,p1.y,p1.z),.045,.09,M.wood,house);
    box(W-2*t-.02,.14,.07,M.wood,0,DH+.07,zw,house);                               // hammarband över dörrarna
    box(W-2*t-.02,.1,.07,M.wood,0,topY,zw,house);                                  // bärregel som stegen hänger i
    for(const sx of [-1,1]) box(.09,H-.05,.07,M.wood,sx*(DW/2+.06),(H-.05)/2,zw,house);
    for(const sx of [-1,1]) box(.06,.16,.1,M.black,sx*rx,topY-.02,zw-.06,house);  // beslag
    const dir=new V3().subVectors(p1,p0).normalize();
    for(let i=0;i<n;i++){ const d=len-.08-i*gap; if(d<.05) break;
      const q=p0.clone().addScaledVector(dir,d);
      box(2*rx+.12,.045,.09,M.wood,0,q.y+.06,q.z,house); }
  }
  /* --- värpredesfack (vänster vägg, bakre delen) --- */
  { const bw=.32, d=.36, hh=.34, maxN=Math.floor((flL-.4)/bw);
    const n=clamp(Math.round(P.nests),0,maxN);
    if(n>0){ const g=new THREE.Group(); g.name='Varpredesfack'; house.add(g);
      const x0=-inner, xm=x0+d/2, y0=F+.3, z0=fl0+.15, z1=z0+n*bw, zm=(z0+z1)/2;
      box(d,.018,n*bw,M.ply,xm,y0,zm,g); box(d,.018,n*bw,M.ply,xm,y0+hh,zm,g);
      for(let i=0;i<=n;i++) box(d,hh,.018,M.ply,xm,y0+hh/2,z0+i*bw,g);
      box(.018,.1,n*bw,M.ply,x0+d,y0+.05,zm,g);                                   // framkant
      const sp=new THREE.Mesh(new THREE.BoxGeometry(d-.04,.04,n*bw-.04),M.shav); sp.position.set(xm,y0+.03,zm); g.add(sp);
      const perch=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,n*bw,10),M.wood); perch.rotation.x=Math.PI/2; perch.position.set(x0+d+.1,y0-.04,zm); g.add(perch);
      for(const z of [z0,z1]) box(.04,.3,.04,M.wood,x0+d-.02,F+.15,z,g);
      const la=35*DEG, ll=(d+.08)/Math.cos(la); const lid=box(ll,.018,n*bw+.03,M.ply,xm+.04,y0+hh+(d/2)*Math.tan(la),zm,g); lid.rotation.z=-la;
    }
  }
  /* --- foderautomat, vattenautomat --- */
  { const g=new THREE.Group(); g.name='Foderautomat'; house.add(g);
    const fx=inner-.27, fz=fl0+.36;
    box(.5,.85,.6,M.ply,fx,F+.425,fz,g);
    box(.14,.1,.6,M.ply,fx-.31,F+.05,fz,g);
    const lid=box(.62,.02,.66,std('#8e9297',.8),fx,F+.9,fz,g); lid.rotation.z=12*DEG;
    const w=new THREE.Group(); w.position.set(-.15,F,fl0+flL*.62); house.add(w);
    const c1=new THREE.Mesh(new THREE.CylinderGeometry(.19,.2,.06,24),M.red); c1.position.y=.03; w.add(c1);
    const c2=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.34,24),M.white); c2.position.y=.23; w.add(c2);
    const c3=new THREE.Mesh(new THREE.CylinderGeometry(.1,.13,.06,24),M.red); c3.position.y=.43; w.add(c3);
  }
  /* --- glödlampor --- */
  for(const z of [postZ[Math.floor(postZ.length/3)], postZ[Math.floor(2*postZ.length/3)]]){
    box(.008,.28,.008,M.black,0,H-.28,z,house);
    const b=new THREE.Mesh(new THREE.SphereGeometry(.045,14,10),M.bulb); b.position.set(0,H-.44,z); house.add(b);
    if(P.evening){ const pl=new THREE.PointLight('#ffd49a',5,7,1.4); pl.position.set(0,H-.5,z); house.add(pl); eveningLights.push(pl); }
  }
  M.bulb.emissiveIntensity = P.evening?3:0;

  /* --- nedgrävt nätförkläde, 60 cm --- */
  if(P.apron){ const a=.6, y=.004;
    for(const [w,h,x,z] of [[W+2*a,a,0,L/2+a/2],[W+2*a,a,0,-L/2-a/2],[a,L,W/2+a/2,0],[a,L,-W/2-a/2,0]]){
      const m=meshPanel(w,h,M.apron); m.rotation.x=-Math.PI/2; m.position.set(x,y,z); house.add(m); } }

  /* --- synlighet, skuggor --- */
  leftG.visible=!P.cutaway;
  roofG.visible=P.roof;
  house.traverse(o=>{ if(o.isMesh){ o.castShadow=!o.userData.noShadow; o.receiveShadow=true; } });
  scene.add(house);

  /* --- måttlinjer --- */
  dims=new THREE.Group(); scene.add(dims); dims.visible=P.dims;
  const lm=new THREE.LineBasicMaterial({color:'#c33'});
  const line=(pts)=>dims.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm));
  const label=(txt,p)=>{ const d=document.createElement('div'); d.className='dim'; d.textContent=txt; const o=new CSS2DObject(d); o.position.copy(p); dims.add(o); };
  const fmt=m=>`${m.toFixed(2).replace('.',',')} m · ${(m/FT).toFixed(1).replace('.',',')} ft`;
  const zf=L/2+.7, xs=W/2+.7, y=.03;
  line([new V3(-W/2,y,zf),new V3(W/2,y,zf)]); line([new V3(-W/2,y,zf-.1),new V3(-W/2,y,zf+.1)]); line([new V3(W/2,y,zf-.1),new V3(W/2,y,zf+.1)]);
  label('Bredd '+fmt(W),new V3(0,y+.05,zf));
  line([new V3(xs,y,-L/2),new V3(xs,y,L/2)]); line([new V3(xs-.1,y,-L/2),new V3(xs+.1,y,-L/2)]); line([new V3(xs-.1,y,L/2),new V3(xs+.1,y,L/2)]);
  label('Längd '+fmt(L),new V3(xs,y+.05,0));
  const xh=-W/2-.45, zh=L/2+.3;
  line([new V3(xh,0,zh),new V3(xh,ridgeTop,zh)]); line([new V3(xh-.08,H,zh),new V3(xh+.08,H,zh)]); line([new V3(xh-.08,ridgeTop,zh),new V3(xh+.08,ridgeTop,zh)]);
  label('Takfot '+fmt(H),new V3(xh,H,zh)); label('Nock '+fmt(ridgeTop),new V3(xh,ridgeTop+.12,zh));
  label('Kompostgrop '+fmt(PL),new V3(0,.25,(pitStart+L/2)/2));
  label('Övre plan '+fmt(F),new V3(0,F+.12,(fl0+fl1)/2));

  /* --- info --- */
  const area=W*L, birds=Math.round(area/0.24);
  document.getElementById('stats').innerHTML=
    `<b>${(W/FT).toFixed(1)} × ${(L/FT).toFixed(1)} ft</b> · ${W.toFixed(2)} × ${L.toFixed(2)} m<br>`+
    `Golvyta ${area.toFixed(1).replace('.',',')} m² → ca <b>${birds} höns</b><br>`+
    `<span style="color:#666;font-size:11px">(hans egna siffror: 8×16 = 50, 6×12 = 25, 5×8 = 15 höns ≈ 0,24 m²/höna)</span><br>`+
    `Nockhöjd ${ridgeTop.toFixed(2)} m · pardörr ${DW.toFixed(2)} × ${DH.toFixed(2)} m<br>`+
    `Sittpinnar: <b>${ROOSTS.n} st</b> à ${(P.W-0.34).toFixed(2)} m = ${(ROOSTS.n*(P.W-0.34)).toFixed(1)} löpmeter (≈ ${Math.round(ROOSTS.n*(P.W-0.34)/0.22)} höns à 22 cm)`;
}

/* ---------------- Ljus dag/kväll ---------------- */
function applyLighting(){
  const ev=P.evening;
  scene.background.set(ev?'#1f2840':'#cfe3f0'); scene.fog.color.set(ev?'#1f2840':'#cfe3f0');
  hemi.intensity=ev?.12:.9; sun.intensity=ev?.15:2.4; sun.color.set(ev?'#ff9a5a':'#fff6e6');
}

/* ---------------- GUI ---------------- */
let needsBuild=true;
const rebuild=()=>{ needsBuild=true; };
const gui=new GUI({title:'Hönshus – inställningar'});
gui.add(P,'preset',Object.keys(PRESETS)).name('Förinställning').onChange(v=>{ Object.assign(P,PRESETS[v]); gui.controllersRecursive().forEach(c=>c.updateDisplay()); rebuild(); });
const fM=gui.addFolder('Mått');
fM.add(P,'W',1.2,3.6,.01).name('Bredd (gavel), m').onChange(rebuild);
fM.add(P,'L',2.0,7.0,.01).name('Längd, m').onChange(rebuild);
fM.add(P,'H',1.6,2.8,.01).name('Vägghöjd (takfot), m').onChange(rebuild);
fM.add(P,'pitch',15,45,1).name('Taklutning, °').onChange(rebuild);
fM.add(P,'oh',0,.5,.01).name('Takutsprång, m').onChange(rebuild);
const fD=gui.addFolder('Dörrar & fönster');
fD.add(P,'DW',.6,3.2,.01).name('Pardörr, bredd m').onChange(rebuild);
fD.add(P,'DH',1.0,2.6,.01).name('Pardörr, höjd m').onChange(rebuild);
fD.add(P,'doorOpen',0,115,1).name('Pardörr öppen, °').onChange(rebuild);
fD.add(P,'SDW',.5,1.0,.01).name('Sidodörr, bredd m').onChange(rebuild);
fD.add(P,'sideOpen',0,110,1).name('Sidodörr öppen, °').onChange(rebuild);
fD.add(P,'win',0,75,1).name('Fönster uppställda, °').onChange(rebuild);
const fI=gui.addFolder('Inredning');
fI.add(P,'F',.25,1.0,.01).name('Övre plan, höjd m').onChange(rebuild);
fI.add(P,'PL',.8,4,.01).name('Kompostgrop, längd m').onChange(rebuild);
fI.add(P,'gap',.2,.6,.01).name('Avstånd mellan sittpinnar, m').onChange(rebuild);
fI.add(P,'nests',0,8,1).name('Värpredesfack, antal').onChange(rebuild);
fI.add(P,'clear',0,6,1).name('Ljuspaneler i taket').onChange(rebuild);
const fV=gui.addFolder('Visa');
fV.add(P,'winter').name('Vinterluckor (plywood)').onChange(rebuild);
fV.add(P,'cupola').name('Takkupol').onChange(rebuild);
fV.add(P,'roof').name('Taket (plåt)').onChange(rebuild);
fV.add(P,'cutaway').name('Genomskärning (ta bort vägg)').onChange(rebuild);
fV.add(P,'apron').name('Nedgrävt nätförkläde 60 cm').onChange(rebuild);
fV.add(P,'dims').name('Måttlinjer').onChange(rebuild);
fV.add(P,'evening').name('Kväll (lampor tända)').onChange(()=>{ applyLighting(); rebuild(); });
const views={
  'Utsida':()=>setView([6.5,3.8,7.5],[0,1.2,0]),
  'Gavel med pardörrar':()=>setView([0.6,1.7,P.L/2+4.2],[0,1.3,0]),
  'Interiör (genomskärning)':()=>{ P.cutaway=true; gui.controllersRecursive().forEach(c=>c.updateDisplay()); rebuild(); setView([-P.W/2-5.2,3.4,1.2],[0,0.9,0]); },
  'Ovanifrån utan tak':()=>{ P.roof=false; gui.controllersRecursive().forEach(c=>c.updateDisplay()); rebuild(); setView([0.01,9,0.3],[0,0,0]); },
};
const fC=gui.addFolder('Kameravyer');
for(const k in views) fC.add(views,k);
const ex={
  'Spara bild (PNG)':()=>{ renderer.render(scene,camera); const a=document.createElement('a'); a.href=renderer.domElement.toDataURL('image/png'); a.download='honshus.png'; a.click(); },
  'Exportera 3D (GLB)':()=>{ new GLTFExporter().parse(house,(glb)=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([glb],{type:'model/gltf-binary'})); a.download='honshus.glb'; a.click(); },(e)=>alert(e),{binary:true}); },
};
const fE=gui.addFolder('Export'); for(const k in ex) fE.add(ex,k);

function setView(p,t){ camera.position.set(...p); controls.target.set(...t); controls.update(); }

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); });

applyLighting();
renderer.setAnimationLoop(()=>{
  if(needsBuild){ needsBuild=false; build(); }
  controls.update(); renderer.render(scene,camera); labelRenderer.render(scene,camera);
});
window.__P=P; window.__rebuild=rebuild; window.__views=views; window.__ok=true;
</script>
</body>
</html>
