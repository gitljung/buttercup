};

               'MK10 78×160':[780,1600],'MK08 78×140':[780,1400],'UK08 134×140':[1340,1400],'Eget mått':null};

  fonster:true, velux:'SK10 114×160', KarmB:1140, KarmL:1600, FonsterS:1400,

const P = {...DEF};
try { const m = location.hash.match(/c=([^&]+)/); if (m) Object.assign(P, JSON.parse(decodeURIComponent(m[1]))); } catch(e) {}
if (!VAR[P.variant]) P.variant = 'STANDARD';
const RB = 45, DorrB = 700, DorrH = 1900, KT = 8, PanelT = 22, VB = 45;

// ---------------------------------------------------------------- material
const COL = {tra:'#d2a86e', impr:'#8c8150', skiva:'#dcbd8b', papp:'#34302c', panel:'#6e5237', glas:'#a8dcf2', plat:'#b4b9be',
             stal:'#4b4f53', velux:'#4a5157', jord:'#4b3626', vaxt:'#6f9c3c', blom:'#e9b93a', hylla:'#a8783f', person:'#C8340A', gras:'#4f6b2c', tuva:'#ffffff', grus:'#a9a397', porslin:'#f4f4f1', stalregel:'#b7bdc3', spegel:'#bcd3dc', madrass:'#f1ece2', skap:'#e3cfaa', tacke:'#cfc6b2', kudde:'#fbf8f2', front:'#efe2c6', krom:'#c9ced3', plywood:'#e8d6b4', ask:'#c99d66', filt:'#1d1a18'};
const DENS = {gras:1200, grus:1700, plywood:680, ask:680, filt:150, tra:470, impr:550, skiva:520, panel:450, papp:1100, plat:7850, stal:7850, hylla:470, jord:1100};
const ALLM = [], solidM = {}, ghostM = {}, edgeG = {};
const white = new THREE.Color('#ffffff');
for (const [k, c] of Object.entries(COL)) {
  const glas = k === 'glas';
  solidM[k] = new THREE.MeshStandardMaterial({color:c, roughness: glas ? .08 : (k==='plat'||k==='stal'||k==='velux') ? .45 : .85,

  edgeG[k] = new THREE.LineBasicMaterial({color: lc, transparent:true, opacity:.6, depthWrite:false, blending:THREE.AdditiveBlending});
  ALLM.push(solidM[k], ghostM[k], edgeG[k]);
}
{ const cv = document.createElement('canvas'); cv.width = cv.height = 256; const x = cv.getContext('2d');
  x.fillStyle = '#56742f'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) { x.fillStyle = ['#4a6a28', '#6b8f3a', '#3f5a22', '#7fa046', '#8a7d3c'][i % 5]; x.globalAlpha = .55; x.fillRect(Math.random()*256, Math.random()*256, 2 + Math.random()*3, 2 + Math.random()*5); }
  const tx = new THREE.CanvasTexture(cv); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(1/450, 1/450); tx.colorSpace = THREE.SRGBColorSpace;
  solidM.gras.map = tx; solidM.gras.color.set('#ffffff'); }
const edgeS = new THREE.LineBasicMaterial({color:'#2A1206', transparent:true, opacity:.3});
const edgeW = new THREE.LineBasicMaterial({color:'#2A1206'});
const NONE = new THREE.MeshBasicMaterial({visible:false});
ALLM.push(edgeS, edgeW);

// ---------------------------------------------------------------- scen
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const lr = new CSS2DRenderer(); lr.setSize(innerWidth, innerHeight);
lr.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none'; document.body.appendChild(lr.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .05, 300);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.maxDistance = 60;
scene.add(new THREE.HemisphereLight('#fff6dc', '#6d6040', 1.15));
const sun = new THREE.DirectionalLight('#ffffff', 2.1); sun.position.set(-6, 10, -7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left:-7, right:7, top:7, bottom:-7, near:1, far:40}); sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
const lampa = new THREE.PointLight('#fff1dc', 2.2, 7, 0); scene.add(lampa);
const ground = new THREE.Mesh(new THREE.CircleGeometry(16, 72), new THREE.MeshStandardMaterial({color:'#a8b56c', roughness:1}));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.002; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(20, 40, '#3c5670', '#223040'); scene.add(grid);
const root = new THREE.Group(); root.scale.setScalar(0.001); scene.add(root);
const plane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0.6);

// ---------------------------------------------------------------- hjälpare (mm; modell-x = längd, modell-y = djup, z = upp → three (x, z, y))
let KG = {}, GLAS_M2 = 0, D = {}, D_klad = null;
const rad = d => d*Math.PI/180;
const area = pts => { let a = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i+1)%pts.length]; a += p[0]*q[1]-q[0]*p[1]; } return a/2; };
function add(g, key, grp, name, vol) {
  const m = new THREE.Mesh(g, solidM[key]); m.userData = {key, grp, name};
  m.castShadow = m.receiveShadow = true;
  if (!['vaxt','blom','person','filt','gras'].includes(key)) { const e = new THREE.LineSegments(new THREE.EdgesGeometry(g, 20), edgeS); e.raycast = () => {}; m.add(e); m.userData.edge = e; }
  root.add(m);
  if (DENS[key] && vol) KG[key] = (KG[key]||0) + vol*1e-9*DENS[key];
  return m;
}
function prismY(pts, y0, y1, key, grp, name) {
  if (!pts || pts.length < 3) return null; const a = Math.abs(area(pts)); if (a < 1) return null;
  const g = new THREE.ExtrudeGeometry(new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1]))), {depth: y1-y0, bevelEnabled:false, curveSegments:1});
  g.translate(0, 0, y0); return add(g, key, grp, name, a*(y1-y0));
}
function box(x0, x1, y0, y1, z0, z1, key, grp, name) {
  if (x1-x0 < .5 || y1-y0 < .5 || z1-z0 < .5) return null;
  const g = new THREE.BoxGeometry(x1-x0, z1-z0, y1-y0); g.translate((x0+x1)/2, (z0+z1)/2, (y0+y1)/2);
  return add(g, key, grp, name, (x1-x0)*(y1-y0)*(z1-z0));
}
function clip(poly, f) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i+1)%poly.length], fa = f(a), fb = f(b);
    if (fa <= 0) out.push(a);
    if ((fa < 0 && fb > 0) || (fa > 0 && fb < 0)) { const k = fa/(fa-fb); out.push([a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k]); }
  }
  return out;
}
const rect = (x0, x1, z0, z1) => [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];
let LBL = [];
function label(text, x, y, z, red) {
  const d = document.createElement('div'); d.className = 'lbl' + (red ? ' red' : ''); d.textContent = text;
  const o = new CSS2DObject(d); o.position.set(x, z, y); o.userData.grp = 'matt'; root.add(o); LBL.push(o); return o;
}
let seed = 1; const rnd = () => { seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; };

// ---------------------------------------------------------------- bygg
function build() {
  root.traverse(o => { if (o.isCSS2DObject) o.element.remove(); if (o.geometry) o.geometry.dispose(); });
  root.clear(); LBL = []; KG = {}; GLAS_M2 = 0; seed = 7; D_klad = null;
  const V = VAR[P.variant], W = [];
  const L2 = P.GolvL/2, Dj = P.Djup, MedH = V.MedH, BjH = V.BjalkH, GT = V.GolvT, VD = V.VaggD, TH = V.TakH, TT = V.TakT;
  const G = MedH + BjH + GT;
  const t = rad(P.TakV), h = rad(P.HogV), c = Math.cos(t), S = Math.sin(t), th = Math.tan(h), sh = Math.sin(h);
  const NH = P.GolvL/(1/Math.tan(t) + 1/th), NX = L2 - NH/th;
  const pt = (s, q) => [-L2 + c*s - S*q, G + S*s + c*q];                       // s längs takfallet från golvkant A, q vinkelrätt ut
  const sW = (q, off = 0) => (2*L2 - off/sh + S*q - c*q/th)/(c + S/th);          // där linjen q möter högväggen (yttre, eller off inåt)
  const sF = q => -q*c/S;                                                         // fot: z = G
  const tRel = p => -S*(p[0]+L2) + c*(p[1]-G);
  const under = q => p => tRel(p) - q;                                            // behåll q-linjen och under
  const innanf = off => p => p[0] + (p[1]-G)/th - (L2 - off/sh);
  const xout = z => L2 - (z-G)/th;
  const xin0 = z => L2 - VD/sh - (z - G)/th - (P.klad ? 9/sh : 0);
  DENS.stalregel = (VD <= 70 ? 0.7 : 1.0)/(45*VD*1e-6);
  const Tp = TH + TT + KT, GR = P.gras ? P.GrasT : 0, Tt = Tp + GR;   // Tp = papp-ovansida, Tt = takets topp (gräs)
  const sTop = sW(Tt), NT = pt(sTop, Tt)[1];

  // ---- 1 GRUND OCH GOLV
  const mx = L2 + 400, mxR = L2 + (P.nisch ? Math.max(400, P.NischD + 150) : 400);
  const med = [[-mx+300, 0], [mxR-300, 0], [mxR, 100], [mxR, MedH], [-mx, MedH], [-mx, 100]];
  prismY(med, 255, 345, 'impr', 'grund', 'Med 90×' + MedH);
  prismY(med, Dj-345, Dj-255, 'impr', 'grund', 'Med 90×' + MedH);
  box(-L2-90, -L2, 345, Dj-345, 100, MedH, 'impr', 'grund', 'Dragbalk 90×' + (MedH-100));
  box(L2, L2+90, 345, Dj-345, 100, MedH, 'impr', 'grund', 'Dragbalk 90×' + (MedH-100));

  const nB = Math.ceil((P.GolvL-45)/600) + 1, ccB = (P.GolvL-45)/(nB-1);

  box(-L2, L2, 0, Dj, MedH+BjH, G, 'skiva', 'grund', 'Golvskiva plywood ' + GT);
  box(-L2 - TH/S, -L2, 0, Dj, MedH, G, 'impr', 'grund', 'Takfotsbalk');
  for (const sx of [-1, 1]) {                                                    // dragstänger M16 + muttrar
    const x = sx*(L2 + 90 + 12), z = 100 + (MedH-100)/2;
    const g = new THREE.CylinderGeometry(8, 8, Dj - 510 + 120, 12); g.rotateX(Math.PI/2); g.translate(x, z, Dj/2);
    add(g, 'stal', 'kop', 'Gängstång M16 (DIN 976-1)', Math.PI*64*(Dj-390));
    for (const y of [255-12, Dj-255+12]) { const m = new THREE.CylinderGeometry(14, 14, 13, 6); m.rotateX(Math.PI/2); m.translate(x, z, y + (y < Dj/2 ? -8 : 8)); add(m, 'stal', 'kop', 'Mutter M16 + bricka'); }

  // NISCH (Hugo): högväggen vid bakgaveln lutar ut från nocken – stolparna där går från nocken (C) ut till NischD vid golvet. Inget eget tak.
  const NI = P.nisch, ND = P.NischD;

  const between = (x1, x2, za, zb) => clip(clip(rect(-1e4, 1e4, za, zb), p => x1(p[1]) - p[0]), p => p[0] - x2(p[1]));

  const stolpe = [[xout(z45), z45], [xout(z45) - VD/sh, z45], pt(sW(0, VD), 0), pt(sW(0), 0)];
  const stolpeN = clip(between(xNi, xN, z45, zC + 5), under(0));
  for (const y of yS) {
    if (NI && y + 22.5 > yN0 && y - 22.5 < Dj) prismY(stolpeN, y-22.5, y+22.5, 'tra', 'vagg', 'Nischstolpe (lutar ut från nocken) 45×' + VD);
    else prismY(stolpe, y-22.5, y+22.5, 'tra', 'vagg', 'Högväggsstolpe 45×' + VD);
  }
  const horn = [[L2, G], [L2 - VD/sh, G], pt(sW(0, VD), 0), pt(sW(0), 0)];
  prismY(horn, 0, VD, 'tra', 'vagg', 'Hörnstolpe 45×' + VD);
  const hp = [[L2, G], [L2 + PanelT/sh, G], [xout(NT) + PanelT/sh, NT], [xout(NT), NT]];
  if (!NI) { prismY(horn, Dj-VD, Dj, 'tra', 'vagg', 'Hörnstolpe 45×' + VD); prismY(hp, 0, Dj, 'panel', 'vagg', 'Högväggspanel 22'); }
  else {
    prismY(hp, 0, yN0, 'panel', 'vagg', 'Högväggspanel 22');
    prismY(clip(hp, p => zC - p[1]), yN0, Dj, 'panel', 'vagg', 'Högväggspanel 22 (ovan nischen)');
    prismY(clip(between(xNi, xN, G, zC + 5), under(0)), Dj - 45, Dj, 'tra', 'vagg', 'Nisch – hörnstolpe');
    prismY(band(xNi, xN, G, z45), yN0 + VD, Dj - VD, 'tra', 'vagg', 'Nisch – syll');
    // nischens sidoväggar: triangel mellan högväggens insida och nischens utsida
    // sidoväggarnas stomme: syll + stolpe i högväggens linje + stolpe i nischens linje (inte massiv)
    for (const [y0, y1, nmS] of [[yN0, yN0 + 45, 'främre'], [Dj - 45, Dj, 'bakre']]) {
      const sk = P.stal ? 'stalregel' : 'tra', sn = P.stal ? ' (stålregel/skena)' : '';
      prismY(clip(between(z => xout(z) - VD/sh, xN, G, z45), under(0)), y0, y1, sk, 'vagg', 'Nisch – sidovägg syll ' + nmS + sn);
      prismY(stolpe, y0, y1, sk, 'vagg', 'Nisch – sidovägg stolpe ' + nmS + sn);
      if (nmS === 'främre') prismY(clip(between(xNi, xN, z45, zC + 5), under(0)), y0, y1, 'tra', 'vagg', 'Nisch – sidovägg stolpe ' + nmS);
    }
    // utvändigt
    prismY(between(xN, z => xN(z) + PanelT/shN, G - 30, zC), yN0 - PanelT, Dj + PanelT, 'panel', 'vagg', 'Nisch – panel 22');
    const sp = between(xout, xN, G - 30, zC);
    prismY(sp, yN0 - PanelT, yN0, 'panel', 'vagg', 'Nisch – sidopanel 22'); prismY(sp, Dj, Dj + PanelT, 'panel', 'vagg', 'Nisch – sidopanel 22');
    // golv i nischen
    box(L2 + ND - 45, L2 + ND, yN0, Dj, MedH, MedH + BjH, 'tra', 'grund', 'Nisch – kantbalk');
    box(L2, L2 + ND - 45, yN0, yN0 + 45, MedH, MedH + BjH, 'tra', 'grund', 'Nisch – golvbjälke');
    box(L2, L2 + ND - 45, Dj - 45, Dj, MedH, MedH + BjH, 'tra', 'grund', 'Nisch – golvbjälke');
    box(L2, L2 + ND - 45, (yN0 + Dj)/2 - 22.5, (yN0 + Dj)/2 + 22.5, MedH, MedH + BjH, 'tra', 'grund', 'Nisch – golvbjälke');
    box(L2, L2 + ND, yN0, Dj, MedH + BjH, G, 'skiva', 'grund', 'Nisch – golvskiva ' + GT);
  }

  // ---- gavlar
  const DorrX = L2 - VD/sh - (2*RB + DorrH)/th, xd0 = DorrX - 2*RB - DorrB;
  const nP = Math.max(1, Math.ceil((xd0 + L2)/800)), posts = [];
  for (let i = 1; i < nP; i++) posts.push(-L2 + i*(xd0 + L2)/nP);
  const dorrRyms = xd0 > -L2 + 300 && tRel([xd0, z45 + DorrH + 45]) <= -45;
  if (!dorrRyms) W.push('Dörren 70×190 ryms inte i framgaveln vid den här takvinkeln/längden.');
  const gavel = (y0, y1, fram) => {
    const rk = !fram && P.stal ? 'stalregel' : 'tra', rn = rk === 'stalregel' ? ' (stålregel/skena)' : '';
    const nm = fram ? 'fram' : 'bak';
    prismY(clip(rect(-L2, L2 - VD/sh, G, z45), under(0)), y0, y1, rk, 'vagg', 'Gavelsyll ' + nm + rn);
    const ram = clip(clip(clip(rect(-L2 - 2000, L2 + 2000, z45, 1e5), under(0)), innanf(VD)), p => -45 - tRel(p));
    prismY(ram, y0, y1, rk, 'vagg', 'Överram ' + nm + rn);
    const stud = (x0, nmS) => prismY(clip(clip(rect(x0, x0 + 45, z45, 1e5), under(-45)), innanf(VD)), y0, y1, rk, 'vagg', nmS + rn);
    posts.forEach((x, i) => stud(x - 22.5, 'Glasstolpe ' + (i+1) + ' ' + nm));
    if (dorrRyms) {
      stud(xd0, 'Dörrstolpe ' + nm); stud(DorrX - RB, 'Dörrstolpe ' + nm);
      box(xd0 + RB, DorrX - RB, y0, y1, z45 + DorrH, z45 + DorrH + 45, rk, 'vagg', fram ? 'Dörröverstycke' : 'Kortling' + rn);
    }
    if (fram) {
      const gy0 = VD/2 - V.GlasT/2, gy1 = VD/2 + V.GlasT/2;
      const pane = (x0, x1, zb) => { const p = clip(clip(rect(x0 + 8, x1 - 8, zb + 8, 1e5), under(-53)), innanf(VD + 8));
        if (p.length > 2 && Math.abs(area(p)) > 2e4) { prismY(p, gy0, gy1, 'glas', 'vagg', 'Glas ' + V.glas); GLAS_M2 += Math.abs(area(p))*1e-6; } };
      const edges = [-L2, ...posts.flatMap(x => [x - 22.5, x + 22.5]), xd0];
      for (let i = 0; i < edges.length; i += 2) pane(edges[i], edges[i+1], z45);
      if (dorrRyms) {
        pane(xd0 + RB, DorrX - RB, z45 + DorrH + 45); pane(DorrX, L2, z45);
        box(xd0 + RB + 4, DorrX - RB - 4, 0, 40, z45 + 4, z45 + DorrH - 4, 'panel', 'vagg', 'Dörrblad 70×190');
      } else pane(xd0, L2, z45);
    } else {
      if (!dorrRyms) stud(xd0, 'Regel');
      const pan = clip(clip(rect(-L2 - 30, L2 + 30, G - 30, 1e5), under(0)), innanf(0));
      prismY(pan, Dj, Dj + PanelT, 'panel', 'vagg', 'Bakgavelpanel 22');
    }
  };
  gavel(0, VD, true); gavel(Dj - VD, Dj, false);

  // ---- 3 TAK
  const sparre = [pt(0, 0), pt(sW(0), 0), pt(sW(TH), TH), pt(sF(TH), TH)];
  const OB = P.KarmB + 40, OL = P.KarmL + 20, S1 = P.FonsterS, S2 = S1 + OL, y1 = Dj/2 - OB/2, y2 = Dj/2 + OB/2;
  let fon = P.fonster, cLo = null, cHi = null;
  if (fon) {
    const C = [22.5, ...yS, Dj - 22.5];
    for (const cc of C) if (cc + 67.5 <= y1 - 45) cLo = cc;
    for (const cc of [...C].reverse()) if (cc - 67.5 >= y2 + 45) cHi = cc;
    if (cLo === null || cHi === null) { W.push('Takfönstret är för brett för gaveln/djupet – inte ritat.'); fon = false; }
    if (S1 < sF(TH) + 300) { W.push('Takfönstret ligger för nära takfoten – inte ritat.'); fon = false; }
    if (S2 + VB > sW(TH) - 200) { W.push('Takfönstret når nocken – inte ritat. Minska höjden/avståndet.'); fon = false; }
  }
  prismY(sparre, 0, 45, 'tra', 'tak', 'Gavelsparre 45×' + TH); prismY(sparre, Dj-45, Dj, 'tra', 'tak', 'Gavelsparre 45×' + TH);
  let kapade = 0;
  for (const y of yS) {
    if (fon && y > cLo && y < cHi) {
      kapade++;
      prismY([pt(0, 0), pt(S1 - VB, 0), pt(S1 - VB, TH), pt(sF(TH), TH)], y-22.5, y+22.5, 'tra', 'tak', 'Sparre (kapad) 45×' + TH);
      prismY([pt(S2 + VB, 0), pt(sW(0), 0), pt(sW(TH), TH), pt(S2 + VB, TH)], y-22.5, y+22.5, 'tra', 'tak', 'Sparre (kapad) 45×' + TH);
    } else prismY(sparre, y-22.5, y+22.5, 'tra', 'tak', 'Sparre 45×' + TH);
  }
  const slab = (ta, tb, s0, s1, y0, y1, key, name) => {           // s1 = null → till högväggen
    const pts = s1 === null ? [pt(s0, ta), pt(sW(ta), ta), pt(sW(tb), tb), pt(s0, tb)] : [pt(s0, ta), pt(s1, ta), pt(s1, tb), pt(s0, tb)];
    return prismY(pts, y0, y1, key, 'tak', name);
  };
  const lager = (ta, tb, s0, key, name) => {
    if (!fon) return slab(ta, tb, s0, null, 0, Dj, key, name);
    slab(ta, tb, s0, S1, 0, Dj, key, name); slab(ta, tb, S2, null, 0, Dj, key, name);
    slab(ta, tb, S1, S2, 0, y1, key, name); slab(ta, tb, S1, S2, y2, Dj, key, name);
  };
  lager(TH, TH + TT, sF(TH), 'skiva', 'Takskiva plywood ' + TT);
  lager(TH + TT, Tp, sF(TH) - 20, 'papp', 'Dubbelpapp (underlag + ytpapp)');
  for (const [y0, y1v] of [[-PanelT, 0], [Dj, Dj + PanelT]])
    prismY([pt(sF(TH) - 22, TH - 60), pt(sW(TH - 60), TH - 60), pt(sW(Tt + 20), Tt + 20), pt(sF(TH) - 22, Tt + 20)], y0, y1v, 'panel', 'tak', GR ? 'Vindskiva 22 (håller gräset)' : 'Vindskiva 22');
  // nockplåt
  const xp = xout(NT) + PanelT/sh, sXp = (xp + L2 + S*Tt)/c;
  slab(Tt, Tt + 2, sTop - 150, sXp + 2, -PanelT, Dj + PanelT, 'plat', 'Nockplåt 0,7');
  prismY([[xp, NT - 150], [xp + 2, NT - 150], [xp + 2, G + (xp + 2 + L2)*Math.tan(t) + (Tt + 2)/c], [xp, G + (xp + L2)*Math.tan(t) + Tt/c]], -PanelT, Dj + PanelT, 'plat', 'tak', 'Nockplåt 0,7');
  // spikplåtar vid nocken (båda sidor av sparre + stolpe)
  for (const y of yS) for (const yy of [y - 24, y + 22.5]) {
    const s0 = sW(0) - 230;
    prismY([pt(s0, 15), pt(sW(15) - 15, 15), pt(sW(15 + 100) - 15, 115), pt(s0, 115)], yy, yy + 1.5, 'stal', 'kop', 'Spikplåt 100×200×1,5 FZV');
  }
  if (fon) {
    const yA = cLo + 22.5, yB = cHi - 22.5;
    prismY([pt(0, 0), pt(sW(0), 0), pt(sW(TH), TH), pt(sF(TH), TH)], yA, yA + 45, 'tra', 'tak', 'Systersparre 45×' + TH);
    prismY([pt(0, 0), pt(sW(0), 0), pt(sW(TH), TH), pt(sF(TH), TH)], yB - 45, yB, 'tra', 'tak', 'Systersparre 45×' + TH);
    slab(0, TH, S1 - VB, S1, yA + 45, yB - 45, 'tra', 'Växel 45×' + TH);
    slab(0, TH, S2, S2 + VB, yA + 45, yB - 45, 'tra', 'Växel 45×' + TH);
    slab(0, TH, S1, S2, y1 - 45, y1, 'tra', 'Fönsterregel 45×' + TH);
    slab(0, TH, S1, S2, y2, y2 + 45, 'tra', 'Fönsterregel 45×' + TH);
    // Velux: karm (ring 60), glas, plåtkrage
    const sc = (S1 + S2)/2, a0 = sc - P.KarmL/2, a1 = sc + P.KarmL/2, b0 = Dj/2 - P.KarmB/2, b1 = Dj/2 + P.KarmB/2, dk = GR ? Tt + 60 - (TH + 38) : 0, k0 = TH - 60 + dk, k1 = TH - 60 + 98 + dk;
    const vn = 'Velux GGL ' + P.velux.split(' ')[0];
    const vk = (sa, sb, ya, yb) => prismY([pt(sa, k0), pt(sb, k0), pt(sb, k1), pt(sa, k1)], ya, yb, 'velux', 'kop', vn);
    vk(a0, a1, b0, b0 + 60); vk(a0, a1, b1 - 60, b1); vk(a0, a0 + 60, b0 + 60, b1 - 60); vk(a1 - 60, a1, b0 + 60, b1 - 60);
    prismY([pt(a0 + 60, k1 - 30), pt(a1 - 60, k1 - 30), pt(a1 - 60, k1 - 26), pt(a0 + 60, k1 - 26)], b0 + 60, b1 - 60, 'glas', 'kop', vn + ' – glas');
    const kr = (sa, sb, ya, yb) => slab(Tp, Tp + 2, sa, sb, ya, yb, 'plat', 'Plåtkrage Velux');
    if (GR) { const up = (sa, sb, ya, yb) => slab(Tp, k0 + 10, sa, sb, ya, yb, 'plat', 'Karmförhöjning plåt (över gräset)');
      up(S1, S2, y1, y1 + 3); up(S1, S2, y2 - 3, y2); up(S1, S1 + 3, y1, y2); up(S2 - 3, S2, y1, y2); }
    kr(S1 - 100, S1, y1 - 100, y2 + 100); kr(S2, S2 + 200, y1 - 100, y2 + 100); kr(S1, S2, y1 - 100, y1); kr(S1, S2, y2, y2 + 100);
    KG.velux = P.KarmL*P.KarmB*1e-6*25;
    label(vn + ' (öppning ' + OB + '×' + OL + ')', ...(() => { const p = pt(sc, Tt + 140); return [p[0], Dj/2, p[1]]; })()).userData.g2 = 'kop';
  }

  // ---- GRÄSTAK (Hugo: trots lutningen) – dränmatta/substrat + gräs på dubbelpapp, skjutskydd och takfotslist
  if (GR) {
    const g0 = sF(TH) + 30, mg = 100;                                           // grusremsa 100 runt takfönstret
    const gl = (s0, s1, ya, yb) => prismY([pt(s0, Tp), s1 === null ? pt(sW(Tp), Tp) : pt(s1, Tp), s1 === null ? pt(sW(Tt), Tt) : pt(s1, Tt), pt(s0, Tt)], ya, yb, 'gras', 'tak', 'Grästak ' + GR + ' mm (substrat + vegetation)');
    if (!fon) gl(g0, null, 0, Dj);
    else { gl(g0, S1 - mg, 0, Dj); gl(S2 + mg, null, 0, Dj); gl(S1 - mg, S2 + mg, 0, y1 - mg); gl(S1 - mg, S2 + mg, y2 + mg, Dj);
      const gr = (s0, s1, ya, yb) => prismY([pt(s0, Tp + 2), pt(s1, Tp + 2), pt(s1, Tp + 32), pt(s0, Tp + 32)], ya, yb, 'grus', 'tak', 'Grusremsa');
      gr(S1 - mg, S1, y1 - mg, y2 + mg); gr(S2, S2 + mg, y1 - mg, y2 + mg); gr(S1, S2, y1 - mg, y1); gr(S1, S2, y2, y2 + mg); }
    prismY([pt(sF(TH) - 20, Tp), pt(sF(TH) + 30, Tp), pt(sF(TH) + 30, Tt + 20), pt(sF(TH) - 20, Tt + 20)], 0, Dj, 'impr', 'tak', 'Takfotslist 50 trä (håller gräset)');
    if (P.skjut) for (let sL = g0 + 500; sL < sTop - 200; sL += 500) {
      const lst = (ya, yb) => prismY([pt(sL, Tp + 2), pt(sL + 45, Tp + 2), pt(sL + 45, Tp + 2 + Math.min(50, GR - 10)), pt(sL, Tp + 2 + Math.min(50, GR - 10))], ya, yb, 'impr', 'tak', 'Skjutskydd läkt 45×50 c/c 500');
      if (fon && sL + 45 > S1 - mg && sL < S2 + mg) { lst(0, y1 - mg); lst(y2 + mg, Dj); } else lst(0, Dj);
    }
    // tuvor
    const tuft = new THREE.ConeGeometry(16, 85, 5); tuft.translate(0, 38, 0);
    const N = Math.round((sTop - g0)*Dj*1e-6*160), im = new THREE.InstancedMesh(tuft, solidM.tuva, N);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), col = new THREE.Color(); let n = 0;
    for (let i = 0; i < N*1.4 && n < N; i++) {
      const s_ = g0 + 40 + rnd()*(sTop - g0 - 120), y_ = 25 + rnd()*(Dj - 50);
      if (fon && s_ > S1 - mg - 30 && s_ < S2 + mg + 30 && y_ > y1 - mg - 30 && y_ < y2 + mg + 30) continue;
      const p = pt(s_, Tt - 10), k = .6 + rnd()*.9;
      e.set((rnd() - .5)*.5, rnd()*6.3, (rnd() - .5)*.5); q.setFromEuler(e);
      m4.compose(new THREE.Vector3(p[0], p[1], y_), q, new THREE.Vector3(k, k*(.7 + rnd()*.8), k)); im.setMatrixAt(n, m4);
      im.setColorAt(n, col.set(rnd() < .08 ? '#c9b24a' : rnd() < .5 ? '#5f8f35' : '#7aa845').offsetHSL(0, 0, (rnd() - .5)*.08)); n++;
    }
    im.count = n; im.castShadow = true; im.userData = {key:'tuva', grp:'tak', name:'Gräs'}; root.add(im);
    KG.gras = (KG.gras||0);
  }

  // ---- INVÄNDIG KLÄDSEL: plywood 9 mm (ljus beige) på högvägg + bakgavel, ribbtak i mattoljad ask på svart filt
  if (P.klad) {
    const PT = 9, RT = 21, FT = 3, CT = FT + RT, J = 3;                          // plywood, ribba, filt, fog
    const xin = z => L2 - VD/sh - (z - G)/th;
    const [pw, ph] = P.PanelOr.startsWith('Liggande') ? [1400, 900] : [900, 1400];
    const ytak = under(-CT), golv = p => G - p[1];
    const yA = VD, yB = Dj - VD;
    // högväggen: lutande skivor (inner yta på stolparnas insida)
    for (let za = G; za < NT; za += ph) {
      const zb = za + ph - J;
      for (let ya = yA; ya < yB - 50; ya += pw) {
        const yb2 = Math.min(ya + pw - J, yB);
        const poly = clip([[xin(za), za], [xin(za) - PT/sh, za], [xin(zb) - PT/sh, zb], [xin(zb), zb]], ytak);
        const nm = 'Plywood 9 mm ' + pw + '×' + ph + ' (högvägg)';
        if (NI && yb2 > yN0 + VD) {
          if (ya < yN0 + VD) prismY(poly, ya, yN0 + VD, 'plywood', 'inner', nm);
        } else prismY(poly, ya, yb2, 'plywood', 'inner', nm);
      }
    }
    if (NI) {                                                                      // nischen invändigt
      prismY(clip(band(z => xNi(z) - PT/shN, xNi, G, zC), ytak), yN0 + VD, Dj - VD, 'plywood', 'inner', 'Plywood 9 mm (nisch, lutande vägg)');
      const sd = clip(between(z => xin(z), z => xNi(z) - PT/shN, G, zC), ytak);
      prismY(sd, yN0 + VD, yN0 + VD + PT, 'plywood', 'inner', 'Plywood 9 mm (nisch, sida)');
      prismY(sd, Dj - VD - PT, Dj - VD, 'plywood', 'inner', 'Plywood 9 mm (nisch, bakgavel)');
    }
    // bakgaveln: skivor i rutnät, klippta mot takets undersida och högväggens skivor
    for (let za = G; za < NT; za += ph) for (let xa = -L2; xa < L2; xa += pw) {
      const poly = clip(clip(clip(rect(xa, xa + pw - J, za, za + ph - J), ytak), innanf(VD + PT)), golv);
      if (poly.length > 2 && Math.abs(area(poly)) > 4e4) prismY(poly, Dj - VD - PT, Dj - VD, 'plywood', 'inner', 'Plywood 9 mm ' + pw + '×' + ph + ' (bakgavel)');
    }
    // innertak: svart filt + ribbor längs takfallet
    const remsa = (q0, q1) => clip(clip([pt(-2000, q0), pt(9000, q0), pt(9000, q1), pt(-2000, q1)], golv), innanf(VD + PT));
    const filt = remsa(-FT, 0);
    const hal = fon ? [y1, y2] : null;
    const sMin = Math.min(...filt.map(p => (p[0] + L2)*c + (p[1] - G)*S));
    const sMax = Math.max(...filt.map(p => (p[0] + L2)*c + (p[1] - G)*S));
    const sDel = (poly, s0, s1) => clip(clip(poly, p => s0 - ((p[0] + L2)*c + (p[1] - G)*S)), p => ((p[0] + L2)*c + (p[1] - G)*S) - s1);
    const del = (poly, ya, yb, key, nm) => {
      if (hal && yb > hal[0] && ya < hal[1]) {
        prismY(sDel(poly, sMin - 50, S1), ya, yb, key, 'inner', nm); prismY(sDel(poly, S2, sMax + 50), ya, yb, key, 'inner', nm);
        if (ya < hal[0]) prismY(sDel(poly, S1, S2), ya, hal[0], key, 'inner', nm);
        if (yb > hal[1]) prismY(sDel(poly, S1, S2), hal[1], yb, key, 'inner', nm);
      } else prismY(poly, ya, yb, key, 'inner', nm);
    };
    del(filt, yA, yB, 'filt', 'Svart akustikfilt');
    const n0 = root.children.length;
    const rib = remsa(-CT, -FT), cc = P.RibbB + P.RibbSpalt, nRib = Math.floor((yB - yA + P.RibbSpalt)/cc), y0r = yA + (yB - yA - (nRib*cc - P.RibbSpalt))/2;
    for (let i = 0; i < nRib; i++) del(rib, y0r + i*cc, y0r + i*cc + P.RibbB, 'ask', 'Ribba ask ' + RT + '×' + P.RibbB + ' mattoljad');
    if (fon) {                                                                     // smygar runt takfönstret
      const sm = (sa, sb, ya, yb) => prismY([pt(sa, -CT), pt(sb, -CT), pt(sb, TH - 60 + (GR ? Tt + 60 - (TH + 38) : 0)), pt(sa, TH - 60 + (GR ? Tt + 60 - (TH + 38) : 0))], ya, yb, 'ask', 'inner', 'Smyg ask 12');
      sm(S1, S2, y1, y1 + 12); sm(S1, S2, y2 - 12, y2); sm(S1, S1 + 12, y1 + 12, y2 - 12); sm(S2 - 12, S2, y1 + 12, y2 - 12);
    }
    for (let i = n0; i < root.children.length; i++) root.children[i].userData.grp = 'innertak';
    root.children[n0 - 1].userData.grp = 'innertak'; if (hal) for (let i = n0 - 4; i < n0; i++) if (root.children[i].userData.key === 'filt') root.children[i].userData.grp = 'innertak';
    D_klad = {nRib, pw, ph};
  }

  // ---- Ifö Spira 6260 (355 × 650 × 860, sitthöjd 420) i hörnet bakgavel/högvägg (bakgaveln har inget glas)

    toa = {cx, fri: xin(G + 1150) - cx, front: yb - 650, takOverSits: rb(cx - 200) - G};
    const por = (g, n) => add(g, 'porslin', 'inred', n);
    let g = new THREE.CylinderGeometry(178, 150, 380, 32); g.scale(1, 1, 1.22); g.translate(cx, G + 190, yb - 650 + 217); por(g, 'Ifö Spira 6260 – skål');
    g = new THREE.BoxGeometry(300, 380, 260); g.translate(cx, G + 190, yb - 190 - 130 + 60); por(g, 'Ifö Spira 6260 – fot');
    g = new THREE.CylinderGeometry(182, 182, 30, 32); g.scale(1, 1, 1.24); g.translate(cx, G + 405, yb - 650 + 222); por(g, 'Ifö Spira 6260 – sits och lock (sitthöjd 420)');
    g = new THREE.BoxGeometry(355, 470, 190); g.translate(cx, G + 860 - 235, yb - 95); por(g, 'Ifö Spira 6260 – cisternkåpa (höjd 860)');
    g = new THREE.CylinderGeometry(28, 28, 6, 20); g.translate(cx, G + 863, yb - 95); add(g, 'krom', 'inred', 'Spolknapp 4/2 l');
    KG.toa = 30;
    label('Ifö Spira 6260', cx, yb - 330, G + 1050).userData.g2 = 'inred';
    if (toa.fri < 380) W.push('Toaletten: för lite armbågsrum mot högväggen.');
    if (toa.takOverSits < 1250) W.push('Toaletten: lågt i tak framför stolen.');
    if (yb - 650 - VD < 900) W.push('Toaletten: kort fritt golv framför stolen – bredda poden.');
  }

  // ---- HANDFAT i nischen: litet väggmonterat handfat ~450×300 framför toaletten, spegel ovanför

    const yc = yN0 + VD + (P.klad ? 9 : 0) + 270, xw = xinN(G + 850);
    let g = new THREE.CylinderGeometry(225, 190, 150, 32, 1, false, 0, Math.PI); g.scale(300/225, 1, 1); g.rotateY(Math.PI); g.translate(xw, G + 775, yc);
    add(g, 'porslin', 'inred', 'Handfat ca 450×300, väggmonterat (överkant 850)');
    g = new THREE.CylinderGeometry(14, 14, 160, 12); g.translate(xw - 50, G + 930, yc); add(g, 'krom', 'inred', 'Blandare');
    g = new THREE.BoxGeometry(150, 14, 14); g.translate(xw - 115, G + 1005, yc); add(g, 'krom', 'inred', 'Blandare');
    prismY(band(z => xinN(z) - 6/sh, xinN, G + 1000, G + 1650), yc - 220, yc + 220, 'spegel', 'inred', 'Spegel');
    KG.handfat = 15;
    if (yc + 225 > (toa ? toa.front : 1e9) - 50) W.push('Handfatet krockar med toaletten – bredda nischen.');
  }

  // ---- SÄNG 180×200 på förvaringsskåp (ForvH) + två väggmonterade nattduksbord, huvudänden mot bakgaveln
  let seng = null;
  if (P.seng) {
    const MH = 200, top = P.ForvH + MH, NS = 400, NSD = 300, ybk = Dj - VD - (P.klad ? 9 : 0);
    const ceil = x => (x + L2)*Math.tan(t) - (P.klad ? 24 : 0);                  // takhöjd över golv vid x
    const xa = -L2 + (top + 150 + 24)/Math.tan(t) + NS;                         // vänster nattduksbord måste få plats under snedtaket
    const xb = xa + 1800, ya = ybk - 2010, yb = ybk - 10;
    const toaV = toa ? toa.cx - 178 : 1e9;
    seng = {xa, xb, fri: toaV - (xb + NS), takVidHuvud: ceil((xa + xb)/2) - top, gang: xin0(G + 900) - Math.max(xb, -1e9)};
    if (seng.fri < 20) W.push('Sängen + högra nattduksbordet krockar med toaletten – öka golvlängden (' + Math.round(-seng.fri + 20) + ' mm fattas).');
    // förvaringsskåp: stomme + luckor mot fotänden och mot gången
    box(xa, xb, ya, yb, G, G + P.ForvH - 20, 'skap', 'inred', 'Förvaringsskåp under säng, h ' + P.ForvH);
    box(xa, xb, ya, yb, G + P.ForvH - 20, G + P.ForvH, 'skap', 'inred', 'Sängbotten plywood 20');
    const nl = 3, lw = 1800/nl;
    for (let i = 0; i < nl; i++) box(xa + i*lw + 4, xa + (i + 1)*lw - 4, ya - 18, ya, G + 70, G + P.ForvH - 26, 'front', 'inred', 'Låda fotände ' + Math.round(lw - 8) + '×' + (P.ForvH - 96));
    const nr = 3, rw = 2000/nr;
    for (let i = 0; i < nr; i++) box(xb, xb + 18, ya + i*rw + 4, ya + (i + 1)*rw - 4, G + 70, G + P.ForvH - 26, 'front', 'inred', 'Skåplucka sida ' + Math.round(rw - 8) + '×' + (P.ForvH - 96));
    for (const [x0, x1, y0, y1] of [[xa + 60, xb - 60, ya + 60, ya + 105], [xa + 60, xb - 60, yb - 105, yb - 60], [xa + 60, xa + 105, ya + 105, yb - 105], [xb - 105, xb - 60, ya + 105, yb - 105]])
      box(x0, x1, y0, y1, G, G + 70, 'tra', 'inred', 'Sockel 45×70 (indragen 60)');
    box(xa + 10, xb - 10, ya + 10, yb - 10, G + P.ForvH, G + top, 'madrass', 'inred', 'Madrass 180×200');
    box(xa + 20, xb - 20, ya + 30, yb - 520, G + top, G + top + 60, 'tacke', 'inred', 'Täcke');
    for (const xc of [xa + 450, xb - 450]) { const g = new THREE.CapsuleGeometry(60, 520, 4, 12); g.rotateZ(Math.PI/2); g.scale(1, .9, 2.8); g.translate(xc, G + top + 60, yb - 270); add(g, 'kudde', 'inred', 'Kudde'); }
    // nattduksbord: väggmonterade lådor på bakgaveln, ovansida 50 över madrassen
    for (const [x0, nm] of [[xa - NS - 30, 'vänster'], [xb + 30, 'höger']]) {
      box(x0, x0 + NS, ybk - NSD, ybk, G + top - 130, G + top + 50, 'ask', 'inred', 'Nattduksbord ' + nm + ' ' + NS + '×' + NSD + ' (väggmonterat)');
      box(x0 + 20, x0 + NS - 20, ybk - NSD - 3, ybk - NSD, G + top - 110, G + top + 30, 'front', 'inred', 'Låda');
    }
    KG.seng = 75 + 35 + 2*8;
    label('Säng 180×200, förvaring ' + P.ForvH, (xa + xb)/2, ya - 200, G + top + 250).userData.g2 = 'inred';
    if (seng.takVidHuvud < 900) W.push('Lågt över sängen: ' + Math.round(seng.takVidHuvud) + ' mm från madrass till tak mitt på sängen.');
  }

  // ---- person 180 cm
  const pg = new THREE.CapsuleGeometry(170, 1420, 6, 16); pg.translate(L2 - 900, G + 900, 700);
  add(pg, 'person', 'person', 'Person 180 cm');

  // ---- mått
  label('Nock ' + (NT/1000).toFixed(2).replace('.', ',') + ' m ö. mark', xout(NT) + 250, -150, NT + 120, NT > 4000);
  label('Golv ' + (P.GolvL/1000).toFixed(2).replace('.', ',') + ' × ' + (Dj/1000).toFixed(2).replace('.', ',') + ' m', 0, -350, G);
  label('Takfall ' + P.TakV + '°', ...(() => { const p = pt(sW(0)*.32, Tt + 150); return [p[0], -200, p[1]]; })());

  // ---- vikt + info
  const kgV = (KG.tra||0) + (KG.impr||0) + (KG.skiva||0) + (KG.panel||0) + (KG.stalregel||0);
  const kgK = (KG.plywood||0) + (KG.ask||0) + (KG.filt||0);
  const kgG = GLAS_M2*V.GlasKg;
  D = {variant:P.variant, G, NH, NX, NT, TakV:P.TakV, sparrL:(sW(TH) - sF(TH)), takyta:(sTop - sF(TH) + 20)*Dj*1e-6,
       sparrar: yS.length, kapade, fon, kg:{virke:kgV, glas:kgG, papp:KG.papp||0, plat:(KG.plat||0)+(KG.stal||0), velux:KG.velux||0, gras:KG.gras||0, toa:(KG.toa||0) + (KG.handfat||0), seng:KG.seng||0, klad:kgK},
       seng,
       klad:D_klad,
       toa,
       warn:W, dorrRyms, GR};
  D.kg.tot = Object.values(D.kg).reduce((a, b) => a + b, 0);
  D.stalM = (KG.stalregel||0)/((VD <= 70 ? 0.7 : 1.0)); D.stalVD = VD;
  if (NT > 4000) W.push('Nocken är ' + (NT/1000).toFixed(2).replace('.', ',') + ' m över mark – över attefallsgränsen 4,0 m.');
  if (P.TakV < 14) W.push('Flackt för papp på råspont – kräver takduk/membran.');
  if (GR && P.TakV > 27) W.push('Grästak på ' + P.TakV + '° – brantare än leverantörernas rek. (VegTech max 27°). Kräver skjutskydd/nät och kan glida; vattnar ur snabbt.');
  // höj spelet efter bygg
  const target = new THREE.Vector3(0, NT/2000 + .2, Dj/2000);
  D.target = target;
}

function applyMode() {
  const ghost = P.vy === 'Ghost', wire = P.vy === 'Wireframe';
  document.body.classList.toggle('ghost', ghost);
  scene.background = new THREE.Color(ghost ? '#11171f' : '#FCC222');
  scene.fog = ghost ? new THREE.Fog('#11171f', 5, 30) : null;
  ground.visible = !ghost && !wire; grid.visible = ghost;
  const hl = {Inget:null, Grund:'grund', 'Vägg':'vagg', Tak:'tak', 'Köpdelar':'kop', Inredning:'inred', 'Invändigt':'inner'}[P.fram];
  for (const k in ghostM) { const f = ['ask', 'plywood', 'filt', 'tuva'].includes(k) ? .25 : 1; ghostM[k].opacity = P.ghostOp*f; edgeG[k].opacity = Math.min(1, .22 + P.ghostOp*2.2)*f; }
  root.traverse(o => {
    if (o.isCSS2DObject) { o.visible = P.matt && (!o.userData.g2 || P[o.userData.g2] !== false) && !(o.userData.g2 === 'inred' && P.tak && P.vy === 'Solid'); return; }
    if (!o.isMesh || !o.userData.key) return;
    const {key, grp} = o.userData;
    o.visible = grp === 'innertak' ? (P.inner && P.tak) : P[grp] !== false;
    const ghostIt = ghost && hl !== grp;
    o.material = wire ? NONE : ghostIt ? ghostM[key] : solidM[key];
    o.castShadow = !ghost && !wire;
    const e = o.userData.edge; if (e) e.material = wire ? edgeW : ghostIt ? edgeG[key] : edgeS;
  });
  lampa.visible = P.ljus; lampa.position.set(-0.2, (D.G + 1100)/1000, P.Djup/2000);
  const cp = P.snitt ? [plane] : [];
  plane.constant = P.snittY/1000;
  for (const m of [...ALLM, ground.material]) { if (m === ground.material) continue; m.clippingPlanes = cp; m.needsUpdate = true; }
}

fS.add(P, 'tak').name('3 Tak').onChange(applyMode);
fS.add(P, 'kop').name('Köpdelar').onChange(applyMode);
fS.add(P, 'matt').name('Måttetiketter').onChange(applyMode);
fS.add(P, 'inner').name('Invändig klädsel').onChange(applyMode);
fS.add(P, 'inred').name('Inredning').onChange(applyMode);
fS.add(P, 'person').name('Person 180 cm').onChange(applyMode);
fS.add(P, 'ljus').name('Innerbelysning').onChange(applyMode);
const fC = gui.addFolder('Kameravyer');
for (const n of Object.keys(views)) fC.add({f: () => go(n)}, 'f').name(n);
const fE = gui.addFolder('Dela / export');
fE.add({f: async () => { saveHash(); await new Promise(r => setTimeout(r, 350)); try { await navigator.clipboard.writeText(location.href); toast('Länk kopierad – öppnar med samma inställningar'); } catch(e) { toast(location.href); } }}, 'f').name('Kopiera delningslänk');
fE.add({f: () => { renderer.render(scene, camera); const a = document.createElement('a'); a.href = renderer.domElement.toDataURL('image/png'); a.download = 'naturepod.png'; a.click(); }}, 'f').name('Spara PNG');
fE.add({f: () => new GLTFExporter().parse(root, g => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([g], {type:'model/gltf-binary'})); a.download = 'naturepod.glb'; a.click(); }, e => toast('GLB-fel'), {binary:true})}, 'f').name('Exportera GLB');
fE.add({f: () => { Object.assign(P, DEF); gui.controllersRecursive().forEach(c => c.updateDisplay()); nb(); go('Långa takfallet'); }}, 'f').name('Återställ');
[fM, fE].forEach(f => f.close());
const mobile = matchMedia('(max-width:700px)').matches;
if (mobile) gui.close();
document.getElementById('info').addEventListener('click', e => { if (mobile) e.currentTarget.classList.toggle('open'); });

// ---------------------------------------------------------------- klick = namn + mått
let tt = 0;
function toast(s) { const t = document.getElementById('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3200); }
const ray = new THREE.Raycaster(); let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2 - 1, -e.clientY/innerHeight*2 + 1), camera);
  const hit = ray.intersectObjects(root.children, false).find(i => i.object.visible && i.object.userData.name &&
      (!P.snitt || i.point.z <= P.snittY/1000 + 1e-4));
  if (!hit) return;
  const g = hit.object.geometry; g.computeBoundingBox(); const s = new THREE.Vector3(); g.boundingBox.getSize(s);
  const dm = [s.x, s.y, s.z].map(Math.round).sort((a, b) => b - a);
  toast(hit.object.userData.name + ' — ' + dm.join(' × ') + ' mm (omskrivande låda)');
});

// ---------------------------------------------------------------- loop
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); lr.setSize(innerWidth, innerHeight); });
function frame() {
  controls.update();
  if (scene.fog) { const d = camera.position.distanceTo(controls.target); scene.fog.near = d - 1.5 - (1 - P.fog)*4; scene.fog.far = d + 1 + (1 - P.fog)*14; }
  renderer.render(scene, camera); lr.render(scene, camera);
}
renderer.setAnimationLoop(frame);
nb(); go('Långa takfallet');
window.__P = P; window.__rebuild = nb; window.__views = go; window.__D = () => D; window.__frame = frame; window.__apply = applyMode;
window.__three = {THREE, scene, renderer, camera, controls, root, ground, gui};
</script>
